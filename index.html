<!DOCTYPE html>
<html lang="nl">
<head>
<script>
  (function(){
    try{
      var t = localStorage.getItem('studeerhub_theme');
      if(t === 'dark' || t === 'light'){
        document.documentElement.setAttribute('data-theme', t);
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studeerhub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #F6F7FA;
    --sidebar-bg: #ECEFF4;
    --panel-bg: #FFFFFF;
    --panel-bg-soft: #FAFBFD;
    --input-bg: #FFFFFF;
    --border: #DCE1EA;
    --text: #262A31;
    --text-soft: #5B6270;
    --accent: #3454D1;
    --accent-soft: #E8ECFB;
    --danger: #C1432E;
    --danger-soft: #FBEAE6;
    --mark-bg: #FFE7A0;
    --mark-text: #262A31;
    --shadow: 0 10px 40px rgba(0,0,0,0.2);
    --overlay: rgba(20,24,32,0.4);
    --hover-overlay: rgba(0,0,0,0.045);
    --hover-overlay-strong: rgba(0,0,0,0.08);
    --radius: 10px;
    --font-body: 'Atkinson Hyperlegible', 'Verdana', system-ui, sans-serif;
    --font-display: 'Fraunces', Georgia, serif;
  }
  html[data-theme="dark"]{
    --bg: #1B1D22;
    --sidebar-bg: #202329;
    --panel-bg: #24272E;
    --panel-bg-soft: #2A2E36;
    --input-bg: #2A2E36;
    --border: #383D47;
    --text: #EDEFF3;
    --text-soft: #A2A8B5;
    --accent: #7C9BFF;
    --accent-soft: #2B3555;
    --danger: #E58A78;
    --danger-soft: #3E2A26;
    --mark-bg: #7A6420;
    --mark-text: #FFF3D0;
    --shadow: 0 10px 40px rgba(0,0,0,0.5);
    --overlay: rgba(0,0,0,0.6);
    --hover-overlay: rgba(255,255,255,0.06);
    --hover-overlay-strong: rgba(255,255,255,0.1);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: 0.01em;
    transition: background .15s ease, color .15s ease;
  }
  #app{ display:flex; height:100vh; overflow:hidden; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width: 300px;
    min-width: 300px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-header{
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand{
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-mark{
    display:inline-flex;
    width: 26px; height:26px;
    border-radius: 7px;
    background: var(--accent);
    color:#fff;
    align-items:center;
    justify-content:center;
    font-family: var(--font-display);
    font-size: 14px;
    flex-shrink:0;
  }
  #search{
    width:100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-family: var(--font-body);
    font-size: 14.5px;
    background: var(--input-bg);
    color: var(--text);
  }
  #search:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }

  .tree-scroll{
    flex:1;
    overflow-y: auto;
    padding: 10px 8px 16px;
  }
  .add-subject-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding: 9px 10px;
    margin-top: 6px;
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    color: var(--text-soft);
    font-family: var(--font-body);
    font-size: 14px;
    cursor:pointer;
    text-align:left;
  }
  .add-subject-btn:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .sidebar-footer{
    flex-shrink:0;
    padding: 8px 14px;
    font-size: 10.5px;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
    text-align:center;
    opacity: 0.7;
  }

  .tree-node{ margin: 1px 0; }
  .tree-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor:pointer;
    user-select:none;
    font-size: 14.5px;
  }
  .tree-row:hover{ background: var(--hover-overlay); }
  .tree-row.selected{ background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .tree-row.dragging{ opacity: 0.4; }
  .tree-row.drag-over{ box-shadow: inset 0 2px 0 var(--accent); }
  .tree-row.drag-over-before{ box-shadow: inset 0 2px 0 var(--accent); }
  .tree-row.drag-over-after{ box-shadow: inset 0 -2px 0 var(--accent); }
  .tree-row.drag-over-nest{ background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .caret{
    width: 14px; text-align:center;
    color: var(--text-soft);
    font-size: 11px;
    flex-shrink:0;
    transition: transform .12s ease;
  }
  .caret.open{ transform: rotate(90deg); }
  .caret.hidden-caret{ visibility:hidden; }
  .dot{
    width:8px; height:8px; border-radius:50%;
    flex-shrink:0;
  }
  .tree-label{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .row-actions{
    display:flex;
    gap:2px;
    flex-shrink:0;
  }
  .icon-btn{
    border:none; background:transparent; cursor:pointer;
    color: var(--text-soft);
    font-size: 13px;
    padding: 4px 6px;
    border-radius:5px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family: var(--font-body);
  }
  .icon-btn:hover{ background: var(--hover-overlay-strong); color: var(--text); }
  .icon-btn.danger:hover{ background: var(--danger-soft); color: var(--danger); }

  .level-0 .tree-row{ font-weight: 700; }
  .level-1 { margin-left: 18px; }
  .level-2 { margin-left: 18px; }
  .level-1 .tree-row{ font-size: 14px; }
  .level-2 .tree-row{ font-size: 13.5px; color: var(--text-soft); }
  .level-2 .tree-row.selected{ color: var(--accent); }

  .add-child-row{
    margin-left: 18px;
  }
  .add-child-btn{
    display:flex; align-items:center; gap:6px;
    width:100%;
    padding: 5px 8px 5px 20px;
    background:transparent; border:none;
    color: var(--text-soft);
    font-family: var(--font-body);
    font-size: 13px;
    cursor:pointer;
    border-radius:6px;
    opacity: 0.75;
  }
  .add-child-btn:hover{ background: var(--hover-overlay); opacity:1; color: var(--accent); }
  .quick-add-row{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .quick-add-row .add-child-btn{ width:auto; flex:1 1 auto; }
  .add-child-btn-secondary{ font-size:12px; opacity:0.55; flex:0 0 auto; }
  .quick-add-input{
    flex: 1 1 auto;
    margin: 3px 0 3px 20px;
    padding: 5px 8px;
    font-family: var(--font-body);
    font-size: 13px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text);
    min-width: 0;
  }

  /* ---------- Main ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
    flex-shrink:0;
  }
  .breadcrumb{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 14px;
    color: var(--text-soft);
    flex-wrap:wrap;
  }
  .breadcrumb b{ color: var(--text); }
  .breadcrumb .sep{ color: var(--border); }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .action-group{ display:flex; gap:8px; align-items:center; }
  .action-divider{ width:1px; height:22px; background: var(--border); flex-shrink:0; }
  .btn{
    font-family: var(--font-body);
    font-size: 13.5px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor:pointer;
  }
  .btn:hover{ border-color: var(--accent); color: var(--accent); }
  .btn.primary{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .btn.primary:hover{ opacity:0.92; color:#fff; }
  .btn.icon-toggle{ font-size:16px; padding: 8px 11px; }

  #content-scroll{
    flex:1;
    overflow-y:auto;
    padding: 32px 40px 80px;
  }
  .content-inner{ max-width: 780px; margin: 0 auto; }
  .content-inner.wide{ max-width: 1140px; }

  .empty-state{
    max-width: 520px;
    margin: 60px auto;
    text-align:center;
    color: var(--text-soft);
  }
  .empty-state h2{ font-family: var(--font-display); color:var(--text); font-weight:600; }

  .paragraph-title-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom: 22px;
    flex-wrap:wrap;
  }
  .paragraph-title{
    font-family: var(--font-display);
    font-size: 27px;
    font-weight: 600;
    margin:0;
  }

  .section-card{
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 18px;
    overflow:hidden;
  }
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg-soft);
  }
  .section-label{
    font-weight: 700;
    font-size: 14.5px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .section-label-input{
    font-weight: 700;
    font-size: 14.5px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 6px;
    font-family: var(--font-body);
    background: var(--input-bg);
  }
  .section-body{ padding: 16px 18px 18px; }
  .section-body p{ margin: 0 0 12px; }
  .section-body ul{ margin: 0 0 12px; padding-left: 22px; }
  .section-body ul ul{ margin-top: 4px; margin-bottom: 4px; }
  .section-body li{ margin-bottom: 7px; }
  .section-body .empty{ color: var(--text-soft); font-style: italic; }
  .section-body strong{ color: var(--text); }
  .section-body textarea{
    width:100%;
    min-height: 140px;
    font-family: var(--font-body);
    font-size: 15px;
    line-height:1.6;
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    resize: vertical;
    color: var(--text);
    background: var(--input-bg);
  }
  .section-body textarea:focus{ outline: 2px solid var(--accent); outline-offset:1px; }
  .editor-toolbar{
    display:flex;
    gap:6px;
    margin-bottom: 6px;
  }
  .editor-toolbar .icon-btn{
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 6px 10px;
  }
  .editor-toolbar .icon-btn:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .content-image{
    max-width: 100%;
    border-radius: 8px;
    display:block;
    margin: 8px 0;
  }
  .content-attachment{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding: 7px 11px;
    margin: 6px 0;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    text-decoration:none;
    font-size: 14px;
    background: var(--panel-bg-soft);
  }
  .content-attachment:hover{ border-color: var(--accent); color: var(--accent); }
  .content-table{
    width:100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 14.5px;
  }
  .content-table th, .content-table td{
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
    vertical-align: top;
  }
  .content-table th{
    background: var(--panel-bg-soft);
    font-weight: 700;
  }
  .content-dropdown-field{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin: 4px 6px 4px 0;
  }
  .content-dropdown-label{
    font-size: 14px;
    color: var(--text-soft);
  }
  .content-dropdown-field select{
    font-family: var(--font-body);
    font-size: 14px;
    padding: 5px 8px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: var(--input-bg);
    color: var(--text);
  }
  .edit-hint{
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 6px;
  }

  .add-section-btn{
    display:flex; align-items:center; gap:8px; justify-content:center;
    width:100%;
    padding: 12px;
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-soft);
    font-family: var(--font-body);
    font-size: 14px;
    cursor:pointer;
  }
  .add-section-btn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  /* ---------- Focus mode ---------- */
  #app.focus-active #sidebar,
  #app.focus-active #topbar{
    opacity: 0.32;
    filter: saturate(0.6);
    transition: opacity .18s ease, filter .18s ease;
  }
  #app.focus-active #sidebar:hover,
  #app.focus-active #topbar:hover,
  #app.focus-active #sidebar:focus-within,
  #app.focus-active #topbar:focus-within{
    opacity: 1;
    filter: none;
  }
  #settings-btn.active{
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---------- Text settings popover ---------- */
  #topbar{ position: relative; }
  .popover{
    position:absolute;
    top: 42px;
    right: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 16px;
    width: 230px;
    z-index: 150;
  }
  .popover.hidden{ display:none; }
  .popover label{
    display:block;
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  .popover .field{ margin-bottom: 14px; }
  .popover .field:last-child{ margin-bottom: 0; }
  .popover .field-hint{ font-weight:400; text-transform:none; letter-spacing:normal; font-size:11.5px; display:block; margin-top:2px; color: var(--text-soft); }
  .popover input[type=range]{ width:100%; accent-color: var(--accent); }
  .toggle-row{ display:flex; gap:6px; }
  .toggle-option{
    flex:1;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 0;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    background: var(--panel-bg);
    color: var(--text-soft);
    cursor:pointer;
  }
  .toggle-option.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight:700;
  }
  #voice-select{
    width:100%;
    padding: 7px 8px;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
  }
  .popover .reset-link{
    background:none; border:none; color: var(--accent);
    font-family: var(--font-body); font-size: 12.5px;
    cursor:pointer; padding:0; margin-top:4px;
  }
  .popover-divider{ height:1px; background: var(--border); margin: 14px 0; }

  /* ---------- Sidebar nav (Planner) ---------- */
  .sidebar-nav{ padding: 4px 8px 8px; }
  .nav-item{
    width:100%; text-align:left;
    padding: 9px 10px;
    border-radius: 8px;
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .nav-item:hover{ background: var(--hover-overlay); }
  .nav-item.selected{ background: var(--accent-soft); color: var(--accent); }

  /* ---------- Vak-type keuze in modal ---------- */
  .type-grid{ display:flex; flex-direction:column; gap:8px; }
  .type-option{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    text-align:left;
    width:100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--panel-bg);
    font-family: var(--font-body);
    cursor:pointer;
  }
  .type-option-title{ font-size: 14px; font-weight:700; color: var(--text); }
  .type-option-hint{ font-size: 12px; color: var(--text-soft); }
  .type-option.active{ border-color: var(--accent); background: var(--accent-soft); }
  .type-option.active .type-option-title{ color: var(--accent); }

  /* ---------- Generic small overlay (add-item chooser etc.) ---------- */
  .overlay-panel{
    background: var(--panel-bg);
    border-radius: 14px;
    box-shadow: var(--shadow);
    max-height: 85vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .overlay-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .overlay-head h3{ margin:0; font-family: var(--font-display); font-size: 17px; color: var(--text); }
  .overlay-body{ padding: 16px 18px; overflow-y:auto; }
  .add-item-chooser{ display:flex; flex-direction:column; gap:8px; }

  /* ---------- Home ---------- */
  .home-today-list{ display:flex; flex-direction:column; gap:8px; }
  .home-today-item{
    display:flex; gap:10px; align-items:baseline;
    padding: 10px 12px; border-radius: 8px; background: var(--panel-bg-soft);
  }
  .home-today-item.home-important{ background: var(--danger); color:#fff; }
  .home-today-item.home-done{ background: #2E9E6D; color:#fff; }
  .home-today-vak{ font-weight:700; flex-shrink:0; min-width: 90px; }
  .home-today-text{ }
  .home-vak-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; margin-top:8px; }
  .home-vak-tile{
    display:flex; align-items:center; gap:8px;
    padding: 14px 14px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--panel-bg); cursor:pointer; font-family: var(--font-body); font-size: 14px; color: var(--text);
    text-align:left;
  }
  .home-vak-tile:hover{ border-color: var(--tile-color, var(--accent)); }
  .home-vak-dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }

  /* ---------- Cijfers ---------- */
  .grades-vak-chips{ margin: 14px 0 18px; }
  .grade-vak-chip{ cursor:pointer; background: var(--panel-bg); border: 1.5px solid var(--border); }
  .grade-vak-chip.active{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight:700; }
  .grades-table{ width:100%; border-collapse:collapse; margin-bottom:14px; }
  .grades-table th{ text-align:left; font-size:12px; color: var(--text-soft); padding: 4px 8px 8px; }
  .grades-table td{ padding: 4px 8px; }
  .grade-input{
    width: 80px; padding: 7px 9px; border-radius:7px; border:1.5px solid var(--border);
    background: var(--input-bg); color: var(--text); font-family: var(--font-body); font-size:14px;
  }
  .grade-summary{ margin-top: 10px; }
  .grade-avg{ font-size:15px; }
  .grade-avg b{ color: var(--accent); font-size:18px; }
  .grade-calc-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .grade-calc-row label{ min-width: 190px; font-size: 13.5px; color: var(--text-soft); }
  .grade-calc-result{ margin-top:10px; font-size:15px; }
  .grade-warning{ color: var(--danger); }


  /* ---------- Boeken / notities / portfolio ---------- */
  .subjects-manager{ margin-bottom: 18px; }
  .subjects-manager-label{ font-size: 13px; color: var(--text-soft); margin-bottom: 8px; }
  .chips-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--panel-bg); border: 1.5px solid var(--border);

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'studeerhub_data_v1';
  var SEED_SUBJECT = {"id": "natuurkunde", "name": "Natuurkunde", "color": "#3454D1", "chapters": [{"id": "c-0", "title": "Hoofdstuk 1: Bewegen in beeld", "paragraphs": [{"id": "c0-p-0", "title": "1.1 Bewegingen vastleggen", "sections": [{"id": "c0p0-s-0", "label": "Leerdoelen", "content": "- Je kunt een beweging in de ruimte vastleggen met behulp van de natuurkundige grootheden plaats (x) en tijd (t).\n- Je weet exact het conceptuele en wiskundige verschil tussen de afgelegde weg (s) en de verplaatsing (delta x).\n- Je kunt de gemiddelde snelheid (v_gem) berekenen over een tijdsinterval en de momentane snelheid (v) bepalen met behulp van een raaklijn in een (x,t)-diagram.\n- Je kent de exacte eigenschappen en de formule van een eenparige beweging."}, {"id": "c0p0-s-1", "label": "Samenvatting", "content": "**Plaats, Tijd en Verplaatsing:** Om een beweging natuurkundig goed te analyseren, leg je de positie van een voorwerp vast op een reeks verschillende momenten. De **plaats (x)** druk je uit in de eenheid meter (m) en de **tijd (t)** in seconde (s).\n\n- Verplaatsing (delta x): Dit is het absolute wiskundige verschil in een rechte lijn tussen de eindplaats en de beginplaats van een voorwerp.\n  - Formule: delta x = x_eind - x_begin.\n  - Verplaatsing is een grootheid met een richting (een vector-achtige eigenschap). Ga je vanuit de oorsprong naar rechts, dan is de verplaatsing positief. Ga je terug naar links, dan is het negatief. Eindig je je wandeling na een uur precies op de stoel waar je begon, dan is je natuurkundige verplaatsing exact 0 meter.\n- Afgelegde weg (s): Dit is de daadwerkelijke, fysieke afstand die je met je voeten (of wielen) hebt afgelegd. Als je 10 meter vooruit rent en daarna direct weer 10 meter terug rent, is je verplaatsing weliswaar 0 m, maar de afgelegde weg is gewoon 20 m. Alleen bij een eenrichtingsbeweging (waarin je uitsluitend in een rechte lijn vooruit blijft gaan zonder te keren), zijn de afgelegde weg en de verplaatsing exact aan elkaar gelijk.\n\n**De twee soorten Snelheid:** Er is een groot verschil tussen je gemiddelde snelheid over de héle rit, en je actuele snelheid op je snelheidsmeter in de auto op één specifiek moment.\n\n- Gemiddelde snelheid (v_gem): De totale verplaatsing gedeeld door de totale tijd die je over dat hele traject hebt gedaan.\n  - Formule: v_gem = delta x / delta t\n  - De standaard SI-eenheid is meter per seconde (m/s).\n  - Omrekenregel: van m/s naar km/h vermenigvuldig je met 3,6. Van km/h naar m/s deel je juist door 3,6.\n- Momentane snelheid (v): De snelheid op exact één specifiek, bevroren tijdstip.\n  - In een wiskundig (x,t)-diagram bepaal je deze snelheid door op het gewenste tijdstip een raaklijn aan de (vaak kromme) grafiek te tekenen. Deze raaklijn moet precies de helling van de grafiek in dat ene punt volgen.\n  - De steilheid (de helling) van deze rechte raaklijn is de actuele snelheid op dat moment: v = (delta x / delta t)_raaklijn.\n  - Hoe steiler de lijn in het diagram omhoog loopt, hoe sneller de positie x verandert en hoe hoger de snelheid dus is. Loopt de lijn perfect horizontaal, dan verandert de plaats niet meer. De snelheid is dan 0 m/s (het voorwerp staat in rust).\n\n**Eenparige beweging:**\n\n- Dit is een uiterst gelijkmatige beweging waarbij de snelheid absoluut constant is. Het voorwerp accelereert niet en het vertraagt niet.\n- In een (x,t)-diagram is dit te herkennen aan een perfect rechte, schuin oplopende diagonale lijn (geen bochten of krommingen).\n- Omdat de snelheid hier nooit verandert, geldt voor de afgelegde weg en verplaatsing simpelweg de basisformule: s = v * t."}, {"id": "c0p0-s-2", "label": "Belangrijke begrippen", "content": "- Verplaatsing (delta x): De effectieve, rechtlijnige verandering van positie tussen je startpunt en eindpunt.\n- Afgelegde weg (s): De totale, werkelijk afgelegde meters van een fysieke route.\n- Gemiddelde snelheid (v_gem): De verplaatsing gedeeld door de daarvoor benodigde tijdsduur.\n- Momentane snelheid (v): De snelheid op exact één tijdstip, af te lezen als de wiskundige helling van de raaklijn.\n- Eenparige beweging: Een fundamentele, gelijkmatige beweging met een constante snelheid."}]}, {"id": "c0-p-1", "title": "1.2 Snelheidsgrafieken", "sections": [{"id": "c0p1-s-0", "label": "Leerdoelen", "content": "- Je kunt een (v,t)-diagram (snelheid-tijd diagram) foutloos aflezen, tekenen en natuurkundig interpreteren.\n- Je kunt de exacte verplaatsing berekenen uit een (v,t)-diagram met de zogenaamde oppervlaktemethode (zowel met figuren als met ruitjes tellen).\n- Je begrijpt heel goed hoe je de gemiddelde snelheid kunt afleiden uit een wisselend (v,t)-diagram."}, {"id": "c0p1-s-1", "label": "Samenvatting", "content": "**Het (v,t)-diagram begrijpen:** Naast de positie kun je een beweging ook grafisch vastleggen door de actuele snelheid (v, op de verticale y-as) uit te zetten tegen de doorlopende tijd (t, op de horizontale x-as).\n\n- Bij een eenparige beweging (constante snelheid) blijft de snelheid gelijk, waardoor de grafiek als een strakke, horizontale lijn evenwijdig aan de tijdas loopt.\n- Bij een versnelling (de snelheid neemt toe) loopt de lijn schuin of krom naar boven (bijvoorbeeld bij optrekken).\n- Bij een vertraging (de snelheid neemt af) daalt de lijn naar beneden (bijvoorbeeld bij afremmen).\n- Als een grafieklijn ontspringt in de oorsprong (0,0), betekent dit simpelweg dat het voorwerp op tijdstip nul startte vanuit volledige stilstand (0 m/s).\n\n**Verplaatsing bepalen uit een (v,t)-diagram (De Oppervlaktemethode):** Je kunt uit een snelheidsgrafiek direct afleiden hoeveel meter een voorwerp in werkelijkheid heeft afgelegd. De absolute hoofdregel in de kinematica (bewegingsleer) is: de verplaatsing in een bepaald tijdsinterval is áltijd exact gelijk aan de **oppervlakte onder de (v,t)-grafiek**.\n\n- Bij constante snelheid: De lijn loopt horizontaal, dus de vorm die ingesloten wordt door de grafiek en de assen is een perfecte rechthoek. Je berekent het gebied eenvoudig met de wiskunde: Oppervlakte = breedte * hoogte = t * v = de verplaatsing s.\n- Bij veranderlijke snelheid (versnellen/remmen): Als de grafiek schuin loopt of buigt, bepaal je de oppervlakte op twee manieren:\n\n**Gemiddelde snelheid bepalen in het diagram:** Bij een grillige rit met afwisselend hard en zacht rijden, kun je de abstracte *gemiddelde snelheid* in de grafiek bepalen door een strakke, horizontale stippellijn dwars door de grafiek te trekken op een geschatte hoogte. De rechthoekige oppervlakte die onder die stippellijn ontstaat, moet qua oppervlakte (meters) exact even groot zijn als het gebied onder de echte, grillige rit. Kortom: Wat je met je horizontale stippellijn \"te veel\" pakt aan oppervlakte bóven de dalen van de grafiek, moet precies compenseren wat je in de pieken ónder de grafiek \"te weinig\" had."}, {"id": "c0p1-s-2", "label": "Belangrijke begrippen", "content": "- (v,t)-diagram: Een grafiek waarin de actuele momentane snelheid verticaal is uitgezet tegen de doorlopende tijd horizontaal.\n- Oppervlaktemethode: De theorie en vaste rekenmethode om de fysieke verplaatsing (in meters) te vinden door de oppervlakte onder de snelheidslijn te berekenen."}]}, {"id": "c0-p-2", "title": "1.3 Versnellen", "sections": [{"id": "c0p2-s-0", "label": "Leerdoelen", "content": "- Je begrijpt de fysische betekenis van het concept versnelling en kunt zowel de gemiddelde versnelling (a_gem) als de momentane versnelling (a) berekenen.\n- Je herkent de eigenschappen van een eenparig versnelde beweging en een vertraagde beweging.\n- Je kent de theoretische eigenschappen van een perfecte vrije val (met de constante valversnelling g) in sterk contrast met een realistische val in de praktijk met wrijving en luchtweerstand."}, {"id": "c0p2-s-1", "label": "Samenvatting", "content": "**Versnelling (a):**\n\n- Versnelling is simpel gezegd de snelheid waarmee je snelheid verandert. Oftewel: de absolute toename (of afname) in snelheid per verstreken seconde. Het symbool is a (van het Engelse woord acceleration).\n- De eenheid in het SI-systeem is meter per seconde per seconde, beter en korter geschreven als meter per seconde kwadraat (m/s2). Als je in een sportauto met een versnelling van 3 m/s2 optrekt, komt er dus letterlijk elke seconde 3 m/s aan snelheid bij je huidige snelheid op.\n- Gemiddelde versnelling (a_gem): Bereken je over een afgesloten traject met de formule: a_gem = delta v / delta t.\n- Momentane versnelling: Dit is de versnelling op één fractie van een tijdstip. Deze bepaal je door in een (v,t)-diagram een raaklijn aan de kromme lijn te tekenen. De steilheid van deze raaklijn geeft de versnelling exact op dat moment: a = (delta v / delta t)_raaklijn.\n\n**De eenparig versnelde beweging:**\n\n- In deze specifieke situatie is de versnelling (a) volledig constant. De snelheidstoename is elke seconde op de millimeter nauwkeurig even groot.\n- In het (v,t)-diagram zie je dit duidelijk terug als een kaarsrechte, schuin omhoog stijgende lijn. Omdat het een strakke driehoeksvorm onder de grafiek vormt, kun je de verplaatsing makkelijk berekenen met de formule: 0,5 * basis * hoogte.\n\n**Valbewegingen:**\n\n- Vrije val: Dit is een puur theoretische val in de natuurkunde waarbij het voorwerp uitsluitend de trekkracht van de zwaartekracht ondervindt. Luchtweerstand en wrijving zijn hier absoluut afwezig (denk aan een val in een perfect vacuüm). Dit resulteert in een perfecte eenparig versnelde beweging. Ongeacht of je een loden kanonskogel of een lichte ganzenveer laat vallen, ze versnellen in een vacuüm allemaal exact even hard. Deze standaard valversnelling noemen we g. In Nederland gebruiken we hier de constante waarde: g = 9,81 m/s2 (te vinden in Binas tabel 7A).\n- Val met luchtweerstand: In de praktijk springt een parachutist in de atmosfeer en ondervindt hij luchtweerstand. Luchtweerstand reageert heftig op snelheid. Hoe hoger de valsnelheid wordt, hoe groter de tegendruk van de botsende luchtmoleculen wordt. Hierdoor daalt zijn netto-versnelling aanzienlijk, totdat deze uiteindelijk precies 0 m/s2 bereikt (de zwaartekracht en luchtweerstand zijn dan in evenwicht). Het voorwerp versnelt niet meer, maar valt vanaf dat moment met een strakke, maximale constante eindsnelheid (de terminale snelheid) naar beneden.\n\n**Vertraging:**\n\n- Als een auto hard op de rem trapt, neemt de snelheid af. De eindsnelheid is in dat geval uiteraard kleiner dan de beginsnelheid. Het wiskundige verschil (delta v = v_eind - v_begin) is daardoor een negatief getal. Hierdoor rolt er voor de versnelling (a) ook een negatief getal uit je rekenmachine. Dit negatieve getal duidt een vertraagde beweging of afremming aan. De grafiek is dan een dalende lijn.\n- Als je een tennisbal recht omhoog in de lucht gooit, remt de neerwaartse zwaartekracht hem onmiddellijk af. Direct na het loslaten beleeft de bal in de opwaartse vlucht een eenparig vertraagde beweging met a = -9,81 m/s2, totdat de bal op zijn hoogste punt tot stilstand komt."}, {"id": "c0p2-s-2", "label": "Belangrijke begrippen", "content": "- Versnelling (a): De hoeveelheid snelheidsverandering per tijdseenheid (in m/s2).\n- Eenparig versnelde beweging: Een beweging waarbij de snelheid volledig gelijkmatig, in een strakke schuine lijn, toeneemt.\n- Vrije val: Een ongestoorde en theoretisch perfecte val onder de uitsluitende invloed van zwaartekracht zonder wrijving (versnelt met g = 9,81 m/s2).\n- Vertraging: Een situatie waarbij de versnellingswaarde negatief is, wat resulteert in het zichtbaar afremmen van de snelheid."}]}, {"id": "c0-p-3", "title": "1.4 Grootheden en hun eenheden", "sections": [{"id": "c0p3-s-0", "label": "Leerdoelen", "content": "- Je kent de zeven officiële SI-basisgrootheden uit je hoofd en kunt moeiteloos werken met afgeleide eenheden.\n- Je kunt eenheden en groottes netjes naar elkaar omrekenen met voorvoegsels (zoals kilo, mega, milli) en de wiskundige 10-machten notatie.\n- Je kent de dwingende en formele regels voor het rekenen met significante cijfers en kunt deze correct afronden in je eindantwoord op toetsen."}, {"id": "c0p3-s-1", "label": "Samenvatting", "content": "**Grootheden en SI-eenheden:**\n\n- In de serieuze fysica is een grootheid de eigenschap van een concept of object wat je daadwerkelijk kunt meten (zoals gewicht, tijd, lengte, temperatuur, snelheid). Een eenheid is de formele maat of term waarin je jouw meting vervolgens uitdrukt (kilogram, seconde, meter, m/s).\n- In formules en theorie geeft de notatie [t] in vierkante haken aan: \"de eenheid van tijd is...\".\n- SI-systeem: Om wereldwijde verwarring en gecrashte ruimteschepen te voorkomen, hebben wetenschappers wereldwijd het Système International afgesproken. Er zijn 7 fundamentele basisgrootheden vastgelegd in steen (zie Binas tabel 3) met bijbehorende grondeenheden: lengte (meter), massa (kilogram), tijd (seconde), stroomsterkte (ampère), temperatuur (kelvin), hoeveelheid stof (mol) en lichtsterkte (candela).\n- Afgeleide eenheden: Vrijwel alle overige eenheden in de natuurkunde zijn wiskundig opgebouwd of samengesteld uit deze 7 grondeenheden. De eenheid van snelheid (m/s) is bijvoorbeeld een typische afgeleide eenheid, samengesteld door meter te delen door seconde (vaak wetenschappelijk genoteerd als m*s^-1).\n- Handige extra maten: Soms gebruikt de natuurkunde onofficiële eenheden voor het overzicht omdat de SI-eenheden onhandelbaar zouden worden, zoals de Astronomische Eenheid (1 AE = de monsterlijke afstand van de aarde tot de zon) of de Kilowattuur (kWh) voor huishoudelijk stroomverbruik in plaats van miljarden Joules.\n\n**Significante Cijfers:** Je kunt in de praktijk nooit oneindig exact meten. Een houten liniaal of keukenweegschaal heeft bijvoorbeeld een heel beperkte afleesnauwkeurigheid. Dit moet je in de wetenschap aangeven in je metingen met het juiste aantal *significante (betekenisvolle) cijfers*.\n\n- Nullen helemaal vooraan een getal tellen nóóit mee voor de precisie. (Het getal 0,0034 is maar heel grof gemeten en heeft daardoor maar 2 significante cijfers: de 3 en de 4).\n- Nullen helemaal achteraan, of stevig gevangen tussen twee cijfers in, tellen echter wél altijd mee! (Het getal 3,400 geeft aan dat het instrument heel precies tot drie cijfers achter de komma kon meten; het heeft dus 4 significante cijfers).\n- Wetenschappelijke machten van tien (zoals 10^4) tellen nooit mee in het aantal significante cijfers, die verplaatsen puur de komma.\n- Vermenigvuldigen en delen (hoofdregel): Je berekent het sommetje op de rekenmachine. Vervolgens kijk je streng naar alle originele meetgegevens die je in je berekening hebt gestopt. Welk meetgegeven was het slordigst en had het kleinste aantal significante cijfers? Jouw definitieve einduitkomst is nooit nauwkeuriger dan je slechtste meting en rond je af op precies datzelfde kleine aantal significante cijfers.\n- Optellen en aftrekken: Hierbij kijk je absoluut niet naar significante cijfers, maar puur en alleen naar het aantal decimalen (de getallen puur achter de komma). De einduitkomst rond je netjes af op het kleinste aantal decimalen van je ingevoerde beginwaarden.\n- Gouden VWO-regel: Rond nooit getallen af tijdens het berekenen van tussenantwoorden. Werk met het volledige getal door op je rekenmachine (ANS-knop) en rond het uitsluitend en eenmalig af bij het presenteren van je ultieme eindantwoord."}, {"id": "c0p3-s-2", "label": "Belangrijke begrippen", "content": "- Grootheid: Een fysieke, feitelijk meetbare eigenschap van materie of concepten.\n- Eenheid: De overeengekomen standaardmaat waarmee een bepaalde grootheid wordt uitgedrukt en vergeleken.\n- SI-grondeenheden: De absolute en internationaal afgesproken basisafspraken voor 7 fundamentele meeteenheden.\n- Afgeleide eenheid: Een wiskundig samengestelde eenheid, gefabriceerd uit meerdere SI-grondeenheden (zoals m/s of kg/m3).\n- Significante cijfers: Het aantal betrouwbare cijfers in een gepresenteerde meting dat de feitelijke nauwkeurigheid en limieten van de meetapparatuur eerlijk reflecteert."}]}, {"id": "c0-p-4", "title": "1.5 Wiskundig gereedschap", "sections": [{"id": "c0p4-s-0", "label": "Leerdoelen", "content": "- Je kunt veelvoorkomende wiskundige verbanden in de natuurkunde (met name recht evenredig en omgekeerd evenredig) direct herkennen in theorie en formules.\n- Je kunt deze wiskundige verbanden correct plotten in een assenstelsel en de specifieke vorm van de grafiek aflezen en interpreteren."}, {"id": "c0p4-s-1", "label": "Samenvatting", "content": "**Wiskundige Verbanden in de Natuurkunde (zie ook Binas tabel 36A):** De diepere theorie achter vrijwel alle natuurkundige wetten en theorema's leunt op het doorgronden van hoe de ene grootheid proportioneel verandert als je de andere grootheid manipuleert of aanpast. De twee belangrijkste fundamenten zijn:"}, {"id": "c0p4-s-2", "label": "Belangrijke begrippen", "content": "- Recht evenredig: Een direct verband waarbij twee grootheden bij elke verandering steevast met exact dezelfde verhoudingsfactor toenemen of afnemen. De getekende grafiek is uitsluitend een perfect rechte lijn die door de nul-oorsprong (0,0) loopt.\n- Omgekeerd evenredig: Een invers verband waarbij een exponentiële vermenigvuldiging van de ene grootheid onvermijdelijk leidt tot de exacte breukgewijze wiskundige deling of afname van de ander. De grafieklijn vlakt altijd krommend af in een typerende holle hyperbool.\n\nHoofdstuk 2: Elektriciteit"}]}]}, {"id": "c-1", "title": "Hoofdstuk 2: Elektriciteit", "paragraphs": [{"id": "c1-p-0", "title": "2.1 Lading en stroom", "sections": [{"id": "c1p0-s-0", "label": "Leerdoelen", "content": "- Je weet in absoluut atomair detail hoe een atoom is opgebouwd (massieve kerndeeltjes versus de ijle elektronenwolk).\n- Je snapt het scheikundige en natuurkundige ontstaan van positieve en negatieve ladingen en weet hoe ionen zich vormen en afstoten.\n- Je kent het fundamentele en microscopische verschil tussen stroomgeleiders en isolatoren op atomair niveau.\n- Je kunt uitstekend werken en rekenen met de formule voor stroomsterkte: I = Q / t."}, {"id": "c1p0-s-1", "label": "Samenvatting", "content": "**Soorten Lading en de atomaire opbouw:**\n\n- Er bestaan in het universum simpelweg slechts twee soorten elektrische lading: positief (+) en negatief (-). De universele basisregel van het elektromagnetisme luidt: ladingen van exact dezelfde soort (twee plussen of twee minnen) stoten elkaar krachtig en onverbiddelijk af, terwijl tegengestelde ladingen (plus en min) elkaar onweerstaanbaar aantrekken als een magneet.\n- De natuurkundige grootheid hiervoor is de lading (Q) en dit meten we officieel in de SI-eenheid Coulomb (C).\n- Alle fysieke materie in de wereld is opgebouwd uit minuscule atomen. Elk atoom heeft in zijn centrum een zeer dichte, massieve kern. Deze atoomkern zit volgepakt met positief geladen protonen en weegt daarnaast zwaar mee dankzij neutrale (ongeladen) neutronen. In gigantische, ijle banen ver om deze dichte kern heen zoemen de flitsend snelle, negatief geladen elektronen (die nagenoeg niks wegen).\n- Een atoom is in zijn normale, ongestoorde rusttoestand altijd elektrisch volkomen neutraal: het bevat in de wolk exact evenveel negatieve elektronen als dat er positieve protonen in de kern zitten. De ladingen heffen elkaar perfect naar nul op.\n- De buitenste rand-elektronen in de wolk kunnen in de praktijk soms echter door wrijving of hitte losraken en afscheuren.\n  - Als je een elektron weghaalt bij een atoom, vallen er minnen weg, krijgt de positieve atoomkern qua balans de overhand en krijgt het hele atoom een netto positieve lading. We noemen dit restant een positief ion.\n  - Druk je met geweld of door wrijving een extra elektron van buitenaf in het atoom erbij, dan ontstaat een overschot aan min-lading en heb je een gecreëerd negatief ion.\n\n**Geleiders, Isolatoren en Stroom op microscopisch niveau:**\n\n- Geleiders: Dit zijn stoffen waarin elektrische lading zich uitermate soepel kan verplaatsen. Vooral in metalen (zoals zuiver koper, goud, zilver of ijzer) zijn de buitenste elektronen niet heel strak gebonden aan de aantrekkingskracht van hun moeder-atoomkern. Ze dwarrelen en vloeien vrij door het gehele metaalrooster heen. We noemen deze flexibele transporteurs toepasselijk \"vrije elektronen\" of \"geleidingselektronen\". Omdat ze vrij zijn, kunnen ze door een batterij in één richting geduwd worden.\n- Isolatoren: Dit zijn stoffen waar lading principieel niet of nauwelijks doorheen kan stromen (zoals glas, droge lucht, puur kunststof, keramiek of dik rubber). In deze materialen zitten de elektronen met een ijzeren greep vastgeklonken in de chemische molecuulstructuur van het eigen atoom. Er zijn simpelweg geen losse transporteurs beschikbaar om de elektriciteit door te geven.\n- Elektrische stroom: In een gesloten koperen stroomkring (waarin je bijvoorbeeld een koperdraad met een lampje aan een batterij verbindt) stromen de losse, negatieve vrije elektronen in de draad logischerwijs van de afstotende minpool van de batterij naar de sterk aantrekkende pluspool.\n- Let buitengewoon goed op de eeuwenoude conventionele natuurkundige afspraak: Vroeger, lang voordat elektronen ontdekt werden, wist men niets over negatieve deeltjes en gokte men dat er onzichtbare positieve stroompjes liepen. We tekenen de officiële stroompijl (de formele stroomrichting I) op papier daarom in schema's nog altijd hardnekkig van de pluspool naar de minpool, ook al bewegen de fysieke elektronen exact de andere kant op!\n\n**De Stroomsterkte (I):**\n\n- De grootheid stroomsterkte meet effectief de pure intensiteit: hoeveel \"elektronen-drukte\" is er in de geleidende draad. Het geeft het precieze aantal coulomb-lading aan dat in exact één seconde een willekeurig controlepunt in de kabel passeert. Het is als het meten van liters water per seconde in een dikke brandweerslang.\n- Formule: I = Q / t\n  - I = de gemeten stroomsterkte, steevast in de eenheid Ampère (A), wat dus eigenlijk letterlijk staat voor het ratio Coulomb per seconde (C/s).\n  - Q = de totale passerende ladingverzameling in de eenheid Coulomb (C).\n  - t = de gepasseerde tijd gedurende die meting, in de eenheid seconde (s)."}, {"id": "c1p0-s-2", "label": "Belangrijke begrippen", "content": "- Elektronen: De fundamentele, extreem lichte, negatief geladen subatomaire deeltjes die zich in een wolk rondom de zware atoomkern verplaatsen.\n- Ionen: Atomen die elektrisch netto geladen zijn geraakt doordat ze door een fysiek of scheikundig proces hun uiterste elektronen hebben verloren (waardoor ze positief worden) of hebben opgenomen (waardoor ze negatief worden).\n- Geleiders / Isolatoren: Materialen die het zwerven van elektronenstromen respectievelijk wél zeer makkelijk toelaten dankzij vrije elektronen of nagenoeg volledig isoleren en blokkeren.\n- Stroomsterkte (I): De grootheid die de gemeten fysieke intensiteit van de langsstromende ladinghoeveelheid per exacte seconde uitdrukt in de eenheid Ampère."}]}, {"id": "c1-p-1", "title": "2.2 Spanning", "sections": [{"id": "c1p1-s-0", "label": "Leerdoelen", "content": "- Je weet de onmisbare, vitale functie van een spanningsbron in een compleet elektrisch circuit.\n- Je kunt de verplaatste of afgeleverde energie in de stroomkring uitrekenen en begronden met de formule voor spanning: U = E / Q.\n- Je begrijpt het concept van de opslagcapaciteit van accu's, powerbanks en batterijen.\n- Je kunt foutloze en strakke officiële schakelschema's tekenen en kent de theorie achter het correct en veilig aansluiten van de universele stroom- en spanningsmeters."}, {"id": "c1p1-s-1", "label": "Samenvatting", "content": "**Spanningsbronnen en hun Onmisbare Functie:** Een stroomkring kan alléén elektronen laten rondstromen en lampjes laten branden als aan twee strenge voorwaarden is voldaan: de draden-route moet volledig gesloten zijn (een ononderbroken lus) én er moet een pomp of motor in de route zijn verwerkt: de **spanningsbron** (bijvoorbeeld een chemische batterij, een auto-accu, zonnepaneel of het wandstopcontact). De spanningsbron vervult hiermee twee uiterst cruciale taken: hij is de pomp die met een wiskundig verschil in ladingskanten de stroom elektronen fysiek überhaupt op gang stuwt, én hij levert de stuwende, verpompte potentiële energie (de brandstof) mee in de denkbeeldige rugzakjes van die rondreizende Coulomb-ladingen. Zonder spanningsbron is er geen drukverschil en staat alles stil.\n\n- Gelijkspanning (DC): De bron heeft een fysiek en blijvend gedefinieerde, vaste pluspool en minpool (denk aan AA-batterijen of USB-laders voor je telefoon). De elektronen gaan in het circuit continu als een rivier dezelfde kant op.\n- Wisselspanning (AC): Komt uit het grote lichtnet of uit een generator en is bedacht om stroom makkelijker met veel minder verlies over gigantische afstanden (hoogspanningsmasten) te sturen. Bij wisselspanning van het wandstopcontact (in Europa overal uniform afgestemd op de frequentie 50 Hz) polen de plus- en minpool in het stopcontact een indrukwekkende 50 keer per seconde bliksemsnel om. De stroomrichting in je bureaulamp klapt continu om. De elektronen trillen in de draad dus feitelijk alleen maar lokaal keihard heen en weer en dragen de energie als een golf over.\n\n**Spanning (U):**\n\n- Waar stroomsterkte gaat over de 'drukte' of hoeveelheid stroomdeeltjes, gaat Spanning (U) over de energie. De Spanning (het voltage) is het getal dat precies aangeeft hoeveel eenheden zuivere energie (in Joule) het apparaat of de bron meegeeft aan of afneemt van één enkel vast pakketje: namelijk per iedere gepasseerde Coulomb lading. Zie de spanning als de geleverde spierkracht, de hitte van de lading of het totale drukverval op de gesloten leidingen.\n- Formule: U = E / Q\n  - U = de Spanning of het potentiaalverschil, standaard gemeten in de bekende eenheid Volt (V). (Let goed op dit inzicht: de eenheid Volt betekent in de diepste natuurkunde dus dat het circuit feitelijk precies 1 Joule aan brandstof-energie aflevert per elke passerende 1 Coulomb lading. 1 V = 1 J/C).\n  - E = de verbruikte, afgegeven of uit batterij opgenomen elektrische stroomenergie in Joule (J).\n  - Q = de pakketgrootte aan daadwerkelijk gepasseerde lading in Coulomb (C).\n\n**Capaciteit van Oplaadbare Bronnen:**\n\n- Bij oplaadbare batterijen, lithium-ion telefoonaccu's of zware loodaccu's van apparaten wordt de totale ingesloten chemische inhoud, of kortweg het uithoudingsvermogen, vaak voor de consument uitgedrukt in de specificatie (milli)ampère-uur (afgekort als mAh of de zwaardere Ah).\n- Dit natuurkundige begrip heet de Capaciteit. Heeft de zware accu van je elektrische e-bike bijvoorbeeld een inhoud van 12 Ah op het etiket staan, dan bezit hij simpelweg de interne chemische capaciteit en tankinhoud om theoretisch gezien exact 12 uur lang in de tijdlijn een stabiele druppelstroom van 1 Ampère te blijven leveren voordat de accu dood is. Hij kan de formule ook veranderen en op de hoogste versnelling 6 uur lang een zwaardere, dubbele stroom van 2 Ampère naar de e-bike motor spuwen voor de tank alsnog leeg is (6 uur * 2 A = de limiet van 12 Ah).\n\n**Meten en Uittekenen in Abstracte Schakelschema's:** In de zuivere theorie van de natuurkunde schetsen we geen lastige, realistische draden, koperdraden en dikke blokbatterijen, maar stileren en minimaliseren we alles op papier tot heldere en universeel afgesproken symbolen (die je voor elk component exact mag opzoeken in je grote vriend, Binas tabel 17B) om een foutloos en uiterst overzichtelijk **schakelschema** of blueprint te realiseren. Verbindingsdraden trek je met je geodriehoek voor de overzichtelijkheid uitsluitend als perfect rechte, haakse lijnen. Zonder spaghetti-bochten. Om het stroomnet in de praktijk door te meten, plaats je altijd twee specifieke en breekbare apparaten in het schema. Als je deze fout aansluit, blaast de zekering in de meter op:\n\n- Stroommeter (ook wel de Ampèremeter): Dit is het logische telpoortje dat de fysieke taak heeft en in het systeem telt \"hoeveel man, ofwel hoeveel coulomb-lading passeert mijn ingebouwde sensor in de stroombaan per tel?\". Omdat hij de reizigers moet afvinken, moet hij hierdoor letterlijk dwars in de doorgang van het pad geknipt en tussengevoegd worden, anders mist hij de langslopende stroom. We zeggen dat de ampèremeter altijd streng in serie ín de stroomleiding geschakeld zit met het te onderzoeken component.\n- Spanningsmeter (ook wel de Voltmeter): Dit apparaat meet niet hoeveel stroom er loopt, maar meet secuur het verschil of het verval in de energiepakketjes (het potentiaalverschil of voltage) die de elektronen op hun rug bij zich dragen vóórdat ze de lamp of weerstand in vloeien, en direct de energie nadat ze de lamp theatraal weer leeggeslurpt uitkomen. Hij vergelijkt de begin- en de einddruk aan beide kanten van de machine. Daarom wordt deze meter altijd los en veilig parallel met een klein omleidingsdraadje (als een bypass of bruggetje over het onbekende component) heengespannen om de ingang met de uitgang te vergelijken."}, {"id": "c1p1-s-2", "label": "Belangrijke begrippen", "content": "- Spanning (U): De strikt gedefinieerde maat voor de energie-afgifte of het opgebouwde potentiaalverschil per vaste eenheid meegevoerde rondreizende lading (gepresenteerd in Volt).\n- Capaciteit: De technische, praktische specificatie voor de opgeslagen chemische/elektrische lading en energie-inhoud van een accu of spanningsbron (in mAh of Ah).\n- Stroommeter (Ampèremeter): Zeer resistentie-arm meetinstrument dat, louter geschakeld in de file in serie met componenten, de pure fysieke doorgangsstroom test in Ampère.\n- Spanningsmeter (Voltmeter): Hoog-resistente apparatuur die steevast via een gecreëerde parallelschakeling over een object heen de elektrische potentiaaldaling (energieafgifte in Volt) tussen twee specifieke klemmen registreert.\n- Schakelschema: Een overzichtelijke, hoekig en abstract met gestandaardiseerde internationale component-symbolen uitgelijnde bouwkundige blauwdruk van de stroomwerkelijkheid."}]}, {"id": "c1-p-2", "title": "2.3 Weerstand", "sections": [{"id": "c1p2-s-0", "label": "Leerdoelen", "content": "- Je begrijpt het fundamentele concept van de Wet van Ohm en kunt deze op alle relevante toepassingen loslaten met de algebraïsche formule U = I * R.\n- Je kunt de ingebouwde fysieke draadweerstand van een lange verbindingskabel uiterst exact uitrekenen via zijn dimensies en de formule R = rho * (L / A).\n- Je weet feilloos het verschil tussen een standaard ohmse weerstand en het boeiende theoriegebied rond moderne variabele niet-ohmse weerstanden en sensoren (waaronder de temperatuurgevoelige PTC, NTC, de lichtgevoelige LDR, de blokkerende diode en de uiterst zuinige led)."}, {"id": "c1p2-s-1", "label": "Samenvatting", "content": "**De Wet van Ohm en de cruciale rol van Weerstand (R):** Niet elke koperen kabel of silicium chip is een perfect wrijvingsloze, open snelweg voor de stroom. De theorie van **Weerstand** definieert en berekent exact hoe enorm lastig en belemmerend de vrije elektronen het in de realiteit hebben om zich als massale stroom fysiek door het dichte metaal- of koolstofrooster van een voorwerp te wurmen, waarbij ze constant tegen atomen botsen. Hoe stugger en groter de opgebouwde weerstand van het aangesloten component in je schakeling blijkt, hoe steviger en intenser de druk (de geleverde pompspanning U van de bron) zal moeten ontwikkelen om alsnog een degelijke, gelijke hoeveelheid stroomsterkte met geweld door dat apparaat of de draad te rammen.\n\n- Formule (De Wet van Ohm): De drie belangrijkste factoren in de elektrotechniek zijn onlosmakelijk verbonden in de volgende ijzersterke wet: U = I * R.\n  - U = de resulterende of gemeten spanning over de klemmen in Volt (V).\n  - I = de door het kanaal doordrukte stroomsterkte in Ampère (A).\n  - R = de berekende of aanwezige Weerstand in Ohm (Ω), wat wiskundig dus 1-op-1 overeenkomt met de afgeleide eenheid Volt per gedeelde Ampère.\n- Ohmse weerstand (Een Strak, Lineair Verband): Wanneer we over een zogeheten pure 'Ohmse weerstand' spreken, functioneert de wiskundige weerstandswaarde R van dat specifieke materiaal alsof hij in dik graniet is gebeiteld en blijft hij stoïcijns constant (ongeacht hoe de temperatuur van de draden zweet of hoe enorm hoog of gevaarlijk het voltage van je batterij eroverheen knalt). In het wiskundige (I,U)-diagram (waar je de gemeten Spanning in Volt mooi op de horizontale x-as zet en de ontwaakte en reagerende Stroomsterkte op de verticale y-as plaatst) tekent deze constante R-factor zich in theorie feilloos af als een schitterende, strakke, kaarsrechte diagonale streep die perfect op de nul-oorsprong (0,0) snijdt. Componenten zoals theorie-constantaandraden (een speciale hittebestendige legering) en gefabriceerde fabriekskoolweerstanden met gekleurde ringetjes vallen uiterst trouw in dit brave rijtje.\n\n**Weerstand van een zuivere stroomdraad berekenen:** In de daadwerkelijke elektro-installatie heeft niet enkel de stofzuigermotor of het koplampje weerstand, we zien in de metingen ook dat het hele dikke koperen stroomsnoer op zijn weg ernaartoe zélf stroom begint af te remmen en er hinderlijk heet door wordt (draadverliezen). De opgebouwde totale weerstand van zo'n specifieke massieve metaaldraad kent drie pure, sturende natuurkundige aanjagers of vertragers: de draadlengte die je afknipt, de draaddikte en zijn soortelijk, in de mijn gedolven elementmateriaal.\n\n- Formule Draadweerstand: R = rho * (L / A)\n  - R = de resulterende totale weerstand van de opgerolde draad in de eenheid Ohm (Ω).\n  - L = de afgeknipte, meetbare lengte van de geleidende draad in volle meters (m). Het theoretische gevolg is heel lineair: een veel langere draad betekent dat alle elektronen een eindeloze, langere marathonafstand moeten afleggen vol met atomaire botsingen, dus ervaren de elektronen veel meer en zwaardere totale weerstand.\n  - A = de dwarsdoorsnede of de frontale oppervlakte van de doorgeknipte kern van de draad, berekend in vierkante meter (m2). Als een elektricien een dikkere, massievere draad koopt, werkt dat als het aanleggen van een veel bredere 10-baans snelweg voor de elektronenstroom en creëert het veel meer rijstrook en ruimte voor de elektronen om elkaar in te halen, en dat genereert daardoor onvermijdelijk aanzienlijk minder belemmerende weerstand (Ohm) in de specificaties.\n  - rho (ρ) = de unieke soortelijke weerstand van de draad, berekend in de curieuze complexe eenheid Ohm-meter (Ω⋅m). Dit is een vastgezette en geteste fundamentele stofeigenschap die het lab aangeeft, het dicteert hoe indrukwekkend goed of extreem isolerend slecht een bepaald soort puur metaal de stroom in de basis van de atoomkern uit van nature geleidt. Zilver en goud staan subliem in de boeken, koper presteert ook als topklasse geleider, ijzer heeft van nature meer wrijvingsweerstand en roestig nikkel remt ontzettend af. De exacte waarden van rho per metaalsoort zijn je ultieme naslagwerk en op de toets onmisbaar te raadplegen in de formele lijsten van Binas tabellen 8, 9 en 10.\n- Cruciale Ronde draad berekening: De valkuil op veel examens en proefwerken is dat een snoer of draad in 99% van de gevallen als een ronde cilinder is gefabriceerd, en in de tekst de diameter wordt vermeld. Je zult het invul-oppervlak A van de snijvlakcirkel van de koperdraad dan altijd eerst zélf moeten uitrekenen met de wiskundige cirkel-formules voor je het in de (L/A) breuk stopt. Je pakt hiervoor de straal (r = de helft van de dikte-diameter d) en rolt A uit met: A = pi * r^2.\n- Groot gevaar rond het symbool rho: In de breedte van de natuurkunde theorie is het gebruik van het oud-Griekse teken ρ (rho) berucht en uiterst verwarrend. Het wordt in de hydrodynamica immers massaal gebruikt voor het fenomeen dichtheid (de materiemassa per volume in kg/m3, zoals geleerd in paragraaf 7.1), maar we gebruiken in theorie exact ditzelfde symbool rho in ditzelfde vak plotsklaps zwaarwegend voor de bovengenoemde soortelijke weerstand (in de eenheid Ohm * meter, in déze elektriciteitsparagraaf). Houd deze twee totaal verschillende natuurkundige betekenissen haarscherp uit de knoop op je SO of in het eindexamen!\n\n**Niet-Ohmse Weerstanden en geavanceerde Sensoren:** In schril contrast met de betrouwbare, in steen gebeitelde vaste ohmse weerstanden, fluctueert en verandert bij een zeer groot arsenaal aan componenten in de techniek de interne weerstand onophoudelijk en fel, afhankelijk van hoe zwaar ze het hebben of afhankelijk van zware externe omgevingsomstandigheden zoals temperatuur, spanning, of zelfs lichtinval. Hun specifieke (I,U)-grafiek vormt dan ook absoluut geen saaie rechte strakke kruising, maar de lijn zwiert in een onvoorspelbare logaritmische bocht of steile exponentiële afvlak-curve:\n\n- PTC (Positieve Temperatuur Coëfficiënt): Dit is de klassieker; een weerstand die agressief lineair of hyperbolisch omhoog schiet en de stroom dus in de ankers laat gaan, zodra het materiaal heter wordt aangesproken. De oeroude gloeidraden in antieke gloeilampen of in je gewone koperen metaaldraden voor de hobbykamer, zijn hier in de theorie verreweg het meest sprekende en beruchte voorbeeld van. De microscopische theorie hierachter is prachtig en is theoriekennis: Bij intense wrijvingsopwarming door de stroom, beginnen de zware, logge koper- of metaal-atomen in het draadrooster wild en veel feller over hun eigen vaste as of zwaartepunt te trillen door hitte-energie. Door de chaos van deze fel dansende, bibberende hete metaal-atomen, kan de smalle en flitsende stroom van de losvliegende geleidingselektronen er niet meer ongeschonden doorheen racen. De reizende elektronen vliegen massaal op de bibberende atomen, ze botsen zich suf en de weerstand bereikt een hoogtepunt. Positieve stijging bij hitte.\n- NTC (Negatieve Temperatuur Coëfficiënt): Een uiterst nuttige en slim gefabriceerde speciale elektronica-component van halfgeleiders, waarvan de aanwezige weerstand verrassend genoeg juist gigantisch en onbegrijpelijk snel inkakt en afdaalt zodra de omgevings-temperatuur of de stroomhitte in het kastje flink toeneemt. Hoe heter de NTC is, hoe verwaarloosbaarder en lager zijn belemmerende Ohm-weerstand is, en hoe meer stroom hij toelaat! De stroom schiet erdoor. In NTC's maken extra hitte-energiestoten namelijk onverwachts vele duizenden extra gebonden elektronen helemaal vers en kersvers vrij van hun atomen die mee gaan doen in het stroompje. Dit bizarre effect is industrieel fenomenaal ideaal en wordt dagelijks ingezet als inwendige sensor voor het digitaal fabriceren van gevoelige digitale temperatuurmeters, de thermostaat van de vriezer, of het brandalarm op het dak.\n- LDR (Light Dependent Resistor, ofwel de Lichtgevoelige Weerstand): De naam verraadt het al, dit is een klein knap fotogevoelig vlak en donker componentje waarvan de blokkerende, zware weerstand letterlijk pijlsnel en extreem daalt wanneer er plots een gigantisch volume aan meer of feller gebundeld licht of zonnestralen vanuit de ruimte op zijn oppervlak schijnt. In het stikdonkere pikkedonker, als je hem in de lade gooit, is de weerstand van de plaat gigantisch hoog en blokt hij alle stroom. In de volle blakende zon is zijn weerstand zo goed als weggesmolten en passeert de stroom er ongestoord overheen. Dit specifieke concept is de kern-theorie achter alledaagse automatiseringen: het wordt op extreem massieve schaal toegepast als sensor in de printplaten voor zelfaangestuurde automatische zonnepaneel-straatlantaarns op de rotonde of in de huiskamer in automatische inbraak- en schemerschakelaars om te besluiten wanneer lichten aan moeten bij de avondval.\n- Diode: Dit piepkleine apparaatje is ingebakken in vrijwel elke moderne voeding of circuit en functioneert feilloos op microscopisch niveau als een genadeloos en bikkelhard elektrisch \"eenrichtingsverkeer-bordje\" voor de opgewekte ladings-stroom. In theorie heeft de stekker of aansluiting twee polariteiten: In de ene ingeplugde bedrade montagerichting (die we benoemen als de positieve, open doorlaatrichting) laat het kastje de volle aanstormende stroom over de diode heen probleemloos, onbegrensd, en nagenoeg wrijvingsloos de poort door. Hij doet niet aan verzet. Als je hem echter per ongeluk of met opzet fysiek lossoldeert en 180 graden de foute kant op omdraait in je stroomkring (wat de sperrichting oplevert qua benaming), dan is zijn weerstand astronomisch en blokkeert de component onverbiddelijk vrijwel alle millivolts en elektronen aan de poort af, geen kruimeltje stroom mag nog het net doorsijpelen. Diodes bezitten een onvervangbare en levensreddende essentiële functie en inzet bij het strak filteren en het technisch zuiver omzetten van chaotische en gevaarlijke AC wisselspanning (direct afgetapt uit het wilde huishoudelijk stopcontact op 50 Hz en zware 230 Volt wisselende klappen) naar strak, gebalanceerd en keurig geleide veilige zwakke DC gelijkspanning die noodzakelijk verlangd is voor de accucellen van je laptop of de tere microchips in de oplader van de batterij van je smartphone, zodat de stroom niet door je iPhone heen en weer kan beuken en de chip ontploft.\n- LED (Light Emitting Diode): Een uiterst modern, piepklein en uiterst succesvol geoptimaliseerd speciaal soort diode. De LED fungeert allereerst exact hetzelfde als zijn broer de diode, hij dwingt een strakke wet af: hij brandt of werkt uitsluitend en alleen als je hem uiterst correct met zijn pootjes aan het circuit monteert en hem dus doelbewust netjes in de goedgekeurde doorlaatrichting in je elektriciteitsnet schakelt! Sluit je hem fout om aan in de blokkerende sperrichting over de lijn, dan weigert hij resoluut dienst en stroomt de opgewekte energie van de stroomkring er niet doorheen, er gebeurt niets. Echter, presteert de led formidabel wel in de doorlaatrichting, dan bezit hij het formidabele halfgeleider-talent en chemische eigenschap dat de passerende elektronen bovendien over de rand vallen, waarna het stralend, gekleurd en gebundeld spectrum licht uitzendt met een fantastisch hoog rendement in Lumen per Joule, en hij daardoor en daarmee al met al verreweg als de meest onverslaanbaar superieur presterende en extreem energiezuinig afkruidende lichtproducent op de hedendaagse elektrotechnische consumentenmarkt te boek staat."}, {"id": "c1p2-s-2", "label": "Belangrijke begrippen", "content": "- Weerstand (R): Bepalende stofeigenschap in de elektrotechniek die de pure en dwingende mate meet en aangeeft van hoeveel belemmering en vertraging de langslopende ladingsstroom ondervindt tijdens zijn reis door het object in de vaste eenheid Ohm.\n- Wet van Ohm: Het universele en strak lineaire wiskundige theorema en verband tussen de gemeten aanwezige spanning (V) op een draad en het daaruit ontpoppende gecreëerde gevolg, de doorgedrukte stroomsterkte (A), geketend door de wet: U = I * R.\n- Soortelijke weerstand (rho): Oersterke en karakteristieke microscopische atoommaat en meetwaarde in Ohm-meter voor de interne en intrinsieke structurele stroomgeleiding-kwaliteiten en isolerende vertragende barrières van een onbewerkte en specifieke zuivere scheikundige bulk-stof uit Binas.\n- PTC/NTC: Specifieke hypergevoelige theorie-componenten en thermisch zwaar afhankelijke flexibele weerstanden en sensoren (een PTC ziet als een koperdraad zijn ingebouwde weerstand flink en direct toenemen in de hitte bij brandende hitteverwerking, een NTC ziet wonderbaarlijk als koelkastsensor zijn weerstand in Ohms genadeloos inkrimpen en diep afnemen bij opstuwende hitte in het metertje).\n- LDR (Lichtgevoelige Weerstand): Component dat functioneert als foto-weerstand voor schemer-sturingen; zijn wrijvingskracht klapt keihard naar de bodem en verdampt in weerstand als er meer zon of felle lumen-stralenbundels op zijn vlakke plaat slaan en hij wordt onoverbrugbaar gesperd, torenhoog van ohmse grens en geïsoleerd als het object verzuipt in duistere nachtelijkse schaduw of duisternis deert.\n- Diode / Led: Geniaal opgebouwde p-n halfgeleider structuur-componenten uit de techniek die hun unieke ontworpen moleculaire taak uitvoeren die meedogenloos elke verkeerd rijdende theorie-elektronenstroom aan de grens blokkeert en weigert toe te laten, of onbeperkt openwaait en theorievrij doorlaat op pure basis, zuiver en puur afhankelijk van of ze aangesloten in de juiste spanningspolariteit in en parallel aan de vereiste voorschriftelijke aansluitingsrichting of pool is gemanoeuvreerd in het stroom-overzichts-circuit.\n\nHoofdstuk 3: Krachten"}]}]}, {"id": "c-2", "title": "Hoofdstuk 3: Krachten", "paragraphs": [{"id": "c2-p-0", "title": "3.1 Soorten krachten", "sections": [{"id": "c2p0-s-0", "label": "Leerdoelen", "content": "- Je kent de definitie van de grootheid kracht als een vectorgrootheid.\n- Je snapt dat krachten onzichtbaar zijn, maar dat je de gevolgen (vervorming of snelheidsverandering) wel kunt zien.\n- Je kent de eigenschappen en theorie van de zwaartekracht, normaalkracht, veerkracht, spankracht, spierkracht, schuifwrijvingskracht, rolweerstandskracht en luchtweerstandskracht."}, {"id": "c2p0-s-1", "label": "Samenvatting", "content": "**Gevolgen en eigenschappen van een kracht:** Je kunt een kracht zelf niet zien, maar je neemt wel de effecten ervan waar: een voorwerp kan vervormen of de snelheid/richting van een voorwerp kan veranderen.\n\n- Het symbool voor kracht is F en de eenheid is Newton (N).\n- Kracht is een vectorgrootheid. Dat betekent dat het drie dingen heeft: een grootte, een richting, en een aangrijpingspunt (de specifieke plek waar de kracht op het voorwerp werkt). In tekeningen geef je een kracht weer als een pijl, waarbij je een vaste krachtenschaal gebruikt (bijvoorbeeld: 1 cm komt overeen met 10 N).\n\n**De soorten krachten in de mechanica:**\n\n- Zwaartekracht (F_z): De aantrekkingskracht van de aarde, die altijd loodrecht naar beneden wijst vanuit het zwaartepunt van het object. Formule: F_z = m * g (waarbij valversnelling g = 9,81 m/s2).\n- Normaalkracht (F_n): De tegendruk van een ondergrond op een voorwerp dat daarop ligt. De normaalkracht staat altijd strak loodrecht op het oppervlak.\n- Veerkracht (F_v): De kracht die een ingedrukte of uitgerekte veer uitoefent om terug te veren. Formule: F_v = C * u (C is de veerconstante in N/m, u is de uitrekking in meter).\n- Spankracht (F_span): De trekkracht die door een gespannen draad of kabel loopt.\n- Schuifwrijvingskracht (F_w,s): De weerstand die ontstaat als twee oppervlakken langs elkaar schuren. De maximale schuifwrijving vlak voordat iets in beweging komt, hangt af van de ruwheid van het materiaal en de normaalkracht. Formule: F_w,s,max = f * F_n (waarbij f de wrijvingscoëfficiënt is).\n- Rolweerstandskracht (F_w,r): Ontstaat doordat wielen en de ondergrond altijd een heel klein beetje indeuken. Let op: Zowel schuif- als rolweerstand zijn niet afhankelijk van de snelheid!\n- Luchtweerstandskracht (F_w,l): De wrijving van de botsende luchtmoleculen. Deze kracht is enorm afhankelijk van de snelheid. Hoe harder je rijdt, hoe groter de kracht. Formule: F_w,l = 1/2 * rho * C_w * A * v^2. Hier is rho de luchtdichtheid, C_w de aerodynamische vorm, A het frontale oppervlakte en v de snelheid."}, {"id": "c2p0-s-2", "label": "Belangrijke begrippen", "content": "- Vector: Een grootheid (zoals kracht) met zowel een grootte als een duidelijke richting.\n- Normaalkracht (F_n): De afwerende reactiekracht van het oppervlak loodrecht op de richting van dat oppervlak.\n- Veerconstante (C): Een stofeigenschap die de \"stugheid\" van een veer weergeeft (in N/m)."}]}, {"id": "c2-p-1", "title": "3.2 Krachten samenstellen", "sections": [{"id": "c2p1-s-0", "label": "Leerdoelen", "content": "- Je kunt meerdere losse krachten samenvoegen tot één resulterende kracht.\n- Je kunt krachten in dezelfde lijn simpel optellen of aftrekken.\n- Je kent de parallellogrammethode en kop-staartmethode voor krachten onder een hoek."}, {"id": "c2p1-s-1", "label": "Samenvatting", "content": "**De Resulterende Kracht (F_res):** Als er vijf mensen tegelijk aan een blok trekken, kun je al die losse krachten vervangen door één denkbeeldige kracht die exact hetzelfde effect zou hebben. Dit noem je de resulterende kracht, de resultante of de nettokracht (F_res).\n\n**Methode 1: Krachten langs één lijn:**\n\n- Werken twee krachten exact dezelfde kant op? Dan mag je ze domweg bij elkaar optellen.\n- Werken ze precies in tegengestelde richting (zoals een motor die vooruit trekt en wrijving die naar achter trekt)? Dan trek je de kleinste van de grootste af.\n\n**Methode 2: Krachten onder een hoek:** Als krachten schuin op elkaar staan, mag je de getallen niet zomaar optellen. Je lost dit grafisch (in een tekening) op:\n\n- De parallellogrammethode: Je tekent de twee krachtpijlen vanuit één gezamenlijk aangrijpingspunt. Je tekent evenwijdige hulplijnen vanuit de pijlpunte om een parallellogram te maken. De diagonaal vanuit het beginpunt naar de overkant is de resulterende kracht.\n- De kop-staartmethode: Je pakt de tweede krachtpijl en legt de 'staart' (het begin) daarvan precies aan de 'kop' (het pijlpunt) van de eerste kracht. De vector die loopt van je allereerste beginpunt tot aan het allerlaatste pijlpunt, is je resulterende kracht.\n- Als twee krachten een hoek van exact 90 graden (loodrecht) maken, kun je de resultante perfect wiskundig berekenen met de Stelling van Pythagoras (a^2 + b^2 = c^2)."}, {"id": "c2p1-s-2", "label": "Belangrijke begrippen", "content": "- Resulterende kracht (F_res): De opgetelde, gecombineerde nettokracht van alle afzonderlijke krachten.\n- Parallellogrammethode: Grafische constructie om de resultante van twee vectoren met een gedeeld aangrijpingspunt te bepalen.\n- Kop-staartmethode: Methode waarbij je vectoren achter elkaar plakt om de totaalvector te vinden."}]}, {"id": "c2-p-2", "title": "3.3 Krachten ontbinden", "sections": [{"id": "c2p2-s-0", "label": "Leerdoelen", "content": "- Je kunt het omgekeerde doen van krachten samenstellen: één kracht uitsplitsen in meerdere componenten.\n- Je kunt een schuine spierkracht ontbinden in een horizontale en een verticale component met sinus en cosinus.\n- Je kunt de zwaartekracht op een helling ontbinden in de twee juiste richtingen."}, {"id": "c2p2-s-1", "label": "Samenvatting", "content": "**Het ontbinden in componenten:** Als een kracht diagonaal werkt (bijvoorbeeld een sleepkabel die in een hoek van 30 graden omhoog trekt aan een kist), doet deze kracht twee dingen tegelijk: hij trekt de kist vooruit over de grond (horizontaal), en hij tilt de kist een klein beetje op in de lucht (verticaal). Het opsplitsen van die ene schuine kracht in deze twee lossere, nuttige krachten heet het **ontbinden in componenten**. Je tekent letterlijk een rechthoek (parallellogram) rond de schuine pijl, zodat de schuine pijl de diagonaal vormt.\n\n**Horizontaal en Verticaal rekenen:** Als de schuine kracht F bekend is, samen met de hoek alpha (de hoek met de grond), gebruik je de goniometrische regels om de componenten exact te berekenen:\n\n- Verticale component: F_vert = F * sin(alpha)\n- Horizontale component: F_hor = F * cos(alpha)\n\n**Krachten op een helling:** Een klassiek VWO-probleem is een blokje op een schuine helling (hoek alpha). De zwaartekracht (F_z) wijst altijd recht naar beneden. Om te zien of het blokje gaat glijden, is de rechte zwaartekracht niet nuttig. Je moet F_z ontbinden in het assenstelsel van de helling zelf:"}, {"id": "c2p2-s-2", "label": "Belangrijke begrippen", "content": "- Ontbinden: Het wiskundig of grafisch omzetten van één kracht-vector in twee nieuwe (loodrechte) component-vectoren.\n- Componenten: De opgesplitste delen van een kracht (zoals F_horizontaal of de component evenwijdig aan de helling)."}]}, {"id": "c2-p-3", "title": "3.4 De eerste wet van Newton", "sections": [{"id": "c2p3-s-0", "label": "Leerdoelen", "content": "- Je kent de Eerste Wet van Newton uit je hoofd.\n- Je begrijpt dat een resulterende kracht van nul niet betekent dat het voorwerp stilstaat, maar dat de snelheid constant is.\n- Je snapt het begrip traagheid in relatie tot de massa."}, {"id": "c2p3-s-1", "label": "Samenvatting", "content": "**De Eerste Wet van Newton (De wet van de traagheid):** De wet luidt: Als er op een voorwerp *geen* resulterende (netto)kracht werkt (F_res = 0), dan verandert de snelheid niet. Het voorwerp blijft dan in volkomen rust, óf het beweegt met een **constante snelheid langs een rechte lijn**.\n\n- Constante snelheid: Het klinkt gek, maar om een snelheid vast te houden in de lege ruimte heb je geen aandrijvingskracht nodig! In het echte leven (zoals op de fiets of in de auto) gebruik je wel kracht, maar die is puur bedoeld om weerstandskrachten op te heffen. Fiets je met een constante snelheid van 20 km/u, dan is je spierkracht vooruit exact even groot als de luchtweerstand naar achter. Resultante = 0 N.\n\n**Traagheid:** Als een voorwerp eenmaal rijdt of stilstaat, wil het dat graag blijven doen. Dit 'verzet' van materie tegen snelheidsverandering (of je nu wil remmen of optrekken) heet **traagheid**. Traagheid is direct verbonden aan massa. Hoe groter de massa (bijv. een zware vrachtwagen), hoe groter de traagheid, en hoe moeilijker het is om de vrachtwagen vanuit stilstand op gang te krijgen of in een noodsituatie af te remmen. Als een auto crasht, wil jouw massa met dezelfde constante snelheid door de voorruit vliegen. Daarom dragen we veiligheidsgordels."}, {"id": "c2p3-s-2", "label": "Belangrijke begrippen", "content": "- Eerste wet van Newton: Een voorwerp waarop de nettokracht nul is, heeft een constante snelheid of staat stil.\n- Traagheid: De fysische eigenschap van massa om zich te verzetten tegen een verandering van snelheid."}]}, {"id": "c2-p-4", "title": "3.5 De tweede wet van Newton", "sections": [{"id": "c2p4-s-0", "label": "Leerdoelen", "content": "- Je kent de Tweede Wet van Newton en kunt de wet (F_res = m * a) foutloos toepassen in berekeningen.\n- Je begrijpt de invloed van massa en kracht op de versnelling.\n- Je snapt het verschil in versnelling tussen een vrije val en een val met luchtweerstand.\n- Je begrijpt hoe computermodellen valbewegingen in kleine tijdstapjes doorrekenen."}, {"id": "c2p4-s-1", "label": "Samenvatting", "content": "**De Tweede Wet van Newton:** Waar de Eerste Wet stelt wat er gebeurt als F_res gelijk is aan nul, stelt de Tweede Wet wat er gebeurt als F_res **ongelijk** is aan nul.\n\n- Als de resulterende kracht vooruit wijst, zal het voorwerp versnellen. Wijst de resulterende kracht naar achteren (tegen de bewegingsrichting in), dan zal het vertragen.\n- Formule: F_res = m * a\n  - F_res = de resulterende kracht in Newton (N).\n  - m = de massa van het voorwerp in kilogram (kg).\n  - a = de veroorzaakte versnelling in m/s2.\n\n**De Vrije Val:** In een perfect vacuüm (zonder luchtweerstand) werkt alleen de zwaartekracht. Dus F_res = F_z. Omdat F_z = m * g, volgt daaruit: m * g = m * a. De massa 'm' staat aan beide kanten van de vergelijking en kun je wegstrepen. Dit bewijst wiskundig dat bij een vrije val alle voorwerpen in het universum **even snel vallen** met een vaste versnelling (a = g = 9,81 m/s2), ongeacht of het een loden kogel of een ganzenveer is.\n\n**Val met luchtweerstand:** In de praktijk springt een parachutist in de lucht. De zwaartekracht (F_z) trekt hem omlaag, maar de opwaartse luchtweerstand (F_w,l) drukt hem omhoog. De F_res is hierdoor kleiner dan F_z. Naarmate hij sneller valt, wordt de luchtweerstand steeds feller. Op een gegeven moment is de opwaartse luchtweerstand exact even groot als de neerwaartse zwaartekracht. De F_res wordt dan NUL. Vanaf dat moment versnelt hij niet meer en valt hij met een veilige, constante topsnelheid naar de aarde.\n\n**Computermodellen:** Omdat luchtweerstand continu mee-verandert met de snelheid, zijn deze bewegingen niet met een simpel formuletje te berekenen. Men gebruikt een computermodel dat het proces in duizenden mini-tijdstapjes (delta t) knipt. De computer rekent per stapje de F_res uit, deelt door de massa voor de nieuwe versnelling, past de snelheid aan en herhaalt dit continu."}, {"id": "c2p4-s-2", "label": "Belangrijke begrippen", "content": "- Tweede wet van Newton: Het wiskundige theorema dat stelt dat een nettokracht resulteert in een evenredige versnelling (F_res = m * a).\n- Vrije val: Een ongestoorde val, zonder wrijving, puur onder de constante invloed van zwaartekracht."}]}, {"id": "c2-p-5", "title": "3.6 Cirkelbewegingen", "sections": [{"id": "c2p5-s-0", "label": "Leerdoelen", "content": "- Je weet de eigenschappen van een eenparige cirkelbeweging.\n- Je kunt de baansnelheid berekenen: v = (2 * pi * r) / T.\n- Je begrijpt het concept van de middelpuntzoekende kracht en kunt de formule toepassen: F_mpz = (m * v^2) / r."}, {"id": "c2p5-s-1", "label": "Samenvatting", "content": "**Eenparige cirkelbeweging en baansnelheid:** Als een satelliet of het ruimtestation (ISS) in een perfecte cirkel rond de aarde vliegt met een constant tempo, is de grootte van de snelheid ongewijzigd. Toch verandert de **richting** van de snelheid constant; in elke bocht wijst je neus ergens anders heen.\n\n- Omdat de richting verandert, is er sprake van een versnelling, en dus stelt Newton dat er een kracht aanwezig moet zijn!\n- Baansnelheid (v): De snelheid langs de cirkelbaan bereken je door de omtrek van de cirkel te delen door de tijd voor één heel rondje. Formule: v = (2 * pi * r) / T (waarbij r de baanstraal is en T de omlooptijd in s).\n\n**De middelpuntzoekende kracht (F_mpz):** De kracht die continu loodrecht op de vliegrichting trekt om het voorwerp de cirkel in te slepen (naar het middelpunt), heet de **middelpuntzoekende kracht**.\n\n- Cruciaal inzicht: De middelpuntzoekende kracht is geen aparte of nieuwe fysieke kracht. Het is slechts een etiket of naam voor de benodigde resulterende netto-kracht in een bocht.\n- In de ruimte functioneert de Zwaartekracht als de F_mpz die het ISS in de baan houdt. Als een auto de rotonde neemt, levert de zijdelingse schuifwrijving op de banden de F_mpz. Valt de wrijving weg (bijvoorbeeld op ijs), dan is F_res = 0 en schiet de auto volgens de Eerste Wet van Newton in een rechte lijn rechtdoor de bocht uit!\n- Formule: F_mpz = (m * v^2) / r\n  - F_mpz = de benodigde middelpuntzoekende kracht in Newton (N)\n  - m = de massa van het voorwerp (kg)\n  - v = de constante baansnelheid (m/s)\n  - r = de straal van de cirkel of bocht (m)"}, {"id": "c2p5-s-2", "label": "Belangrijke begrippen", "content": "- Eenparige cirkelbeweging: Beweging in een perfect ronde baan met een constante baansnelheid.\n- Baansnelheid (v): Snelheid van een object over de omtrek van een ronde baan.\n- Middelpuntzoekende kracht (F_mpz): De vereiste resulterende zijdelingse nettokracht die nodig is om een voorwerp af te laten buigen in een gesloten cirkelbaan.\n\nHoofdstuk 4: Trillingen"}]}]}, {"id": "c-3", "title": "Hoofdstuk 4: Trillingen", "paragraphs": [{"id": "c3-p-0", "title": "4.1 Eigenschappen van trillingen", "sections": [{"id": "c3p0-s-0", "label": "Leerdoelen", "content": "- Je kent het verschil tussen een algemene periodieke beweging en een specifieke trilling.\n- Je kent de begrippen uitwijking, amplitude, evenwichtsstand, periode en frequentie, en kunt ze toepassen.\n- Je kunt feilloos rekenen met trillingstijd en frequentie: f = 1 / T.\n- Je weet hoe je de fase en gereduceerde fase op een bepaald tijdstip bepaalt.\n- Je kent de betekenis van de termen 'in fase' en 'in tegenfase'."}, {"id": "c3p0-s-1", "label": "Samenvatting", "content": "**Wat is een trilling?**\n\n- Een periodieke beweging is in de natuurkunde elke beweging die zich continu en op hetzelfde ritme in de tijd herhaalt (zoals een planeet in een ronde baan om de zon).\n- Een trilling is een speciale periodieke beweging waarbij een voorwerp heen en weer beweegt rondom één v
