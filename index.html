nu met elkaar.\n\n- Bij hele specifieke, \"passende\" frequenties (de eigenfrequenties) ontstaat er een patroon dat stil lijkt te staan. De golf loopt niet meer van links naar rechts, maar deeltjes trillen alleen nog maar op hun eigen plek op en neer. Dit is een staande golf.\n- Knoop (K): Een punt in het patroon dat door continue destructieve interferentie volledig stilstaat (amplitude is altijd nul).\n- Buik (B): Een punt in het patroon dat afwisselend de maximale uitslag naar boven en naar beneden maakt (constructieve interferentie).\n\n**Vaste afstanden in een staande golf:**\n\n- De afstand tussen 2 opeenvolgende knopen (K-K) is altijd exact 1/2 * lambda (een halve golflengte).\n- De afstand tussen 2 opeenvolgende buiken (B-B) is ook altijd exact 1/2 * lambda.\n- De afstand tussen een knoop en de direct ernaast gelegen buik (K-B) is altijd 1/4 * lambda (een kwart golflengte).\n\n**Staande golven in snaren (en aan beide kanten open buizen):** Bij een gitaarsnaar zitten beide uiteinden vast. Vaste uiteinden kunnen niet trillen, dus daar bevinden zich altijd **knopen (K)**. *(Hetzelfde rekenprincipe geldt voor een buis die aan beide kanten open is, alleen zitten daar aan de uiteinden altijd twee buiken (B).)*\n\n- Grondtoon (n = 1): De eenvoudigst mogelijke trilling in de snaar (Knoop - Buik - Knoop).\n  - Lengte van de snaar: L = 1/2 * lambda_1\n- Eerste boventoon (n = 2): Er komt een extra knoop in het midden bij (K-B-K-B-K).\n  - Lengte van de snaar: L = 1 * lambda_2\n- Tweede boventoon (n = 3):\n  - Lengte van de snaar: L = 1,5 * lambda_3\n- Algemene formule: L = n * (1/2 * lambda) [waarbij n = 1, 2, 3...]\n- Frequentie-regel: De frequentie van de boventonen is altijd een heel veelvoud van de grondtoon: f_n = n * f_1.\n\n**Staande golven in aan één kant gesloten buizen:** Denk aan een klarinet of een panfluit. Het ene uiteinde is dicht (knoop K, lucht kan daar niet heen en weer), en het andere uiteinde is open (buik B, lucht kan maximaal trillen).\n\n- Grondtoon (n = 1): Patroon van de bodem tot de opening is Knoop - Buik.\n  - Lengte van de buis: L = 1/4 * lambda_1\n- Eerste boventoon (n = 3): Er past een extra K en B bij in de buis (K-B-K-B).\n  - Lengte van de buis: L = 3/4 * lambda_3\n- Tweede boventoon (n = 5):\n  - Lengte van de buis: L = 5/4 * lambda_5\n- Algemene formule: L = (2n - 1) * (1/4 * lambda) [waarbij n = 1, 2, 3...]\n- Let op het grote verschil! Bij buizen met één gesloten kant ontbreken de \"even\" harmonischen. Je hebt alleen een 1e, 3e, 5e, 7e (oneven) veelvoud van de grondtoon!"}, {"id": "c8p3-s-2", "label": "Belangrijke begrippen", "content": "- Staande golf: Een niet-verplaatsend golfpatroon dat ontstaat door de interferentie van twee golven met dezelfde frequentie in tegengestelde richting.\n- Knoop (K): Punt in een staande golf dat volledig in rust is.\n- Buik (B): Punt in een staande golf met de maximale amplitude.\n- Eigenfrequentie (Resonantiefrequentie): De specifieke frequenties waarmee een snaar of luchtkolom van nature \"wil\" trillen om een staande golf te vormen.\n- Grondtoon (f_1): De állerlaagste eigenfrequentie die in een object past.\n- Boventoon: Alle hogere trillingsfrequenties die in het instrument passen (f_2, f_3, etc.).\n\nHoofdstuk 10: Medische beeldvorming"}]}]}, {"id": "c-9", "title": "Hoofdstuk 10: Medische beeldvorming", "paragraphs": [{"id": "c9-p-0", "title": "10.1 Röntgenstraling", "sections": [{"id": "c9p0-s-0", "label": "Leerdoelen", "content": "- Je weet in detail hoe röntgenstraling ontstaat in een medische röntgenbuis via twee processen: remstraling en karakteristieke straling.\n- Je kent de eigenschappen en toepassingen van deze hoog-energetische straling.\n- Je kunt het doordringend vermogen en de verzwakking van röntgenstraling berekenen met het begrip halveringsdikte (d1/2).\n- Je kunt complexe berekeningen maken met de formule: I = I0 * (1/2)^(d / d1/2).\n- Je begrijpt het conceptuele verschil tussen een normale röntgenfoto (2D) en een CT-scan (3D)."}, {"id": "c9p0-s-1", "label": "Samenvatting", "content": "**Eigenschappen van röntgenstraling:** Röntgenstraling is een vorm van elektromagnetische straling (fotonen) met een golflengte die nog korter is dan UV-licht. Hierdoor heeft de straling een hele hoge frequentie en dus **veel energie**. Het is **ioniserend**, wat betekent dat een röntgenfoton genoeg energie heeft om elektronen weg te schieten uit weefsel-atomen. Dit kan het cel-DNA beschadigen, waardoor de straling schadelijk is voor de gezondheid.\n\n**Ontstaan in een röntgenbuis:** In het ziekenhuis ontstaat de straling in een vacuümbuis (röntgenbuis). Uit een gloeidraad (de minpool, kathode) worden elektronen losgemaakt. Door een extreem hoge spanning (de buisspanning U, vaak tienduizenden Volts) worden deze elektronen met gigantische snelheid naar een metalen blok (de pluspool, anode, vaak gemaakt van wolfraam) geschoten. Als de elektronen in het metaal inslaan, remmen ze abrupt af. Deze botsing levert voor 99% hitte op, en voor slechts 1% bruikbare röntgenstraling. Er ontstaan twee soorten röntgenstraling:\n\n**Instellingen op het apparaat:**\n\n- Buisspanning (kV): Bepaalt de topsnelheid van de elektronen, en daarmee de maximale energie (de 'hardheid') en het doordringend vermogen van de röntgenbundel.\n- Buisstroom (mA) en belichtingstijd (s): Bepalen puur hoeveel elektronen er per seconde oversteken. Dit regelt de intensiteit (de absolute hoeveelheid fotonen) van de bundel, maar maakt de fotonen op zichzelf niet krachtiger.\n\n**Verzwakking en Halveringsdikte:** Röntgenfotonen die door een patiënt reizen, kunnen ontsnappen of geabsorbeerd worden.\n\n- Halveringsdikte (d1/2): Dit is de exacte dikte van een specifiek materiaal die nodig is om de helft (50%) van de stralingsenergie tegen te houden. In Binas tabel 28F zie je dat bot een veel kleinere halveringsdikte heeft dan spierweefsel (het bot houdt de straling veel sneller tegen).\n- De Absorptie-formule: I = I0 * (1/2)^(d / d1/2)\n  - I = de intensiteit (of het percentage, bv. in W/m2 of gewoon \"12,5%\") van de straling die óver is ná passage door het weefsel.\n  - I0 = de begin-intensiteit van de straling (de 100% die het apparaat uitstuurt).\n  - d = de totale dikte van het materiaal waar de straling doorheen moest (in cm of mm).\n  - d1/2 = de halveringsdikte van dat specifieke materiaal (deze moet je in precies dezelfde eenheid invullen als d).\n\n**Röntgenfoto vs. CT-scan:**\n\n- Röntgenfoto: Een simpel 2D-schaduwbeeld. Bot absorbeert vrijwel alle straling en houdt daardoor de film erachter ongebelicht (dat wordt weergegeven als wit). Zacht weefsel en met lucht gevulde longen laten veel straling door en kleuren de foto zwart. Omdat alles over elkaar heen ligt in 2D, is diepte lastig in te schatten.\n- CT-scan (Computed Tomography): Bij een CT-scan draait de röntgenbuis samen met een ring van detectoren razendsnel helemaal rondom de patiënt. Er worden honderden smalle \"plakjes\" (dwarsdoorsneden) gescand. Een zware computer rekent al die plakjes om en bouwt een enorm gedetailleerd 3D-model van organen en botten."}, {"id": "c9p0-s-2", "label": "Belangrijke begrippen", "content": "- Röntgenstraling: Kortgolvige en hoogfrequente ioniserende straling, afkomstig uit elektronenovergangen.\n- Remstraling: Het brede spectrum röntgenfotonen dat ontstaat door het afremmen van elektronen bij een atoomkern.\n- Karakteristieke straling: Straling met een paar specifieke pieken, die ontstaat door gaten in de binnenste elektronenschillen.\n- Halveringsdikte (d1/2): De vaste dikte van een weefsel of stof waarbij 50% van de invallende stralingsintensiteit wordt geabsorbeerd.\n- CT-scan: Geavanceerde, draaiende röntgentechniek om 3D-beelden te berekenen."}]}, {"id": "c9-p-1", "title": "10.2 Radioactiviteit en nucleaire diagnostiek", "sections": [{"id": "c9p1-s-0", "label": "Leerdoelen", "content": "- Je weet hoe spontaan radioactief verval werkt en kent de eigenschappen en verschillen in doordringend en ioniserend vermogen van alfa-, beta- en gammastraling.\n- Je kunt foutloze kernreactievergelijkingen opstellen waarbij de massagetallen en atoomnummers kloppen.\n- Je begrijpt de begrippen halveringstijd (t1/2) en activiteit (A) van een radioactieve bron en kunt hiermee rekenen.\n- Je kunt werken met de vervalformule A(t) = A0 * (1/2)^(t / t1/2).\n- Je weet hoe de ziekenhuistechnieken tracers, SPECT-scans en PET-scans werken vanuit de binnenkant van de patiënt."}, {"id": "c9p1-s-1", "label": "Samenvatting", "content": "**Soorten ioniserende straling:** Niet elke atoomkern in de natuur is stabiel. Instabiele kernen (radio-isotopen) proberen rustiger te worden door spontaan deeltjes of energie uit te spugen (te vervallen). Er zijn drie belangrijke soorten \"radioactieve\" straling:\n\n**Kernreactievergelijkingen opstellen:**\n\n- Een element noteer je als (M)X(Z). Het massagetal (M) staat linksboven (totaal protonen + neutronen). Het atoomnummer (Z) staat linksonder (aantal protonen).\n- De gouden regel: Bij een radioactieve reactie is de som van alle getallen bóvenaan vóór de pijl altijd gelijk aan de som bóvenaan ná de pijl. Hetzelfde geldt voor de getallen onderaan. Zo kun je altijd het missende deeltje of atoom uitrekenen.\n\n**Halveringstijd en Activiteit:**\n\n- Halveringstijd (t1/2): Dit is de vaste tijdsduur waarin precies de helft van de nog aanwezige instabiele radioactieve kernen is vervallen en is omgezet in een andere stof. Elke isotoop in Binas tabel 25 heeft zijn eigen unieke halveringstijd (variërend van milliseconden tot miljarden jaren).\n- Activiteit (A): Dit getal geeft aan hoeveel stralings\"flitsen\" of atoomvervallen de bron per seconde uitzendt. De eenheid van activiteit is de Becquerel (Bq). 1 Bq = 1 kernverval per seconde.\n- Omdat de hoeveelheid radioactief materiaal halveert na elke t1/2, halveert de activiteit A (het aantal flitsen per seconde) uiteraard ook.\n- De Vervalformule: A(t) = A0 * (1/2)^(t / t1/2)\n  - A(t) = de activiteit op het latere tijdstip t.\n  - A0 = de begin-activiteit op het startmoment (t=0).\n  - t = de verstreken tijd in secondes, uren of jaren.\n  - t1/2 = de halveringstijd in precies dezelfde eenheid als t.\n\n**Nucleaire Diagnostiek in het Ziekenhuis (Tracers):** Bij röntgenfoto's staat de bron buiten de patiënt. Bij nucleaire diagnostiek (zoals in de oncologie) krijgt de patiënt de stralingsbron in zich gespoten!\n\n- Tracer: Een molecuul dat van nature door een specifiek ziek orgaan of tumor wordt opgenomen (bijv. jodium voor de schildklier, of veel suiker voor een snelgroeiende tumor). Aan dit molecuul koppelen ze in het lab een radioactieve isotoop.\n- Om de patiënt te beschermen, kiest men voor deze isotopen altijd gammastralers met een relatief korte halveringstijd (bijv. een paar uur). Waarom gamma? Omdat gamma een enorm doordringend vermogen heeft, verlaat de straling makkelijk de patiënt, zodat het ziekenhuisapparaat erbuiten het kan meten. Alfa of bèta zou in het lichaam vast blijven zitten en daar alle cellen slopen.\n- PET-scan (Positron Emissie Tomografie): Bij deze techniek injecteert men een tracer die beta-plus straling uitzendt. Er schiet een positron (antimaterie) weg in de patiënt. Na hooguit 1 tot 2 millimeter botst dit positron op een normaal elektron in een cel. Materie en antimaterie vernietigen elkaar dan onmiddellijk! Dit bizarre proces heet annihilatie. De totale massa verdwijnt en verandert in energie: er schieten twee keiharde gammafotonen in een hoek van exact 180 graden (precies tegenovergesteld) naar buiten. De detectiecilinder vangt ze allebei tegelijk op, en kan zo op de millimeter nauwkeurig een driedimensionale berekening maken van waar de tumor zit."}, {"id": "c9p1-s-2", "label": "Belangrijke begrippen", "content": "- Radioactief verval: Het natuurlijke proces waarbij een onstabiele kern straling uitzendt om stabieler te worden.\n- Alfa-, bèta- en gammastraling: De drie hoofdgroepen van ioniserende straling.\n- Activiteit (A): Het aantal atoomkernen dat er exact in 1 seconde vervalt (uitgedrukt in Becquerel, Bq).\n- Halveringstijd (t1/2): De tijdsduur die nodig is om de helft van de radioactieve atoomkernen in een preparaat te laten vervallen.\n- Tracer (speurstof): Een biologische stof met een ingebouwde radioactieve verklikker, gebruikt om orgaanfuncties of tumoren in beeld te brengen.\n- Annihilatie: De reactie tussen een elektron en een positron (antimaterie) die leidt tot de totale omzetting van beide massa's in twee gammafotonen, gebruikt bij de PET-scan."}]}, {"id": "c9-p-2", "title": "10.3 Echografie en MRI", "sections": [{"id": "c9p2-s-0", "label": "Leerdoelen", "content": "- Je begrijpt in detail hoe echografie beelden creëert door gebruik te maken van reflectie van ultrageluid (echoscopie).\n- Je kunt de diepte van weefsels in het lichaam berekenen via de geluidssnelheid en echotijd (s = v * t / 2).\n- Je kunt uitleggen wat akoestische impedantie (Z) is, en weet dat verschillen hierin de oorzaak zijn van echoreflecties.\n- Je kent de uitgebreide theorie achter een MRI-scan (magnetische velden, protonen en radiogolven).\n- Je kent de verschillen, voordelen en nadelen van echografie en MRI in vergelijking met röntgen en straling."}, {"id": "c9p2-s-1", "label": "Samenvatting", "content": "**Echografie (Ultrageluid):** Echografie (bekend van het bekijken van baby's in de baarmoeder) is buitengewoon veilig. Het maakt namelijk **geen gebruik van gevaarlijke ioniserende straling**, maar van geluidsgolven.\n\n- De arts plaatst een scanner, de transducer, op de huid. Dit apparaatje is een zender en een microfoon in één. Het vuurt hele korte pulsjes ultrageluid af (geluid met een frequentie boven de 20.000 Hz, vaak zelfs in de miljoenen Hertz/Megahertz, onhoorbaar voor mensen).\n- De geluidsgolf reist door het lichaam. Telkens als het geluid op een grens tussen twee verschillende weefsels stuit (bijvoorbeeld van vocht naar de spierwand), wordt een gedeelte van het geluid teruggekaatst als een echo. De transducer vangt deze zwakke echo op.\n- Diepte berekenen met de echotijd: De computer meet op de microseconde nauwkeurig hoe lang de puls erover deed om terug te komen. Let heel goed op: de gemeten tijd 't' is de tijd voor de heen- én de terugweg! Om de diepte 'd' tot het orgaan te berekenen, gebruik je de formule:\n  - Formule: d = (v * t) / 2\n  - v = de geluidssnelheid in dat specifieke weefsel of orgaan (zoek deze op in Binas tabel 15A voor bijvoorbeeld water, bloed of spier).\n  - t = de gemeten totale retourtijd.\n\n**Akoestische impedantie (Z):** Waarom kaatst geluid precies op zo'n orgaangrens terug? Dat komt door een eigenschap genaamd Akoestische impedantie (Z), wat eigenlijk de weerstand van het materiaal tegen de geluidsgolf is.\n\n- Formule: Z = dichtheid * geluidssnelheid (Z = rho * v)\n- Gouden regel van de echo: Hoe groter het wiskundige verschil in impedantie (Z) tussen weefsel 1 en weefsel 2, des te groter het percentage geluid dat terugkaatst. Tussen water en bloed is het verschil klein, dus reflecteert er maar 1% en gaat 99% door om dieper te kunnen kijken. Maar het verschil in impedantie tussen lucht en de huid is gigantisch: 99,9% van het ultrageluid zou al op de huidlaag direct de lucht in terugkaatsen!\n- Oplossing: Daarom spuiten artsen bij een echo altijd een dikke laag koude echogel op je buik. De gel vult het laagje lucht op en heeft een impedantie die vrijwel gelijk is aan de huid, waardoor het geluid soepel je lichaam kan binnendringen.\n\n**MRI-scan (Magnetic Resonance Imaging):** Net als echografie gebruikt MRI **geen ioniserende straling**, maar in plaats daarvan extreem sterke magneten en onschuldige radiogolven om beelden te maken van week weefsel (zoals de hersenen en spieren, iets wat een röntgenfoto erg slecht kan). De techniek zit ingewikkeld in elkaar, met 4 duidelijke stappen:"}, {"id": "c9p2-s-2", "label": "Belangrijke begrippen", "content": "- Ultrageluid: Onhoorbaar hoge geluidsfrequenties (boven 20.000 Hz) ingezet om lichamelijke echo's op te wekken.\n- Transducer: Het apparaat voor op de huid dat zowel het echogeluid uitzendt als het reflectiegeluid ontvangt.\n- Akoestische impedantie (Z): Weefseleigenschap die de geluidsweerstand uitdrukt en bepaalt hoeveel reflectie er ontstaat (Z = rho * v).\n- MRI: Beeldvormende scantechniek, gebaseerd op het magnetische gedrag van waterstofkernen en onschadelijke radiogolven.\n- Relaxatietijd: De tijdspanne die protonen in een MRI nodig hebben om, na absorptie van radio-energie, terug te veren naar hun stabiele evenwichtsstand in het magneetveld."}]}, {"id": "c9-p-3", "title": "10.4 Stralingsdosis en bescherming", "sections": [{"id": "c9p3-s-0", "label": "Leerdoelen", "content": "- Je kent het duidelijke en rekenkundige verschil tussen de fysieke geabsorbeerde dosis (D) en de biologisch belangrijke equivalente dosis (H).\n- Je kunt accuraat rekenen met de dosis (D = E / m) en de equivalente dosis (H = w_R * D).\n- Je begrijpt en herkent in medische casussen de verschillen tussen somatische schade (voor jezelf) en genetische schade (voor je nageslacht).\n- Je kent het wezenlijke onderscheid tussen deterministische stralingseffecten en stochastische stralingseffecten.\n- Je kent het ALARA-principe en zijn drie basisregels voor effectieve stralingsbescherming (afstand, tijd, en afscherming)."}, {"id": "c9p3-s-1", "label": "Samenvatting", "content": "**Dosis (D) en Equivalente Dosis (H):** Bij blootstelling aan een röntgenapparaat of radioactief materiaal, moeten we bepalen hoe groot het risico op schade aan het weefsel is.\n\n- Geabsorbeerde Dosis (D): Geeft domweg aan hoeveel Joule aan ruwe, fysieke stralingsenergie er op een blok van een kilogram vlees of orgaan is ingeslagen.\n  - Formule: D = E / m\n  - D = de dosis in de eenheid Gray (Gy), wat exact hetzelfde is als Joule per kilogram (J/kg).\n  - E = de totale ingeslagen/geabsorbeerde stralingsenergie (in Joule).\n  - m = de massa van het specifieke orgaan of weefsel dat de straling opvangt (in kg).\n- Equivalente Dosis (H): Omdat bijvoorbeeld alfastraling (een lomp kanonskogel-deeltje) twintig keer meer schade en ravage in je DNA aanricht bij exact dezelfde dosis (energie) als een kleine, snelle röntgenstraal, moeten we een correctiefactor toepassen om te weten hoe gevaarlijk het is voor je gezondheid.\n  - Formule: H = w_R * D\n  - H = de equivalente (biologisch gecorrigeerde) dosis, uitgedrukt in de eenheid Sievert (Sv). In het ziekenhuis rekenen ze met mSv.\n  - w_R = de vaste stralingsweegfactor die aangeeft hoe schadelijk het stralingstype is. (Binas tabel 27D: voor gamma, röntgen en bèta is w_R = 1. Voor zware alfastraling is w_R = 20!).\n  - D = de eerder berekende dosis in Gray.\n\n**Biologische effecten en orgaanschade:** Weefsels waar cellen heel snel delen (zoals botweefsel of de eierstokken) zijn uiterst kwetsbaar voor stralingsschade.\n\n- Somatische effecten: Als jouw maag of huid wordt beschadigd door straling en jij daar als patiënt zélf ziek van wordt.\n- Genetische effecten: Als de straling de DNA-ketens in een spermacel of eicel beschadigt, ben jij niet ziek, maar kan je het defecte gen wel doorgeven, waardoor je toekomstige kind gehandicapt ter wereld komt.\n\nWe delen het ontstaan van de stralingsklachten in onder twee begrippen:\n\n- Deterministische effecten (Acute, fysieke schade): Dit soort klachten treedt pas op als je over een bepaalde drempel heen gaat (bijvoorbeeld bij een kernramp zoals Tsjernobyl). Als je weinig straling krijgt, gebeurt er niets. Kom je boven de drempel, dan gaat je haar uitvallen, verbrandt je huid acuut, of sterven je bloedcellen direct af. En: hoe meer straling je krijgt, hoe veel erger de klachten worden.\n- Stochastische effecten (Langdurig Kans-risico): Er is bij deze effecten geen drempel. Een enkele, zwakke stralingsfoton ergens jaren geleden in een röntgenbuis kan net één stukje DNA verkeerd muteren en uitgroeien tot een dodelijke kanker-tumor 20 jaar later. Elk beetje straling levert risico op. Er is geen veilige ondergrens, de dosis beïnvloedt alleen puur de wiskundige kans óf je de tumor krijgt.\n\n**Stralingsbescherming (Het ALARA-principe):** ALARA is een ziekenhuisprotocol en staat voor *As Low As Reasonably Achievable* (Houd de dosis zo onbenullig klein als redelijkerwijs mogelijk is, zelfs bij medisch noodzakelijke onderzoeken). Als verpleegkundige, arts of radioloog bescherm je jezelf en de patiënt met drie ijzersterke methodes:"}, {"id": "c9p3-s-2", "label": "Belangrijke begrippen", "content": "- Geabsorbeerde Dosis (D): De opgevangen en opgenomen stralingsenergie verdeeld per kilogram lichaamsweefsel (in Gray).\n- Equivalente Dosis (H): De daadwerkelijke, gecorrigeerde biologische schadelijkheid van de ontvangen dosis, uitgedrukt in Sievert (Sv).\n- Stralingsweegfactor (w_R): Getalswaarde (uit de Binas) om te benadrukken dat bijvoorbeeld alfastraling veel desastreuzer is dan röntgenstraling.\n- Deterministisch effect: Stralingsschade met een duidelijke drempelwaarde en acute symptomen (zoals huidverbranding en haaruitval).\n- Stochastisch effect: Effecten zonder veilige grens, puur gebaseerd op waarschijnlijkheid (hoe meer straling, hoe groter de kans op latere kanker).\n- ALARA-principe: De strenge, allesomvattende vuistregel om mens en omgeving zo min mogelijk aan stralingsniveaus bloot te stellen via Tijd, Afscherming en Afstand.\n\nHoofdstuk 11: Astrofysica"}]}]}, {"id": "c-10", "title": "Hoofdstuk 11: Astrofysica", "paragraphs": [{"id": "c10-p-0", "title": "11.1 Sterren waarnemen", "sections": [{"id": "c10p0-s-0", "label": "Leerdoelen", "content": "- Je weet exact wat het verschil is tussen astronomie (sterrenkunde) en astrofysica.\n- Je begrijpt dat natuurkundige wetten en constanten die op aarde gelden, eveneens op alle hemellichamen in het heelal van toepassing zijn.\n- Je kent het volledige elektromagnetisch spectrum van straling uit het heelal.\n- Je weet welke golflengten door de aardatmosfeer worden doorgelaten (het optisch venster en radiovenster) en welke worden geabsorbeerd door gassen (zoals ozon, waterdamp en CO2).\n- Je kunt gedetailleerd uitleggen waarom we satellieten en ruimtetelescopen buiten de dampkring in een baan om de aarde plaatsen."}, {"id": "c10p0-s-1", "label": "Samenvatting", "content": "**Astronomie vs. Astrofysica:**\n\n- Astronomie (sterrenkunde): De oudste wetenschap die zich bezighoudt met het waarnemen, in kaart brengen en beschrijven van de posities, banen en bewegingen van hemellichamen zoals sterren, planeten, kometen en melkwegstelsels.\n- Astrofysica: De tak van de natuurkunde die waarnemingen uit het heelal verklaart aan de hand van fysische wetten, mechanica, thermodynamica, atoomfysica en theoretische modellen.\n- Universele natuurwetten: Het fundament van de astrofysica is de aanname dat natuurwetten (zoals de wetten van Newton, thermische straling en kwantummechanica) overal in het universum identiek zijn.\n\n**Straling uit het heelal & Het Elektromagnetisch Spectrum:** Informatie over het universum bereikt ons voornamelijk via elektromagnetische straling. Dit spectrum bestaat uit (geordend van kortste golflengte/hoogste energie naar langste golflengte/laagste energie):\n\n**Invloed van de Aardatmosfeer & Vensters:** De aardatmosfeer filtert veel straling. Niet alles bereikt het aardoppervlak:\n\n- Het Optisch Venster: De atmosfeer laat zichtbaar licht en een smal stukje nabij-infrarood door. Hierdoor kunnen we met optische telescopen op aarde kijken.\n- Het Radiovenster: Radiogolven met golflengten van circa 1 mm tot 20 meter dringen ongehinderd door de dampkring. Hiervoor gebruiken we grote schotelantennes op aarde.\n- Geabsorbeerde Straling:\n  - Röntgen- en Gammastraling worden hoog in de atmosfeer geabsorbeerd.\n  - UV-straling wordt grotendeels opgevangen door de ozonlaag in de stratosfeer.\n  - Infrarood wordt geabsorbeerd door broeikasgassen zoals waterdamp en koolstofdioxide.\n\n**Waarom Ruimtetelescopen?** Astronomen plaatsen telescopen in de ruimte (zoals Hubble en James Webb) om twee redenen:"}, {"id": "c10p0-s-2", "label": "Belangrijke begrippen", "content": "- Astrofysica: Het verklaren van kosmische verschijnselen met natuurkundige wetten.\n- Optisch venster: Het golflengtebereik waarin de atmosfeer zichtbaar licht doorlaat.\n- Radiovenster: Het golflengtegebied waarin radiogolven de aarde bereiken.\n- Atmosferische vertroebeling: Onscherp beeld door bewegende luchtlagen in de dampkring."}]}, {"id": "c10-p-1", "title": "11.2 Straling en de samenstelling van sterren", "sections": [{"id": "c10p1-s-0", "label": "Leerdoelen", "content": "- Je kent en herkent de drie typen spectra: continu spectrum, emissiespectrum en absorptiespectrum.\n- Je kunt exact uitleggen hoe Fraunhoferlijnen in het zonnespectrum ontstaan.\n- Je weet hoe je met Binas (Tabel 20) de chemische samenstelling van de buitenste gaslaag van een ster bepaalt.\n- Je begrijpt de overgangen van elektronen (fotonenabsorptie en -emissie)."}, {"id": "c10p1-s-1", "label": "Samenvatting", "content": "**De Drie Typen Spectra:** Wanneer licht door een prisma of tralie wordt geleid, valt het uiteen in een spectrum:\n\n**Fraunhoferlijnen & De Samenstelling van Sterren:**\n\n- In de kern van een ster ontstaat een continu spectrum.\n- Dit licht reist naar buiten en passeert de fotosfeer (de koelere, ijlere buitenste gaslaag van de ster).\n- Atomen in de fotosfeer absorberen specifieke kleuren/golflengten uit dat licht.\n- Het resultaat is dat sterlicht een absorptiespectrum is, vol met donkere lijnen: de Fraunhoferlijnen.\n- Analyse: Door de golflengten van deze donkere lijnen op te meten en te vergelijken met tabellen in Binas, kunnen astrofysici exact bepalen uit welke gassen de buitenlaag van een ster bestaat."}, {"id": "c10p1-s-2", "label": "Belangrijke begrippen", "content": "- Continu spectrum: Spectrum met alle kleuren direct aaneengesloten.\n- Emissiespectrum: Lijnenspectrum veroorzaakt door oplichtend gas.\n- Absorptiespectrum: Continu spectrum onderbroken door donkere absorptielijnen.\n- Fraunhoferlijnen: De donkere lijnen in het spectrum van de zon/sterren.\n- Fotosfeer: De buitenste licht-uitstralende gaslaag van een ster."}]}, {"id": "c10-p-2", "title": "11.3 Afstand en snelheid van sterren", "sections": [{"id": "c10p2-s-0", "label": "Leerdoelen", "content": "- Je kunt de afstand tot nabije sterren berekenen met behulp van de parallaxhoek (r = 1 / p).\n- Je weet hoe je afstanden omrekent tussen meters, lichtjaren en parsecs.\n- Je snapt het verschil tussen de tangentiële snelheid en radiale snelheid van een ster.\n- Je kunt de radiale snelheid berekenen met de Dopplerformule: v_rad = (delta_lambda / lambda_0) * c.\n- Je weet het verschil tussen roodverschuiving en blauwverschuiving.\n- Je kunt de Wet van Hubble (v = H0 * r) toepassen en hiermee de ouderdom van het universum berekenen."}, {"id": "c10p2-s-1", "label": "Samenvatting", "content": "**Afstandsbepaling via Parallax:** Doordat de aarde in een half jaar naar de andere kant van de zon beweegt, vertoont een nabije ster een schijnbare verschuiving ten opzichte van achtergrondsterren.\n\n- Parallax (p): De halve hoek van deze verschuiving.\n- Formule: r = 1 / p\n  - r = afstand in parsec (pc). 1 parsec is ongeveer 3,26 lichtjaar.\n  - p = parallax in boogseconden (waarbij 1 boogseconde gelijk is aan 1/3600 graad).\n- Deze methode werkt betrouwbaar tot sterren op circa 30.000 lichtjaar afstand.\n\n**Snelheidsvectoren van een Ster:** De snelheid van een ster ten opzichte van de aarde ontbinden we in twee componenten:\n\n**Dopplereffect en Radiale Snelheid:** Het Dopplereffect verandert de golflengte van het licht als de ster beweegt.\n\n- Blauwverschuiving: De ster beweegt naar ons toe. De lichtgolven worden in elkaar gedrukt, de golflengte wordt korter en verschuift richting blauw.\n- Roodverschuiving: De ster beweegt van ons af. De lichtgolven worden opgerekt, de golflengte wordt langer en verschuift richting rood.\n- Formule: v_rad = (delta_lambda / lambda_0) * c\n  - v_rad = radiale snelheid (m/s)\n  - delta_lambda = de gemeten verschuiving in golflengte (gemeten golflengte min de Binas-golflengte)\n  - lambda_0 = de ongestoorde rustgolflengte uit Binas\n  - c = lichtsnelheid (3,00 * 10^8 m/s)\n\n**De Uitdijing van het Heelal & Wet van Hubble:** Edwin Hubble ontdekte dat vrijwel alle verre sterrenstelsels roodverschuiving vertonen en dus van ons af bewegen. Hoe verder weg ze staan, hoe sneller ze bewegen.\n\n- Wet van Hubble: v = H0 * r\n  - v = verwijderingssnelheid (m/s of km/s)\n  - r = afstand tot het melkwegstelsel\n  - H0 = de Hubbleconstante (ongeveer 2,28 * 10^-18 s^-1, zie Binas)\n- Ouderdom van het heelal schatten: Als de uitdijing constant was, geldt snelheid = afstand / tijd (v = r / t). Als je dit combineert met de Wet van Hubble (H0 * r = r / t), rolt daaruit: t = 1 / H0. Dit geeft een ouderdom van circa 13,8 miljard jaar."}, {"id": "c10p2-s-2", "label": "Belangrijke begrippen", "content": "- Parallax (p): De halve schijnbare hoekverschuiving van een ster in de loop van een jaar.\n- Parsec (pc): Afstandsmaat in het heelal, gelijk aan 3,26 lichtjaar.\n- Radiale snelheid: Snelheidscomponent in de kijkrichting.\n- Roodverschuiving / Blauwverschuiving: Verschuiving van lichtgolven door beweging van de bron.\n- Hubbleconstante (H0): De verhouding tussen de snelheid en afstand van sterrenstelsels."}]}, {"id": "c10-p-3", "title": "11.4 Temperatuur en stralingsvermogen van sterren", "sections": [{"id": "c10p3-s-0", "label": "Leerdoelen", "content": "- Je kunt de Planck-kromme van een zwarte straler aflezen en analyseren.\n- Je kunt de oppervlaktetemperatuur berekenen met de Wet van Wien (lambda_max * T = k_Wien).\n- Je kunt het stralingsvermogen (lichtkracht P) berekenen met de Wet van Stefan-Boltzmann (P = sigma * A * T^4).\n- Je kent de kwadratenwet voor stralingsintensiteit (I = P / (4 * pi * r^2))."}, {"id": "c10p3-s-1", "label": "Samenvatting", "content": "**De Zwarte Straler & Planck-kromme:** Een ster gedraagt zich als een \"zwarte straler\": een voorwerp dat straling uitzendt afhankelijk van zijn temperatuur. De verdeling van die straling over alle kleuren teken je in een Planck-kromme.\n\n- Bij een hogere temperatuur zendt de ster meer straling uit (hogere grafiek).\n- Bij een hogere temperatuur schuift de piek van de grafiek naar links, naar de kortere golflengten.\n\n**Wet van Wien (Kleur & Temperatuur):** De golflengte (lambda_max) waarbij de ster de meeste straling uitzendt, vertelt je hoe heet de ster is.\n\n- Koele sterren hebben hun piek in het rood. Hete sterren hebben hun piek in het blauw.\n- Formule: lambda_max * T = k_Wien\n  - lambda_max = piek-golflengte in meter\n  - T = oppervlaktetemperatuur in Kelvin\n  - k_Wien = Constante van Wien (2,8978 * 10^-3 m*K, uit Binas)\n\n**Wet van Stefan-Boltzmann (Stralingsvermogen P):** Het totale vermogen dat een ster per seconde uitzendt (de lichtkracht P in Watt) is afhankelijk van de oppervlakte en de temperatuur. Het stijgt met de vierde macht van de temperatuur!\n\n- Formule: P = sigma * A * T^4\n  - P = stralingsvermogen in Watt\n  - sigma = Constante van Stefan-Boltzmann (5,67 * 10^-8, uit Binas)\n  - A = totale bolvormige oppervlakte (4 * pi * straal^2)\n  - T = temperatuur in Kelvin\n\n**Kwadratenwet voor Stralingsintensiteit (I):** De energie die de ster uitzendt verspreidt zich over een steeds grotere ruimte naarmate het verder reist.\n\n- Formule: I = P / (4 * pi * r^2)\n  - I = intensiteit op aarde in Watt per vierkante meter\n  - P = totale stralingsvermogen van de ster in Watt\n  - r = afstand tot de ster in meter"}, {"id": "c10p3-s-2", "label": "Belangrijke begrippen", "content": "- Zwarte straler: Een stralingsbron waarvan het spectrum alleen van de temperatuur afhangt.\n- Wet van Wien: Koppelt de kleur (piek-golflengte) van een ster aan haar temperatuur.\n- Stralingsvermogen (P): De totale uitgezonden energie per seconde (in Watt).\n- Intensiteit (I): Het ontvangen vermogen per vierkante meter op een bepaalde afstand."}]}, {"id": "c10-p-4", "title": "11.5 Het Hertzsprung-Russell-diagram en de levensloop van sterren", "sections": [{"id": "c10p4-s-0", "label": "Leerdoelen", "content": "- Je kunt gegevens opzoeken en interpreteren in het Hertzsprung-Russell-diagram (HR-diagram).\n- Je kent de vier hoofdgroepen: Hoofdreeks, Rode Reuzen, Superreuzen en Witte Dwergen.\n- Je snapt hoe kernfusie werkt en kunt de energie berekenen met het massadefect (E = delta_m * c^2).\n- Je kent de levensloop van lichte sterren (zoals de zon) en zware sterren."}, {"id": "c10p4-s-1", "label": "Samenvatting", "content": "**Het Hertzsprung-Russell (HR)-diagram:** Het HR-diagram is een grote grafiek waarin sterren worden ingedeeld:\n\n- Horizontale as: Oppervlaktetemperatuur T. Let op: deze as staat omgekeerd! Heet (blauw) staat links en koel (rood) staat rechts.\n- Verticale as: Stralingsvermogen P, relatief ten opzichte van onze zon (op een logaritmische schaal).\n\n**De Vier Groepen in het HR-diagram:**\n\n**Energie door Kernfusie:** In het centrum van een ster fuseren 4 waterstofkernen tot 1 heliumkern, plus een paar kleine deeltjes (zoals positronen).\n\n- Massadefect (delta_m): De massa van de 4 losse waterstofkernen vóór de fusie is íets groter dan de heliumkern ná de fusie. Er is massa \"verdwenen\".\n- Massa wordt energie: Deze verdwenen massa is omgezet in energie volgens Einsteins bekende formule: E = delta_m * c^2.\n  - E = energie in Joule\n  - delta_m = massadefect in kg\n  - c = lichtsnelheid\n\n**Evolutie & Levensloop van Sterren:**"}, {"id": "c10p4-s-2", "label": "Belangrijke begrippen", "content": "- HR-diagram: Grafiek van stralingsvermogen tegenover oppervlaktetemperatuur.\n- Hoofdreeks: Diagonaal in het HR-diagram van stabiele sterren die waterstof fuseren.\n- Massadefect: Massa die \"verdwijnt\" bij kernfusie en energie wordt.\n- Rode Reus: Sterk uitgezette, koele ster in haar eindfase.\n- Supernova: Eindexplosie van een zeer zware ster.\n- Witte Dwerg / Neutronenster / Zwart Gat: De drie mogelijke eindstadia (restanten) van een ster, afhankelijk van haar beginmassa."}]}]}]};

  function normalizeSubject(s){
    if(!s.chapters) s.chapters = [];
    if(!s.books) s.books = [];
    if(!s.notes) s.notes = [];
    if(!s.portfolioItems) s.portfolioItems = [];
    (s.notes || []).forEach(function(n){
      if(!n.sections){
        n.sections = [{ id: uid('sec'), label: 'Inhoud', content: n.content || '' }];
        delete n.content;
      }
    });
    (s.portfolioItems || []).forEach(function(p){
      if(!p.sections){
        p.sections = [{ id: uid('sec'), label: 'Notities', content: p.content || '' }];
        delete p.content;
      }
      if(!p.status) p.status = 'Nog te doen';
    });
    function ensureParaChildren(list){
      (list || []).forEach(function(p){
        if(!p.children) p.children = [];
        ensureParaChildren(p.children);
      });
    }
    (s.chapters || []).forEach(function(c){
      if(!c.paragraphs) c.paragraphs = [];
      ensureParaChildren(c.paragraphs);
    });
    return s;
  }

  // ---------- Date helpers (used by the planner) ----------
  var MONTHS_SHORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  function mondayOfWeek(d){
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1 - day);
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
    return r;
  }
  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dateFromISO(s){
    var parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(d, n){
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  }
  function formatShortDate(d){
    return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
  }
  function isSameDate(a, b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function normalizeWeek(w){
    if(w.startDate === undefined) w.startDate = isoDate(mondayOfWeek(new Date()));
    if(w.note === undefined) w.note = w.label || '';
    if(!w.cells) w.cells = {};
    return w;
  }

    'de belofte van pisa': {
      'Personages': "- **Samir (Sam) Zauri (hoofdpersoon):** Een begaafde Marokkaans-Nederlandse jongen uit Amsterdam-West. Hij speelt uitstekend trompet en heeft een scherp intellect, maar moet vechten tegen de vooroordelen van zijn omgeving en zijn eigen twijfels.\n- **Mo Zauri:** Sams oudere broer en grote idool. Mo raakt betrokken bij zware criminaliteit, maar stelt de toekomst van Sam boven alles.\n- **Soep:** Sams beste jeugdvriend uit West. Hij blijft trouw aan het straatleven en begrijpt Sams keuzes voor de 'kakkerwereld' niet altijd.\n- **Annelies:** Een rijke klasgenote van het Hervormd Lyceum Zuid op wie Sam verliefd wordt; zij opent voor hem de deuren naar het welgestelde milieu van Amsterdam-Zuid.\n- **IJsbrand:** Een arrogante, bevoorrechte klasgenoot op het lyceum die Sam regelmatig confronteert met subtiel en direct racisme.",
      'Belangrijkste gebeurtenissen': "- Sam groeit op in de wijk Bos en Lommer (Amsterdam-West), waar hij met zijn broer Mo droomt van succes en trompet speelt.\n- Mo raakt betrokken bij een gewapende overval op een juwelier in de PC Hooftstraat en wordt gearresteerd; hij krijgt een celstraf van jaren.\n- Vlak voor Mo de gevangenis in gaat, eist hij een heilig vonnis van Sam: hij moet koste wat het kost zijn vwo-diploma halen ('De belofte van Pisa').\n- Sam wordt als enige jongen uit West toegelaten op het elitaire Hervormd Lyceum Zuid, waar hij geconfronteerd wordt met rijkdom, elitair gedrag en discriminatie van klasgenoten zoals IJsbrand.\n- Sam balanceert op een snijvlak: hij moet zich handhaven tussen de kakkerstijl van Zuid en het straatleven met vriend Soep in West, terwijl hij verliefd wordt op Annelies.\n- Ondanks heftige confrontaties, afwijzing en verleidingen om op het slechte pad te raken, zet Sam door en behaalt hij onder enorme druk zijn vwo-diploma.",
      'Thema\u2019s': "- **Klassenverschillen en integratie:** De confrontatie tussen het rauwe straatleven in Amsterdam-West en het bevoorrechte, intellectuele milieu in Amsterdam-Zuid.\n- **Broederliefde en loyaliteit:** De onvoorwaardelijke band met Mo als brandstof om te slagen in het leven.\n- **Vooroordelen en institutioneel racisme:** De constante bewijsdrang van een Marokkaanse jongen in een overwegend witte, elitaire schoolomgeving.\n- **Identiteit en ontworteling:** Het gevoel nergens meer helemaal bij te horen wanneer je stijgt op de maatschappelijke ladder.",

      'Perspectief': "- **Eerste persoon (ik-perspectief)** vanuit Sam.\n- Dit geeft de lezer directe toegang tot zijn humor, woede, onzekerheid en scherpe maatschappelijke observaties.",
      'Tijd en ruimte': "- **Tijd:** Hedendaags, beslaat Sams volledige middelbareschooltijd op het lyceum.\n- **Ruimte:** De contrastrijke omgeving van Amsterdam-West (Bos en Lommer) en Amsterdam-Zuid (Oud-Zuid / Hervormd Lyceum Zuid).",
      'Opvallende stijl': "- Een mix van rauwe straattaal, snelle humor, poëtische muzikale beschrijvingen en directheid.",

      'Belangrijkste gebeurtenissen': "- Giorgio's vader verlaat het gezin abrupt, waardoor Giorgio achterblijft met een alleenstaande moeder die de financiële eindjes nauwelijks aan elkaar kan knopen.\n- Giorgio raakt gefrustreerd en woedend, krijgt problemen op school en dreigt op straat te ontsporen door opstootjes met zijn rivaal Emin.\n- Om zijn opgekropte emoties een plek te geven, meldt hij zich aan bij de lokale kickboksschool van Trainer Oom Hennie.\n- Emin daagt Giorgio uit voor een illegaal gevecht buiten de ring om 'respect' en geld af te dwingen op straat.\n- Giorgio leert van Oom Hennie dat 'klappen krijgen' in de ring én in het leven erbij hoort, maar dat beheersing en keuzes bepalen wie je bent. Hij weigert de straatvalstrik en kiest voor een officiële bokswedstrijd waarin hij mentaal en fysiek de baas wordt over zichzelf.",

  var SCHEIKUNDE_H1 = {
    id: uid('c'), title: 'Hoofdstuk 1: Chemisch rekenen',
    paragraphs: [
      schPara(
        '1.1 Atoombouw en periodiek systeem',
        "- Je kunt met een atoommodel van kern en elektronenwolk de bouw van atomen en ionen beschrijven.\n- Je kunt de opbouw van het periodiek systeem beschrijven en gebruiken om atoombouw en chemische eigenschappen te voorspellen.",
        "**Ontwikkeling van het atoommodel:** Het huidige atoommodel is stap voor stap opgebouwd door verschillende wetenschappers.\n- Demokritos (circa 420 v.Chr.) bedacht als eerste dat materie uit ondeelbare deeltjes bestaat: atomos.\n- Dalton (1808) beschreef atomen als harde, ondeelbare bolletjes.\n- Thomson (1897) ontdekte het elektron, waardoor bleek dat atomen zelf ook lading bevatten.\n- Rutherford (1911) toonde aan dat een atoom een positieve kern heeft met daaromheen een negatieve **elektronenwolk**.\n- Bohr (1914) liet elektronen in vaste banen (**elektronenschillen**) om de kern bewegen: de K-, L- en M-schil bevatten maximaal 2, 8 en 18 elektronen.\n- Chadwick (1932) ontdekte het neutron, waarmee het atoommodel compleet werd: een atoom bestaat uit **protonen** (1+) en **neutronen** (0) in de kern, met **elektronen** (1-) eromheen. Deze lading heet het elementair ladingskwantum *e* (1,60·10^-19 C, Binas 7A).\n\n**Atoomnummer en massagetal:**\n- Het **atoomnummer** is het aantal protonen in de kern en bepaalt welk element het is. Bij een neutraal atoom geldt: atoomnummer = aantal protonen = aantal elektronen.\n- Het **massagetal** is het totale aantal protonen + neutronen in de kern (bijv. ¹⁶O of O-16).\n- **Isotopen** zijn atomen van hetzelfde element (zelfde aantal protonen) met een verschillend aantal neutronen, en dus een verschillend massagetal. Alle isotopen staan in Binas tabel 25A.\n- Let op: het massagetal zegt alleen iets over het aantal deeltjes in de kern, niet exact over de massa van het atoom.\n\n**Relatieve massa's:**\n- Omdat atomen extreem licht zijn, gebruik je de atomaire massa-eenheid **u**: 1 u = 1/12 van de massa van een ¹²C-atoom = 1,66·10^-27 kg (Binas 7B).\n- De **relatieve atoommassa (Ar)** is het gewogen gemiddelde van de massa's van alle isotopen van een element, gewogen naar hoe vaak ze in de natuur voorkomen (Binas tabel 99).\n- Met de Ar-waarden bereken je de **relatieve molecuulmassa (Mr)** van een heel molecuul door de Ar's van alle atomen op te tellen.\n\n**Periodiek systeem:**\n- Mendelejev rangschikte elementen op oplopende atoommassa en liet bewust gaten open voor nog niet ontdekte elementen (zoals germanium) — zijn voorspellingen kwamen precies uit.\n- Elementen staan in volgorde van atoomnummer in **perioden** (rijen) en **groepen** (kolommen); elementen in dezelfde groep hebben vergelijkbare eigenschappen.\n- Het periodiek systeem is grofweg te verdelen in **metalen** (midden/links, vormen geen moleculen, geleiden stroom en warmte goed) en **niet-metalen** (rechts, vaak twee-atomige moleculen zoals N₂ en O₂, geleiden meestal geen stroom).\n\n**Oktetregel:**\n- De elektronen in de buitenste schil heten **valentie-elektronen**; deze bepalen de reactiviteit van een atoom.\n- **Edelgassen** (groep 18) hebben (op helium na) altijd 8 valentie-elektronen: de stabiele **edelgasconfiguratie**. Daardoor reageren ze bijna nooit.\n- De **oktetregel** stelt dat atomen 'streven' naar 8 valentie-elektronen, net als de edelgassen.\n- **Halogenen** (groep 17) nemen daarvoor makkelijk een elektron op; **alkalimetalen** (groep 1) en **aardalkalimetalen** (groep 2) staan juist makkelijk elektronen af. Metalen worden dan positief geladen, niet-metalen negatief.\n- Niet-metalen kunnen ook een elektronenpaar delen via een **covalente binding** (atoombinding) om de edelgasconfiguratie te bereiken. Het aantal bindingen dat een atoom daarvoor aangaat heet de **covalentie**, af te lezen aan de groep in het periodiek systeem.",
        "- **Atoommodel:** Het model dat een atoom beschrijft als een kern van protonen en neutronen, omringd door elektronen.\n- **Elektronenschil:** Een vaste baan (K, L, M, ...) waarin elektronen om de kern bewegen, met een maximumaantal elektronen per schil.\n- **Atoomnummer:** Het aantal protonen in de kern; bepaalt het element.\n- **Massagetal:** Het totale aantal protonen + neutronen in de kern.\n- **Isotoop:** Atomen van hetzelfde element met een verschillend aantal neutronen.\n- **Relatieve atoommassa (Ar):** Het gewogen gemiddelde van de massa's van alle isotopen van een element.\n- **Periode / Groep:** Een rij, respectievelijk kolom, in het periodiek systeem.\n- **Valentie-elektronen:** De elektronen in de buitenste schil van een atoom, bepalend voor reactiviteit.\n- **Oktetregel:** Atomen 'streven' naar 8 valentie-elektronen (de edelgasconfiguratie).\n- **Covalentie:** Het aantal covalente bindingen dat een atoom aangaat om de edelgasconfiguratie te bereiken."
      ),
      schPara(
        '1.2 De chemische hoeveelheid',
        "- Je kunt rekenen met de molaire massa en het getal van Avogadro.\n- Je kunt rekenen met dichtheid.",
        "**Chemische hoeveelheid:** Omdat het aantal deeltjes N in een hoeveelheid stof enorm groot is, reken je in de scheikunde met de **chemische hoeveelheid n** in de eenheid **mol**.\n- 1,00 mol van een stof bevat altijd 6,02·10^23 deeltjes: het **getal van Avogadro (NA)** (Binas 7A).\n- Formule: n = N / NA\n- Mol zegt dus iets over het *aantal* deeltjes, niet over hun massa.\n\n**Molaire massa:** De massa van 1 mol deeltjes heet de **molaire massa (M)**, in gram per mol (g mol⁻¹).\n- Handig gevolg: de getalswaarde van de relatieve molecuulmassa Mr (in u) is precies gelijk aan de molaire massa M (in g mol⁻¹) van diezelfde stof.\n- Formule: n = m / M\n\n**Dichtheid:** Voor vloeistoffen en gassen is het vaak praktischer om met volume te rekenen dan met massa. De **dichtheid (ρ)** rekent volume om naar massa.\n- Formule: ρ = m / V\n- Dichtheden van veelgebruikte stoffen staan in Binas tabel 8 t/m 12 en gelden bij kamertemperatuur (dichtheid hangt af van temperatuur).\n- Om van volume naar mol te rekenen, reken je dus eerst via de dichtheid naar massa, en dan via de molaire massa naar mol.",
        "- **Chemische hoeveelheid (n):** Grootheid die het aantal deeltjes uitdrukt in de eenheid mol.\n- **Getal van Avogadro (NA):** 6,02·10^23 deeltjes per mol — het aantal deeltjes in 1,00 mol stof.\n- **Molaire massa (M):** De massa van 1 mol deeltjes, in g mol⁻¹.\n- **Dichtheid (ρ):** De massa per volume-eenheid van een stof, ρ = m / V."
      ),
      schPara(
        '1.3 Rekenen aan gehaltes',
        "- Je kunt berekeningen uitvoeren aan gehaltes: massapercentage, volumepercentage, massa-ppm, massa-ppb en concentratie.\n- Je kunt uitleggen wat de significantie van meetwaarden is en uitkomsten van berekeningen in het juiste aantal significante cijfers weergeven.",
        "**Significante cijfers:** De nauwkeurigheid van een meetwaarde geef je weer met **significante cijfers** (betekenisvolle cijfers) — hoe nauwkeuriger het meetinstrument, hoe meer significante cijfers.\n- Je telt van links naar rechts, startend bij het eerste cijfer ongelijk aan 0; nullen aan het eind tellen ook mee.\n- **Telwaarden** (zoals een atoomnummer, of het aantal metingen) zijn exacte gehele getallen met oneindige significantie — ze bepalen dus nooit het aantal significante cijfers van een uitkomst.\n\n**Wetenschappelijke notatie:** Grote of kleine getallen schrijf je compact met één cijfer voor de komma maal een macht van 10, bijv. 0,00230 = 2,30·10⁻³.\n\n**Afrondingsregels bij berekeningen:**\n- **Optellen/aftrekken:** rond af op het aantal decimalen van de minst nauwkeurige meetwaarde.\n- **Vermenigvuldigen/delen:** rond af op het aantal significante cijfers van de minst nauwkeurige meetwaarde.\n- Combinatie van beide? Eerst regel 1 toepassen, dan regel 2.\n- Rond nooit een tussenantwoord af — alleen het eindantwoord.\n\n**Percentages, ppm en ppb:** Het gehalte van een stof in een mengsel druk je uit als deel van het geheel.\n- massapercentage = m(stof) / m(mengsel) × 100%\n- massa-ppm = m(stof) / m(mengsel) × 10^6 (parts per million); massa-ppb = ×10^9 (parts per billion) — voor heel lage gehaltes.\n- Bij gassen/vloeistoffen gebruik je vaak het volumepercentage of volume-ppm op dezelfde manier, maar dan met V in plaats van m.\n\n**Concentratie:** De **concentratie (c)** geeft aan hoeveel stof er in 1 liter oplossing zit, meestal in mol per liter.\n- Concentratie in mol/L heet ook wel de **molariteit**, genoteerd als [A] of c(A), met eenheid mol L⁻¹ of M (molair).\n- Formule: [A] = c(A) = n / V",
        "- **Significante cijfers:** De cijfers in een meetwaarde die betekenisvol zijn voor de nauwkeurigheid.\n- **Telwaarde:** Een exact geheel getal (zoals een aantal metingen), met oneindige significantie.\n- **Massapercentage / ppm / ppb:** Het gehalte van een stof in een mengsel, uitgedrukt als percentage, miljoenste of miljardste deel.\n- **Concentratie / Molariteit (c, [A]):** De chemische hoeveelheid van een stof per liter oplossing, in mol L⁻¹ (M)."

      schPara(
        '1.4 Rekenen aan reacties',
        "- Je kunt berekeningen uitvoeren aan chemische processen en reacties met molverhoudingen en de wet van behoud van massa.\n- Je kunt berekenen hoe groot de overmaat/ondermaat is bij een chemische reactie.",
        "**Reactievergelijking:** Beginstoffen staan links van de pijl, reactieproducten rechts. Met coëfficiënten zorg je dat van elke atoomsoort links en rechts evenveel atomen staan (kloppend maken).\n\n**Wet van behoud van massa:** Alle atomen links van de pijl komen ook rechts terug — er verdwijnt of ontstaat dus nooit massa in een reactie. Met genoeg massagegevens kun je hiermee direct rekenen aan een reactie.\n\n**Stoichiometrische verhouding (molverhouding):** De coëfficiënten in de reactievergelijking geven de verhouding aan waarin stoffen reageren en ontstaan, bijvoorbeeld 1 : 6 : 6 : 6. Ken je de chemische hoeveelheid (mol) van één stof, dan kun je via deze verhouding de mol van elke andere stof in de reactie berekenen.\n\n**Stappenplan rekenen aan reacties:**\n- Stap 1: geef de kloppende reactievergelijking.\n- Stap 2: bereken de chemische hoeveelheid (mol) van de gegeven stof.\n- Stap 3: bereken via de molverhouding de chemische hoeveelheid van de gevraagde stof.\n- Stap 4: reken de chemische hoeveelheid om naar de gevraagde grootheid en eenheid (massa, volume, ...).\n- Stap 5: controleer en rond af op het juiste aantal significante cijfers.\n\n**Ondermaat en overmaat:** Reageren twee beginstoffen niet in precies de molverhouding van de reactievergelijking, dan is er altijd één stof eerder op.\n- De stof die als eerste op is heet de stof in **ondermaat** — deze bepaalt hoeveel product er maximaal kan ontstaan.\n- De stof waar nog van overblijft heet de stof in **overmaat**.\n- Om te bepalen welke stof in ondermaat is: bereken van beide stoffen de chemische hoeveelheid (mol) en vergelijk die verhouding met de molverhouding uit de reactievergelijking.",
        "- **Reactievergelijking:** Een kloppende weergave van een reactie met beginstoffen en reactieproducten, in de juiste atoomverhouding.\n- **Wet van behoud van massa:** In een chemische reactie gaat nooit massa verloren of ontstaat er massa.\n- **Stoichiometrische verhouding (molverhouding):** De verhouding waarin stoffen volgens de coëfficiënten in de reactievergelijking reageren en ontstaan.\n- **Ondermaat:** De beginstof die als eerste op is en zo bepaalt hoeveel product er maximaal ontstaat.\n- **Overmaat:** De beginstof waar na de reactie nog van overblijft."

  var SCHEIKUNDE_H2 = {
    id: uid('c'), title: 'Hoofdstuk 2: Chemische bindingen',
    paragraphs: [
      schPara(
        '2.1 Atoombinding',
        "- Je kunt een beschrijving geven van een atoombinding.\n- Je kunt moleculaire stoffen herkennen aan de atomaire samenstelling (formule).\n- Je kunt een structuurformule omzetten in een molecuulformule en andersom, met behulp van de covalentie.\n- Je kunt het verbreken en vormen van een atoombinding in verband brengen met chemische reacties.",
        "**Atoombinding:** Niet-metaalatomen kunnen de edelgasconfiguratie ook bereiken door een elektronenpaar te *delen* met een ander atoom (in plaats van elektronen af te staan of op te nemen, zoals bij ionen). Dit gedeelde elektronenpaar heet een **gemeenschappelijk elektronenpaar**. Om te kunnen delen, moeten de atomen dicht bij elkaar zitten en hun buitenste elektronenschillen laten overlappen. De binding die zo ontstaat heet een **atoombinding** (ook wel covalente binding).\n- Door een of meer atoombindingen ontstaan **moleculen**. Stoffen die op microniveau uit moleculen bestaan, heten op macroniveau **moleculaire stoffen**.\n- Een **molecuulformule** geeft aan welke en hoeveel atomen in een molecuul zitten (bijv. H₂O, O₂). Een **structuurformule** laat zien hóe de atomen onderling verbonden zijn — elk streepje stelt een gemeenschappelijk (bindend) elektronenpaar voor.\n\n**Covalentie:** Het aantal atoombindingen dat een atoom aangaat om de edelgasconfiguratie te bereiken, heet de **covalentie** van dat atoom.\n- Je kunt de covalentie aflezen aan de groep in het periodiek systeem: hoe verder een groep van groep 18 (de edelgassen) af staat, hoe meer elektronen het atoom moet delen.\n- Voorbeelden (Binas/tabel): H heeft covalentie 1, O covalentie 2, N covalentie 3, C covalentie 4, en de halogenen (F, Cl, Br, I) covalentie 1.\n- Uitzondering: H bereikt de edelgasconfiguratie van helium al met 2 elektronen in de K-schil, vandaar covalentie 1.",
        "- **Atoombinding (covalente binding):** Een binding tussen twee niet-metaalatomen die ontstaat door het delen van een gemeenschappelijk elektronenpaar.\n- **Moleculaire stof:** Een stof die op microniveau is opgebouwd uit moleculen.\n- **Molecuulformule:** Geeft aan welke atoomsoorten en hoeveel atomen een molecuul bevat.\n- **Structuurformule:** Laat zien hoe de atomen in een molecuul onderling verbonden zijn via bindende elektronenparen.\n- **Covalentie:** Het aantal atoombindingen dat een atoom aangaat om de edelgasconfiguratie te bereiken."
      ),
      schPara(
        '2.2 Bindingen tussen moleculen',
        "- Je kunt een beschrijving geven van een vanderwaalsbinding en een waterstofbrug en uitleggen waar de sterkte van deze bindingen van afhangt.\n- Je kent de algemene eigenschappen van moleculaire stoffen en kunt deze verbinden met de microstructuur.\n- Je kunt de sterkte en het type binding tussen moleculen koppelen aan smelt-/kookpunt en oplosbaarheid in water.",
        "**Faseovergangen op microniveau:** In de vaste fase liggen moleculen netjes gestapeld in een **molecuulrooster** en trillen ze op hun plek. Hoe hoger de temperatuur, hoe harder ze trillen en hoe zwakker de onderlinge bindingen worden, totdat het rooster bij het smeltpunt uiteenvalt. Boven het kookpunt worden de bindingen tussen moleculen helemaal verbroken.\n\n**Vanderwaalsbinding:** De binding die moleculen in de vaste en vloeibare fase bij elkaar houdt, heet de **vanderwaalsbinding**. Ze ontstaat doordat elektronen over het molecuuloppervlak bewegen, waardoor tijdelijk licht positieve en licht negatieve delen ontstaan die elkaar aantrekken. De sterkte hangt af van drie factoren:\n- de **molecuulmassa** (zwaarder = sterker, meer elektronen op het oppervlak);\n- het **contactoppervlak** (groter/onvertakt oppervlak = sterker, dus hoger kookpunt dan een vertakt molecuul met dezelfde formule);\n- de **afstand** tussen moleculen (dichter bij elkaar = sterker; in de gasfase is de vanderwaalsbinding helemaal verbroken).\n\n**Waterstofbrug:** Water heeft een veel hoger kookpunt dan je op basis van de (kleine) molecuulmassa zou verwachten — de vanderwaalsbinding alleen kan dat niet verklaren.\n- In een O–H-binding trekt het O-atoom harder aan de elektronen dan het H-atoom. Het elektronenpaar verschuift daardoor iets richting zuurstof: het O-atoom krijgt een permanente **partiële lading δ−**, het H-atoom een **δ+**.\n- Een molecuul met zo'n scheve ladingsverdeling heet een **dipoolmolecuul**.\n- Tussen de δ+ van het ene molecuul en de δ− van het andere ontstaat een sterke elektrostatische aantrekking: de **waterstofbrug** (H-brug), veel sterker dan een vanderwaalsbinding. Waterstofbruggen ontstaan bij groepen als –OH, –NH en C=O (Binas).\n\n**Hydrofiel en hydrofoob:** Watermoleculen binden sterk aan andere stoffen die ook waterstofbruggen kunnen vormen.\n- **Hydrofiele stoffen** lossen op in water (kunnen waterstofbruggen vormen met water).\n- **Hydrofobe stoffen** lossen niet op in water (kunnen dat niet, zoals olie).\n- Of iets oplost hangt af van de verhouding hydrofiel/hydrofoob deel: ethanol (klein hydrofoob deel + één -OH-groep) lost goed op, octanol (lange hydrofobe keten + één -OH-groep) juist slecht.",
        "- **Vanderwaalsbinding:** Zwakke, tijdelijke aantrekking tussen moleculen door bewegende elektronen; sterkte hangt af van molecuulmassa, contactoppervlak en afstand.\n- **Partiële lading (δ+/δ−):** Een permanente, gedeeltelijke lading op een atoom in een molecuul door een ongelijke verdeling van een elektronenpaar.\n- **Dipoolmolecuul:** Een molecuul met een blijvende licht positieve en licht negatieve kant.\n- **Waterstofbrug (H-brug):** Een relatief sterke binding tussen een δ+ en een δ− van naburige moleculen, bij groepen als –OH, –NH, C=O.\n- **Hydrofiel / hydrofoob:** Stoffen die wel, respectievelijk niet, oplossen in water."
      ),
      schPara(
        '2.3 Metaalbinding',
        "- Je kunt metalen herkennen aan de atomaire samenstelling (formule) en van een gegeven metaal de formule opstellen.\n- Je kunt de microstructuur van een metaal en een legering beschrijven.\n- Je kent de algemene eigenschappen van een metaal en een legering en kunt die koppelen aan de microstructuur.",
        "**Metalen op macroniveau:** Metalen herken je aan een paar gedeelde eigenschappen: ze geleiden stroom en warmte goed, hebben een glanzend uiterlijk (gepolijst), zijn meestal vast bij kamertemperatuur (hoog smeltpunt) en zijn vervormbaar.\n\n**Metaalbinding op microniveau:** Metalen vormen geen moleculen — de formule van een metaal is gewoon het atoomsymbool + faseaanduiding (bijv. Au(s), Sn(l)).\n- Metaalatomen hebben meestal 1, 2 of 3 valentie-elektronen die maar zwak vastzitten. Deze laten makkelijk los (edelgasconfiguratie), waardoor een structuur ontstaat van positieve **atoomresten** met daartussen vrij bewegende negatieve elektronen.\n- Deze positieve en negatieve deeltjes trekken elkaar sterk aan: dit heet de **metaalbinding**. In de vaste fase liggen de atoomresten in een regelmatig **metaalrooster**, met de elektronen vrij bewegend ertussen.\n\n**Verklaringen van eigenschappen op macroniveau:**\n- **Geleidbaarheid** (stroom én warmte): doordat de elektronen vrij door het metaal kunnen bewegen.\n- **Vervormbaarheid:** rijen atoomresten kunnen langs elkaar opschuiven zonder dat de metaalbinding verbroken wordt — vandaar dat metalen buigen/pletten in plaats van breken.\n- **Hardheid:** door bijvoorbeeld koolstof toe te voegen (zoals bij gietijzer) wordt het metaalrooster verstoord, waardoor de rijen niet meer kunnen opschuiven. Het materiaal wordt harder maar ook **bros** (breekt in plaats van vervormt).\n- Een **legering** is een mengsel van twee of meer (meestal) samengesmolten metalen, zoals soldeer (tin+lood) of witgoud (goud+palladium).\n\n**Reactiviteit en winning:** De meeste metalen reageren met zuurstof: dit heet **corrosie** (bekendste vorm: roest van ijzer). Metalen die hier nauwelijks last van hebben (zoals goud en platina) heten **edelmetalen** en komen als element in de aardkorst voor; alle andere (**onedele metalen**) komen alleen als verbinding voor (in een **erts**) en moeten er met chemische reacties uitgehaald worden, bijv.: Fe₂O₃(s) + 3 CO(g) → 2 Fe(s) + 3 CO₂(g).",
        "- **Metaalbinding:** De sterke aantrekking tussen positieve atoomresten en vrij bewegende elektronen in een metaal.\n- **Metaalrooster:** De regelmatige rangschikking van atoomresten in een vast metaal.\n- **Legering:** Een mengsel van twee of meer metalen (soms met een niet-metaal), met aangepaste eigenschappen zoals hardheid.\n- **Corrosie:** De aantasting van een metaal door stoffen uit de lucht (bijv. roest).\n- **Edelmetaal / onedel metaal:** Een metaal dat nauwelijks, respectievelijk wel, reageert met de omgeving."
      ),
      schPara(
        '2.4 Ionbinding',
        "- Je kunt een beschrijving geven van een ionbinding en uitleggen waar de sterkte van deze binding van afhangt.\n- Je kunt zouten herkennen aan de atomaire samenstelling (formule) en de microstructuur van een zout beschrijven.\n- Je kent de algemene eigenschappen van een zout en kunt die koppelen aan de microstructuur.\n- Je kunt uitleggen welke bindingen verbroken/gevormd worden bij reacties en faseovergangen, en hier een kloppende vergelijking van geven.",
        "**Zouten op microniveau:** Een metaalatoom kan in plaats van een metaalbinding ook een of meer elektronen afstaan aan een niet-metaalatoom. Beide bereiken dan de edelgasconfiguratie, en er ontstaan geladen deeltjes: **ionen** (ladingen na te slaan in Binas tabel 40A).\n- Bijvoorbeeld: 2 Na(s) + Cl₂(g) → 2 NaCl(s). Natrium staat elektronen af (wordt Na⁺), chloor neemt ze op (wordt Cl⁻).\n- De positieve en negatieve ionen trekken elkaar sterk aan: dit heet de **ionbinding**, en de stof die zo ontstaat is een **zout** (bijv. keukenzout, NaCl). In de vaste fase liggen de ionen in een regelmatig, afwisselend patroon: het **ionrooster**.\n- De lading die een atoom krijgt door elektronen op te nemen/af te staan heet de **elektrovalentie** (bijv. O²⁻ heeft elektrovalentie −2). Een zout is altijd elektrisch neutraal in totaal — de indexen in de zoutformule (zoals Al₂O₃) zorgen daarvoor.\n\n**Eigenschappen van zouten:**\n- **Smelt-/kookpunt:** door de sterke ionbinding zijn zouten bij kamertemperatuur vast, met hoge smelt- en kookpunten. De binding is sterker naarmate de ionlading groter is en de ionen dichter bij elkaar zitten.\n- **Elektrische geleidbaarheid:** een vast zout geleidt geen stroom (ionen zitten muurvast in het rooster). Gesmolten of opgelost (in water) komen de ionen wél los van elkaar en kunnen ze vrij bewegen — dan geleidt het zout wél stroom.\n- **Hard en bros:** een zout weerstaat kracht goed tot een rij ionen verschuift; dan komen gelijke ladingen naast elkaar te staan, die elkaar afstoten, waardoor de stof breekt (in plaats van vervormt zoals een metaal).\n\n**Overzicht bindingstypen:** Atoombinding (tussen niet-metalen, zeer sterk), vanderwaalsbinding (tussen moleculen, zwak tot sterk), waterstofbrug (tussen dipoolmoleculen met -OH/-NH/C=O, sterk), metaalbinding (tussen metaalatomen, redelijk tot zeer sterk) en ionbinding (tussen ionen, zeer sterk).",
        "- **Ion:** Een geladen deeltje, ontstaan doordat een atoom een of meer elektronen heeft opgenomen of afgestaan.\n- **Ionbinding:** De sterke aantrekking tussen positieve en negatieve ionen.\n- **Ionrooster:** De regelmatige, afwisselende rangschikking van positieve en negatieve ionen in een vast zout.\n- **Elektrovalentie:** De lading die een atoom krijgt door elektronen op te nemen of af te staan.\n- **Zout:** Een verbinding van metaal- en niet-metaalionen, gebonden door een ionbinding."
      )
    ]
  };

  var SCHEIKUNDE_H3 = {
    id: uid('c'), title: 'Hoofdstuk 3: Organische verbindingen',
    paragraphs: [
      schPara(
        '3.1 Koolstofverbindingen',
        "- Je kunt aangeven dat molecuulformules van verschillende organische verbindingen identiek aan elkaar kunnen zijn (structuurisomerie).\n- Je kunt in moleculen van organische verbindingen functionele en/of karakteristieke groepen herkennen.",
        "**Organische verbindingen:** Koolstofverbindingen bestaan voornamelijk uit koolstof- en waterstofatomen, met soms andere atoomsoorten erbij. Omdat ze grotendeels van levende organismen afkomstig zijn, heten ze ook wel **organische verbindingen**.\n\n**Alkanen:** In **alkanen** (algemene formule CₙH₂ₙ₊₂) zijn alleen koolstof- en waterstofatomen aanwezig, verbonden door enkelvoudige atoombindingen. Omdat het maximale aantal H-atomen gebonden is, heten alkanen ook **verzadigde koolwaterstoffen**. De eerste tien alkanen (methaan t/m decaan) moet je uit je hoofd kennen — ze vormen de basis van veel organische namen.\n\n**Structuurisomerie:** Vanaf vier C-atomen kan één molecuulformule bij meerdere structuurformules horen: een **onvertakte** of een **vertakte** koolstofketen. Stoffen met dezelfde molecuulformule maar een andere structuurformule heten **isomeren** — het zijn verschillende stoffen met verschillende eigenschappen (zoals kookpunt) en dus ook verschillende namen.\n- Voor overzichtelijkheid kun je een structuurformule vereenvoudigen tot een **skeletweergave**: elk streepje is een C-C-binding, elk hoekpunt een C-atoom, en H-atomen worden weggelaten.\n\n**Onverzadigde koolwaterstoffen:** Bevat een molecuul een dubbele binding, dan spreek je van een **alkeen** (CₙH₂ₙ); bij een drievoudige binding van een **alkyn** (CₙH₂ₙ₋₂). Zulke stoffen heten onverzadigd omdat er nog H-atomen bij zouden kunnen als de meervoudige binding een enkelvoudige wordt. Een alkaan in ringvorm heet een **cycloalkaan** (twee H-atomen minder dan het rechte alkaan met evenveel C-atomen — dus isomeer van het overeenkomstige alkeen).\n\n**Benzeen:** Een cyclische koolwaterstof met 6 C-atomen en 3 dubbele bindingen, waarvan de elektronen zich vrij door de ring bewegen (vaak getekend als cirkel in een zeshoek). Dit maakt benzeen extra stabiel en weinig reactief. Verbindingen met een benzeenring heten **benzeenderivaten**.\n\n**Karakteristieke en functionele groepen:** Vervang je een H-atoom door een ander atoom/atoomgroep met een andere atoomsoort dan C of H, dan ontstaat een **karakteristieke groep** (Binas 66D); deze bepaalt meestal het meest de eigenschappen van de stof. Dubbele/drievoudige bindingen zijn zelf geen karakteristieke groep maar wel een **functionele groep** (ze beïnvloeden ook de reactiviteit).\n- **Alkaanzuren** (–COOH): reactief, laten de pH dalen bij oplossen in water (bijv. ethaanzuur/azijnzuur).\n- **Alkanolen** (–OH): o.a. ethanol (alcohol).\n- **Alkaanaminen** (–NH₂): sterk ruikend, komen in de natuur voor als aminozuren.\n- **Halogeenalkanen** (–F, –Cl, –Br, –I): stabiel, gebruikt in kunststoffen/koelmiddelen, breken slecht af (milieurisico).",
        "- **Organische verbinding:** Een koolstofverbinding, van oorsprong afkomstig van levende organismen.\n- **Alkaan:** Verzadigde koolwaterstof met alleen enkelvoudige C-C-bindingen (CₙH₂ₙ₊₂).\n- **Isomeren:** Stoffen met dezelfde molecuulformule maar een andere structuurformule (en dus andere eigenschappen).\n- **Alkeen / alkyn:** Onverzadigde koolwaterstof met een dubbele, respectievelijk drievoudige binding.\n- **Cycloalkaan:** Een alkaan in ringvorm.\n- **Benzeen:** Stabiele cyclische koolwaterstof met 6 C-atomen en verdeelde dubbele bindingen.\n- **Karakteristieke groep:** Een atoomgroep (met een andere atoomsoort dan C/H) die de eigenschappen van een organische stof grotendeels bepaalt."
      ),
      schPara(
        '3.2 Systematische naamgeving',
        "- Je kunt met behulp van de structuurformule van koolstofverbindingen met maximaal twee soorten functionele en/of karakteristieke groepen de systematische naam aangeven, en omgekeerd.",
        "**Systematische naam:** De IUPAC heeft internationale afspraken gemaakt zodat uit één **systematische naam** altijd maar één structuurformule te tekenen is (Binas 66C/66D). Sommige stoffen hebben daarnaast een bekende **triviale naam** (bijv. alcohol = ethanol).\n\n**Opbouw van de naam:**\n- **Stam:** de langste C-keten waarin/waaraan alle functionele groepen zitten, bepaald door het aantal C-atomen (meth-, eth-, prop-, but-, ...).\n- **Uitgang:** hangt af van dubbele/drievoudige bindingen: -aan (geen), -een (dubbel), -yn (drievoudig).\n- **Achtervoegsel:** voor de belangrijkste karakteristieke groep (max. 1 per naam), bijv. -zuur, -ol, -amine.\n- **Voorvoegsel:** voor overige groepen/takken, bijv. hydroxy-, amino-, halogeen-, of een alkylgroep (methyl-, ethyl-, ...).\n- **Numeriek voorvoegsel:** geeft aan hoe vaak een groep voorkomt (di-, tri-, tetra-; 'mono-' wordt weggelaten).\n- **Plaatsnummers:** geven aan op welk C-atoom een groep/binding zit; de belangrijkste groep krijgt het laagst mogelijke nummer.\n\n**Stappenplan:**\n- Stap 1 — Stamnaam: bepaal de langste keten met alle functionele groepen, en de uitgang.\n- Stap 2 — Achtervoegsel/voorvoegsels: belangrijkste groep krijgt het achtervoegsel, de rest een voorvoegsel; numerieke voorvoegsels bij herhaling.\n- Stap 3 — Nummering: nummer zo dat achtervoegsel → dubbele binding → drievoudige binding → voorvoegsel de laagst mogelijke nummers krijgen.\n- Stap 4 — Systematische naam: zet voorvoegsels (alfabetisch) — stam — uitgang — achtervoegsel achter elkaar, met komma's tussen cijfers en streepjes tussen cijfer en letter.\n\n**Bijzonderheid –COOH:** Zit het C-atoom van de zuurgroep in de hoofdketen, dan is het achtervoegsel -zuur; zit het er niet in (bijv. bij een cyclische stam), dan is het -carbonzuur.",
        "- **Systematische naam:** De internationaal afgesproken (IUPAC-)naam die eenduidig naar precies één structuurformule verwijst.\n- **Triviale naam:** Een gangbare, niet-systematische naam voor een stof (bijv. alcohol).\n- **Stam(naam):** Het deel van de naam gebaseerd op de langste C-keten met alle functionele groepen, plus de uitgang.\n- **Voorvoegsel / achtervoegsel:** De naamdelen die respectievelijk secundaire en de belangrijkste karakteristieke groep aanduiden.\n- **Numeriek voorvoegsel:** Geeft aan hoe vaak eenzelfde groep/tak voorkomt (di-, tri-, tetra-)."
      ),
      schPara(
        '3.3 Brandstoffen',
        "- Je kunt in berekeningen aan en beschrijvingen van chemische processen het molair volume en de volumeverhouding van gassen gebruiken.\n- Je kunt de reactievergelijking geven van de volledige verbranding van verbindingen van koolstof, waterstof, zwavel en zuurstof.\n- Je kunt beschrijven hoe energie wordt vastgelegd in organische verbindingen en welke (chemische) processen worden gebruikt om deze energie weer vrij te maken.\n- Je kunt de duurzaamheid van een brandstof beoordelen op basis van de koolstofkringloop en de optredende emissies bij verbranding.",
        "**Koolstofkringloop:** Planten en algen leggen via fotosynthese lichtenergie vast als chemische energie: 6 CO₂(g) + 6 H₂O(l) → C₆H₁₂O₆(s) + 6 O₂(g). Sterft de plant, dan komt de CO₂ weer vrij: de **koolstofkringloop**. Fossiele brandstoffen ontstonden doordat dode organismen miljoenen jaren onder druk en hitte werden omgezet in koolwaterstoffen. Omdat ze veel sneller worden verbruikt dan opnieuw gevormd, raakt de voorraad op en verstoort de vrijkomende CO₂ de kringloop.\n\n**Fossiele brandstoffen:** Ruwe aardolie is een mengsel dat via **gefractioneerde destillatie** wordt gescheiden in **fracties** (benzine, diesel, kerosine, grondstof voor plastics/medicijnen/verf, etc.).\n\n**Emissies:** Bij volledige verbranding ontstaan de oxiden van de aanwezige atoomsoorten: C → CO₂(g), H → H₂O(l), S → SO₂(g). Bij hoge verbrandingstemperaturen ontstaan ook **stikstofoxiden (NOₓ)** doordat luchtstikstof met zuurstof reageert — deze dragen bij aan fijnstof, verzuring van de bodem en verstoring van het natuurlijk evenwicht (afname biodiversiteit).\n\n**Biobrandstoffen:** Gemaakt uit biomassa (planten/organismen). Omdat de CO₂ die vrijkomt bij verbranding kortgeleden uit de lucht is opgenomen door de planten, blijft de atmosferische CO₂-concentratie ongeveer gelijk — biobrandstoffen zijn dus in principe duurzaam. Kanttekeningen: productie kan zelf veel energie kosten, en voor teelt (mais, suikerriet, palmolie) wordt soms oerwoud gekapt.\n- **Bio-ethanol:** via vergisting van glucosehoudend materiaal: C₆H₁₂O₆(aq) → 2 C₂H₆O(aq) + 2 CO₂(g). Wordt bijgemengd in benzine (bijv. E10 = 10 vol% bio-ethanol).\n- **Biodiesel:** gewonnen uit plantaardige olie (in Europa vaak koolzaad).\n- **Biogas:** via vergisting van voedsel-/mestresten of rioolslib; bevat veel methaan en CO₂.\n\n**Molair volume:** In de gasfase is de afstand tussen moleculen zo groot dat het molecuul zelf verwaarloosbaar is t.o.v. de ingenomen ruimte. Daarom neemt 1 mol van elk willekeurig gas, bij dezelfde temperatuur en druk, hetzelfde volume in: het **molair volume Vₘ** (dm³ mol⁻¹).\n- Formule: V = n · Vₘ\n- Onthoud: Vₘ = 22,4 dm³ mol⁻¹ bij T = 273 K; Vₘ = 24,5 dm³ mol⁻¹ bij T = 298 K (beide bij p₀, zie Binas 7).",
        "- **Koolstofkringloop:** De cyclus waarin CO₂ door planten wordt vastgelegd en na verbranding/afsterven weer vrijkomt.\n- **Fractie:** Een groep koolwaterstoffen met vergelijkbare eigenschappen, verkregen door destillatie van aardolie.\n- **Emissie:** Een schadelijke stof die vrijkomt bij verbranding (bijv. CO₂, SO₂, NOₓ).\n- **Biobrandstof:** Een brandstof gemaakt uit biomassa, met per saldo weinig effect op de atmosferische CO₂-concentratie.\n- **Molair volume (Vₘ):** Het volume dat 1 mol van een willekeurig gas inneemt bij een gegeven temperatuur en druk."
      ),
      schPara(
        '3.4 Organische chemie',
        "- Je kunt aan de hand van een gegeven reactie een reactie met analoge verbindingen beschrijven.\n- Je kunt een verband leggen tussen de structuurformule van een (co)polymeer en de structuurformule(s) van het monomeer/de monomeren.",
        "**Organische synthese:** Nieuwe organische stoffen worden gemaakt via een **syntheseroute**: een reeks reacties waarbij goedkope grondstoffen stap voor stap worden omgezet in het gewenste product. Na elke stap wordt het tussenproduct gezuiverd en gecontroleerd, omdat er ook ongewenste nevenreacties optreden. Een syntheseroute geeft aan welke stoffen nodig zijn en wat ontstaat — het gaat hierbij niet om kloppende reactievergelijkingen zoals bij chemisch rekenen.\n\n**Analoge verbindingen:** De eigenschappen van een organische stof worden vooral bepaald door de functionele groepen. Werkt een syntheseroute voor één stof, dan lukt vaak een vergelijkbare (**analoge**) reactie ook met een molecuul dat dezelfde functionele groep heeft maar een iets andere structuur — zo ontstaan nieuwe stoffen met mogelijk net andere eigenschappen. Om zo'n analoge reactie te doorzien: kijk welke atoombinding verbroken/gevormd wordt en welke karakteristieke groepen daarbij precies betrokken zijn, en pas dat principe toe op de nieuwe beginstof.\n\n**Polymeren:** Kunststoffen bestaan uit heel lange ketens van 200 tot 2000 C-atomen: een **polymeer** (Grieks: poly = veel, meros = deel). De grondstofmoleculen die aan elkaar reageren heten **monomeren**. Bij dit type polymerisatie moet het monomeer minstens één dubbele binding hebben: die dubbele binding verdwijnt en er ontstaat een atoombinding tussen de C-atomen van naburige monomeren, waardoor een lange keten ontstaat met alle zijgroepen eraan.\n- Omdat een polymeer uit honderden/duizenden monomeren bestaat, teken je meestal maar een deel, met een \\~ aan beide kanten, of je tekent het herhalende stukje met het aantal eenheden buiten vierkante haken.\n- Monomeren zelf worden gemaakt via **kraakreacties**: grote koolstofmoleculen worden daarbij omgezet in kleinere, reactieve moleculen met een vergelijkbare opbouw, die vervolgens via analoge reacties tot de juiste monomeren worden omgezet.\n- Om van een stukje polymeer terug te redeneren naar het monomeer: neem twee opeenvolgende C-atomen uit de hoofdketen (met alles wat eraan vastzit), en zet daar weer een dubbele binding tussen terug.",
        "- **Syntheseroute:** Een reeks van reacties en zuiveringsstappen waarmee grondstoffen worden omgezet in een gewenst product.\n- **Analoge verbinding/reactie:** Een reactie die op dezelfde manier verloopt bij een molecuul met dezelfde functionele groep maar een andere structuur.\n- **Polymeer:** Een heel lange keten van C-atomen, opgebouwd uit vele monomeren.\n- **Monomeer:** De kleine grondstofmolecule waaruit een polymeer wordt opgebouwd (bevat minstens één dubbele binding).\n- **Kraakreactie:** Een reactie waarbij grote koolstofmoleculen worden omgezet in kleinere, reactieve moleculen."
      )
    ]
  };

  function load(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ console.error('localStorage niet beschikbaar', e); warnStorageBlocked(); }
    if(raw){
      try{
        var parsed = JSON.parse(raw);
        state.subjects = (parsed.subjects || []).map(normalizeSubject);
        state.planner = parsed.planner || JSON.parse(JSON.stringify(SEED_PLANNER));
        state.grades = parsed.grades || {};
      }catch(e){
        console.error('Kon opgeslagen data niet lezen', e);
      }
    }
    if(!state.subjects) state.subjects = [];
    if(!state.grades) state.grades = {};
    if(!state.planner){
      state.planner = JSON.parse(JSON.stringify(SEED_PLANNER));
    }
    if(!state.planner.title) state.planner.title = 'Planner';
    state.planner.weeks = (state.planner.weeks || []).map(normalizeWeek);

    var defaultSubjects = [SEED_SUBJECT, SEED_NEDERLANDS, SEED_ENGELS, SEED_ECONOMIE, SEED_SCHEIKUNDE, SEED_WISB, SEED_ANW, SEED_OO, SEED_LATIJN];
    defaultSubjects.forEach(function(def){

    var OLD_DEFAULT_PLANNER_LABELS = ['mentor','eng','ned','la','anw','wis b','econ','schei','nat','o&o'];
    state.planner.subjects = state.planner.subjects.filter(function(p){

    try{

      state.planner.weeks = (state.planner.weeks || []).map(normalizeWeek);
      state.grades = parsed.grades || state.grades;
      try{ localStorage.setItem(STORAGE_KEY, raw); }catch(e){}
      renderAll();

  function pushToFirebase(immediate){
    if(!fbReady || fbApplyingRemote) return;
    clearTimeout(fbSaveTimer);
    var doPush = function(){

      fbDocRef.set({ payload: payload, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(err){

  function insertAtCursor(textarea, text){
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var before = textarea.value.slice(0, start);
    var after = textarea.value.slice(end);
    var needsNlBefore = before.length && !before.endsWith('\n');
    var needsNlAfter = after.length && !after.startsWith('\n');
    var insert = (needsNlBefore ? '\n' : '') + text + (needsNlAfter ? '\n' : '');
    textarea.value = before + insert + after;
    textarea.dispatchEvent(new Event('input'));
    var pos = (before + insert).length;
    textarea.focus();
    textarea.setSelectionRange(pos, pos);
  }
