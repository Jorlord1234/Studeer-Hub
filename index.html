  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  var MATH_PLACEHOLDER_RE = /\uE000(\d+)\uE001/g;
  function extractMath(text){
    var mathStore = [];
    var replaced = text.replace(/\$\$([\s\S]+?)\$\$/g, function(_, tex){
      mathStore.push({ tex: tex.trim(), display: true });
      return '\uE000' + (mathStore.length-1) + '\uE001';
    });
    replaced = replaced.replace(/\$([^\$\n]+?)\$/g, function(_, tex){
      mathStore.push({ tex: tex.trim(), display: false });
      return '\uE000' + (mathStore.length-1) + '\uE001';
    });
    return { text: replaced, mathStore: mathStore };
  }
  function substituteMath(html, mathStore){
    return html.replace(MATH_PLACEHOLDER_RE, function(_, idx){
      var m = mathStore[parseInt(idx,10)];
      if(!m) return '';
      var escapedTex = escapeHtml(m.tex).replace(/"/g,'&quot;');
      return '<span class="' + (m.display ? 'math-block' : 'math-inline') + '" data-tex="' + escapedTex + '">' + escapedTex + '</span>';
    });
  }
  function typesetMath(container){
    if(!window.katex || !container) return;
    var els = container.querySelectorAll('.math-inline, .math-block');
    els.forEach(function(el){
      var tex = el.getAttribute('data-tex');
      try{
        window.katex.render(tex, el, { throwOnError: false, displayMode: el.classList.contains('math-block') });
      }catch(e){ /* leave the raw text visible */ }
    });
  }
  // Zet gerenderde content om HTML -> ook math-typesetting en levende dropdown-velden.

  function enhanceRenderedContent(container, getText, setText){

    dds.forEach(function(dd){

      var select = document.createElement('select');

        o.value = String(idx);

        if(idx === selectedIdx) o.selected = true;
        select.appendChild(o);
      });
      select.addEventListener('change', function(){

        var newOpts = options.map(function(opt, idx){ return (idx===newIdx ? '*' : '') + opt; });
        var newRaw = '[dropdown: ' + label + ' | ' + newOpts.join(', ') + ']';
        var text = getText();
        setText(text.replace(raw, newRaw));

      });
      wrap.appendChild(select);
      dd.replaceWith(wrap);
    });
  }
  function inlineFormat(s){
    var out = escapeHtml(s);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    out = out.replace(/(https?:\/\/[^\s<]+)/g, function(url){
      var clean = url.replace(/[.,;:!?)\]]+$/, '');
      var trail = url.slice(clean.length);
      return '<a href="' + clean + '" target="_blank" rel="noopener noreferrer">' + clean + '</a>' + trail;
    });
    return out;
  }
  var IMAGE_LINE_RE = /^!\[([^\]]*)\]\((data:image\/[a-zA-Z0-9.+-]+;base64,[^)]+)\)$/;
  var ATTACHMENT_LINE_RE = /^\[bijlage: ([^\]]+)\]\((data:[^)]+)\)$/;
  var DROPDOWN_LINE_RE = /^\[dropdown:\s*([^|]*)\|\s*(.+)\]$/;

  // ---------- Tabellen (Google Docs-achtige markdown-tabel-syntax) ----------
  function matchTableRow(line){
    if(!line || line.indexOf('|') === -1) return null;
    var trimmed = line.trim();
    if(trimmed.charAt(0) === '|') trimmed = trimmed.slice(1);
    if(trimmed.charAt(trimmed.length-1) === '|') trimmed = trimmed.slice(0, -1);
    if(!trimmed.trim()) return null;
    return trimmed.split('|').map(function(c){ return c.trim(); });
  }
  function isTableSeparatorRow(line){
    var cells = matchTableRow(line);
    if(!cells || !cells.length) return false;
    return cells.every(function(c){ return /^:?-{1,}:?$/.test(c.trim()); });
  }
  function tableCellAlign(sepCell){
    var c = (sepCell || '').trim();
    var left = c.charAt(0) === ':';
    var right = c.charAt(c.length-1) === ':';
    if(left && right) return 'center';
    if(right) return 'right';
    if(left) return 'left';
    return null;
  }

  function renderContent(text){
    if(!text || !text.trim()) return '<p class="empty">Nog leeg — klik op bewerken om iets toe te voegen.</p>';
    var extraction = extractMath(text);
    var mathStore = extraction.mathStore;
    var lines = extraction.text.split('\n');
    var html = '';
    var stack = []; // each entry: {depth, type: 'ul'|'ol'}
    var paraBuf = [];
    function flushPara(){
      if(paraBuf.length){ html += '<p>' + paraBuf.join(' ') + '</p>'; paraBuf = []; }
    }
    function closeToDepth(depth){
      while(stack.length && stack[stack.length-1].depth > depth){
        var top = stack.pop();
        html += '</li></' + top.type + '>';
      }
    }
    for(var i=0;i<lines.length;i++){
      var raw = lines[i];
      if(!raw.trim()){ flushPara(); continue; }
      var imgMatch = raw.trim().match(IMAGE_LINE_RE);
      if(imgMatch){
        flushPara();
        closeToDepth(-1);
        html += '<img class="content-image" src="' + imgMatch[2] + '" alt="' + escapeHtml(imgMatch[1]) + '">';
        continue;
      }
      var attMatch = raw.trim().match(ATTACHMENT_LINE_RE);
      if(attMatch){
        flushPara();
        closeToDepth(-1);
        html += '<a class="content-attachment" href="' + attMatch[2] + '" download="' + escapeHtml(attMatch[1]) + '">' + ICONS.attachment + '<span>' + escapeHtml(attMatch[1]) + '</span></a>';
        continue;
      }
      var ddMatch = raw.trim().match(DROPDOWN_LINE_RE);
      if(ddMatch){
        flushPara();
        closeToDepth(-1);
        var ddLabel = ddMatch[1].trim();
        var ddSelected = 0;
        var ddOpts = ddMatch[2].split(',').map(function(o){ return o.trim(); }).map(function(o, idx){
          if(o.charAt(0) === '*'){ ddSelected = idx; return o.slice(1).trim(); }
          return o;
        });
        var rawLine = raw.trim();
        html += '<span class="content-dropdown" data-raw="' + escapeHtml(rawLine).replace(/"/g,'&quot;') +
          '" data-label="' + escapeHtml(ddLabel).replace(/"/g,'&quot;') +
          '" data-options="' + escapeHtml(JSON.stringify(ddOpts)).replace(/"/g,'&quot;') +
          '" data-selected="' + ddSelected + '"></span>';
        continue;
      }
      var headerCells = matchTableRow(raw);
      if(headerCells && i+1 < lines.length && isTableSeparatorRow(lines[i+1])){
        flushPara();
        closeToDepth(-1);
        var aligns = matchTableRow(lines[i+1]).map(tableCellAlign);
        var bodyRows = [];
        var j = i+2;
        while(j < lines.length){
          var rowCells = matchTableRow(lines[j]);
          if(!rowCells) break;
          bodyRows.push(rowCells);
          j++;
        }
        html += '<table class="content-table"><thead><tr>';
        headerCells.forEach(function(cell, idx){
          var al = aligns[idx] ? ' style="text-align:' + aligns[idx] + '"' : '';
          html += '<th' + al + '>' + inlineFormat(cell) + '</th>';
        });
        html += '</tr></thead><tbody>';
        bodyRows.forEach(function(row){
          html += '<tr>';
          headerCells.forEach(function(_, idx){
            var cell = row[idx] !== undefined ? row[idx] : '';
            var al = aligns[idx] ? ' style="text-align:' + aligns[idx] + '"' : '';
            html += '<td' + al + '>' + inlineFormat(cell) + '</td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        i = j - 1;
        continue;
      }
      var listMatch = raw.match(/^(\s*)-\s+(.*)$/) || raw.match(/^(\s*)\d+[.)]\s+(.*)$/);
      var isOrdered = /^\s*\d+[.)]\s+/.test(raw);
      if(listMatch){
        flushPara();
        var depth = Math.floor(listMatch[1].length/2);
        var type = isOrdered ? 'ol' : 'ul';
        var content = inlineFormat(listMatch[2]);
        if(stack.length===0){
          html += '<' + type + '><li>' + content;
          stack.push({ depth: depth, type: type });
        } else if(depth > stack[stack.length-1].depth){
          html += '<' + type + '><li>' + content;
          stack.push({ depth: depth, type: type });
        } else if(depth === stack[stack.length-1].depth && type === stack[stack.length-1].type){
          html += '</li><li>' + content;
        } else if(depth === stack[stack.length-1].depth && type !== stack[stack.length-1].type){
          var switched = stack.pop();
          html += '</li></' + switched.type + '>';
          html += '<' + type + '><li>' + content;
          stack.push({ depth: depth, type: type });
        } else {
          closeToDepth(depth);
          if(stack.length && stack[stack.length-1].depth===depth && stack[stack.length-1].type===type){
            html += '</li><li>' + content;
          } else {
            if(stack.length && stack[stack.length-1].depth===depth){
              var switched2 = stack.pop();
              html += '</li></' + switched2.type + '>';
            }
            html += '<' + type + '><li>' + content;
            stack.push({ depth: depth, type: type });
          }
        }
      } else {
        closeToDepth(-1);
        paraBuf.push(inlineFormat(raw.trim()));
      }
    }
    flushPara();
    closeToDepth(-1);
    return substituteMath(html, mathStore);
  }

  // ---------- Tree rendering ----------
  var treeEl = document.getElementById('tree');
  var searchResultsEl = document.getElementById('search-results');

  function isExpanded(key){ return !!state.expanded[key]; }
  var draggedDragId = null, draggedDragKind = null;
  function reorderArrayById(arr, fromId, toId){
    var fromIdx = arr.findIndex(function(x){ return x.id === fromId; });
    var toIdx = arr.findIndex(function(x){ return x.id === toId; });
    if(fromIdx < 0 || toIdx < 0) return false;
    var item = arr.splice(fromIdx, 1)[0];
    toIdx = arr.findIndex(function(x){ return x.id === toId; });
    arr.splice(toIdx, 0, item);
    return true;
  }

  // ---------- Geneste paragrafen (sub-paragrafen, Google Docs-stijl slepen) ----------
  function locateParagraph(list, id){
    for(var i=0;i<list.length;i++){
      if(list[i].id === id) return { arr: list, idx: i, node: list[i] };
      var found = locateParagraph(list[i].children || [], id);
      if(found) return found;
    }
    return null;
  }
  function isDescendantParagraph(node, id){
    var kids = node.children || [];
    for(var i=0;i<kids.length;i++){
      if(kids[i].id === id) return true;
      if(isDescendantParagraph(kids[i], id)) return true;
    }
    return false;
  }
  function detachParagraph(rootList, id){
    var loc = locateParagraph(rootList, id);
    if(!loc) return null;
    loc.arr.splice(loc.idx, 1);
    return loc.node;
  }
  function moveParagraphRelative(chap, fromId, toId, after){
    if(fromId === toId) return false;
    var probe = locateParagraph(chap.paragraphs, fromId);
    if(!probe || isDescendantParagraph(probe.node, toId)) return false;
    var node = detachParagraph(chap.paragraphs, fromId);
    if(!node) return false;
    var toLoc = locateParagraph(chap.paragraphs, toId);
    if(!toLoc){ chap.paragraphs.push(node); return true; }
    toLoc.arr.splice(toLoc.idx + (after ? 1 : 0), 0, node);
    return true;
  }
  function nestParagraphUnder(chap, fromId, toId){
    if(fromId === toId) return false;
    var probe = locateParagraph(chap.paragraphs, fromId);
    if(!probe || isDescendantParagraph(probe.node, toId)) return false;
    var node = detachParagraph(chap.paragraphs, fromId);
    if(!node) return false;
    var toLoc = locateParagraph(chap.paragraphs, toId);
    if(!toLoc){ chap.paragraphs.push(node); return true; }
    if(!toLoc.node.children) toLoc.node.children = [];
    toLoc.node.children.push(node);
    return true;
  }

  function makeRow(opts){
    // opts: level, expandable, expandedKey, label, color, selected, onClick, actions:[{icon,title,onClick,danger}], addChild:{label,onClick}
    var wrap = document.createElement('div');
    wrap.className = 'tree-node level-' + opts.level;

    var row = document.createElement('div');
    row.className = 'tree-row' + (opts.selected ? ' selected' : '');
    row.addEventListener('click', function(e){
      if(e.target.closest('.row-actions')) return;
      if(opts.onClick) opts.onClick();
    });

    var caret = document.createElement('span');
    if(opts.expandable){
      caret.className = 'caret' + (isExpanded(opts.expandedKey) ? ' open' : '');
      caret.textContent = '▸';
      caret.addEventListener('click', function(e){ e.stopPropagation(); toggleExpanded(opts.expandedKey); });
    } else {
      caret.className = 'caret hidden-caret';
      caret.textContent = '▸';
    }
    row.appendChild(caret);

    if(opts.color){
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = opts.color;
      row.appendChild(dot);
    }

    var label = document.createElement('span');
    label.className = 'tree-label';
    label.textContent = opts.label;
    label.title = opts.label;
    row.appendChild(label);

    if(opts.actions && opts.actions.length){
      var actions = document.createElement('span');
      actions.className = 'row-actions';
      opts.actions.forEach(function(a){
        var btn = document.createElement('button');
        btn.className = 'icon-btn' + (a.danger ? ' danger' : '');
        btn.innerHTML = ICONS[a.icon];
        btn.title = a.title;
        btn.addEventListener('click', function(e){ e.stopPropagation(); a.onClick(); });
        actions.appendChild(btn);
      });
      row.appendChild(actions);
    }

    if(opts.draggable){
      row.draggable = true;
      row.addEventListener('dragstart', function(e){
        draggedDragId = opts.dragId;
        draggedDragKind = opts.dragKind;
        try{ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', opts.dragId); }catch(err){}
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', function(){
        row.classList.remove('dragging');
        draggedDragId = null; draggedDragKind = null;
      });
      if(opts.onNest){
        // Zone-detectie: bovenste/onderste 30% van de rij = ervoor/erna plaatsen (zelfde niveau),
        // middelste 40% = nesten als sub-item onder deze rij.
        row.addEventListener('dragover', function(e){
          if(draggedDragKind !== opts.dragKind || draggedDragId === opts.dragId) return;
          e.preventDefault();
          var rect = row.getBoundingClientRect();
          var ratio = (e.clientY - rect.top) / rect.height;
          row.classList.remove('drag-over-before','drag-over-after','drag-over-nest');
          if(ratio < 0.3) row.classList.add('drag-over-before');
          else if(ratio > 0.7) row.classList.add('drag-over-after');
          else row.classList.add('drag-over-nest');
        });
        row.addEventListener('dragleave', function(){
          row.classList.remove('drag-over-before','drag-over-after','drag-over-nest');
        });
        row.addEventListener('drop', function(e){
          e.preventDefault();
          var wasNest = row.classList.contains('drag-over-nest');
          var wasAfter = row.classList.contains('drag-over-after');
          row.classList.remove('drag-over-before','drag-over-after','drag-over-nest');
          if(draggedDragKind === opts.dragKind && draggedDragId && draggedDragId !== opts.dragId){
            if(wasNest) opts.onNest(draggedDragId, opts.dragId);
            else if(opts.onReorder) opts.onReorder(draggedDragId, opts.dragId, wasAfter);
          }
          draggedDragId = null; draggedDragKind = null;
        });
      } else {
        row.addEventListener('dragover', function(e){
          if(draggedDragKind !== opts.dragKind || draggedDragId === opts.dragId) return;
          e.preventDefault();
          row.classList.add('drag-over');
        });
        row.addEventListener('dragleave', function(){ row.classList.remove('drag-over'); });
        row.addEventListener('drop', function(e){
          e.preventDefault();
          row.classList.remove('drag-over');
          if(draggedDragKind === opts.dragKind && draggedDragId && draggedDragId !== opts.dragId){
            if(opts.onReorder) opts.onReorder(draggedDragId, opts.dragId);
          }
          draggedDragId = null; draggedDragKind = null;
        });
      }
    }

    wrap.appendChild(row);
    return wrap;
  }

  // ---------- Search ----------
  function renderSearchResults(){
    var q = state.searchQuery.trim().toLowerCase();
    var results = [];
    state.subjects.forEach(function(subj){
      (subj.chapters || []).forEach(function(chap){
        function searchParas(list){
          (list || []).forEach(function(para){
            var haystack = para.title.toLowerCase();
            var matchSection = null, snippet = '';
            para.sections.forEach(function(sec){
              haystack += ' ' + sec.label.toLowerCase() + ' ' + sec.content.toLowerCase();
              if(!matchSection && sec.content.toLowerCase().indexOf(q) !== -1){
                matchSection = sec;
              }
            });
            if(para.title.toLowerCase().indexOf(q) !== -1 || haystack.indexOf(q) !== -1){
              if(matchSection){
                var idx = matchSection.content.toLowerCase().indexOf(q);
                var start = Math.max(0, idx-40);
                snippet = (start>0?'…':'') + matchSection.content.substring(start, idx+q.length+60).replace(/\n/g,' ') + '…';
              }
              results.push({ subj:subj, chap:chap, para:para, snippet: snippet });
            }
            searchParas(para.children);
          });
        }
        searchParas(chap.paragraphs);
      });
      (subj.books || []).forEach(function(book){ pushItemSearchResult(results, subj, book, q); });
      (subj.notes || []).forEach(function(note){ pushItemSearchResult(results, subj, note, q); });
      (subj.portfolioItems || []).forEach(function(item){ pushItemSearchResult(results, subj, item, q); });
    });

    searchResultsEl.innerHTML = '';
    if(results.length===0){
      var none = document.createElement('div');
      none.className = 'no-results';
      none.textContent = 'Niets gevonden voor "' + state.searchQuery + '".';
      searchResultsEl.appendChild(none);
      return;
    }
    results.forEach(function(r){
      var el = document.createElement('div');
      el.className = 'search-result';
      var path = document.createElement('div');
      path.className = 'path';
      path.textContent = r.subj.name + (r.chap ? ' › ' + r.chap.title : '');
      var title = r.para ? r.para.title : r.item.title;
      var snippet = document.createElement('div');
      snippet.className = 'snippet';
      snippet.innerHTML = highlightMatch(title, state.searchQuery) + (r.snippet ? '<br><span style="color:var(--text-soft);font-size:12.5px;">' + highlightMatch(escapeHtml(r.snippet), state.searchQuery) + '</span>' : '');
      el.appendChild(path);
      el.appendChild(snippet);
      el.addEventListener('click', function(){
        document.getElementById('search').value = '';
        state.searchQuery = '';
        state.expanded[r.subj.id] = true;
        if(r.chap){
          state.expanded[r.subj.id+'|'+r.chap.id] = true;
          selectPath(r.subj.id, r.chap.id, r.para.id);
        } else {
          selectItem(r.subj.id, r.item.id);
        }
      });
      searchResultsEl.appendChild(el);
    });
  }
  function pushItemSearchResult(results, subj, item, q){
    var haystack = item.title.toLowerCase();
    var matchSec = null, snippet = '';
    (item.sections || []).forEach(function(sec){
      haystack += ' ' + sec.label.toLowerCase() + ' ' + sec.content.toLowerCase();
      if(!matchSec && sec.content.toLowerCase().indexOf(q) !== -1){ matchSec = sec; }
    });
    if(item.content){
      haystack += ' ' + item.content.toLowerCase();
      if(!matchSec && item.content.toLowerCase().indexOf(q) !== -1){ matchSec = { content: item.content }; }
    }
    if(haystack.indexOf(q) === -1) return;
    if(matchSec){
      var idx = matchSec.content.toLowerCase().indexOf(q);
      var start = Math.max(0, idx-40);
      snippet = (start>0?'…':'') + matchSec.content.substring(start, idx+q.length+60).replace(/\n/g,' ') + '…';
    }
    results.push({ subj: subj, chap: null, para: null, item: item, snippet: snippet });
  }
  function highlightMatch(text, q){
    if(!q) return text;
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return text.replace(re, '<mark>$1</mark>');
  }

  function renderBreadcrumb(){
    breadcrumbEl.innerHTML = '';
    if(state.view === 'planner'){
      var bb = document.createElement('b');
      bb.textContent = 'Planner';
      breadcrumbEl.appendChild(bb);
      return;
    }
    if(state.view === 'grades'){
      var bg = document.createElement('b');
      bg.textContent = 'Cijfers';
      breadcrumbEl.appendChild(bg);
      return;
    }
    if(state.view === 'home'){
      var bh = document.createElement('b');
      bh.textContent = 'Home';
      breadcrumbEl.appendChild(bh);
      return;
    }
    var subj = state.selected.subjectId ? getSubject(state.selected.subjectId) : null;
    if(!subj){ breadcrumbEl.textContent = 'Kies een vak om te beginnen'; return; }
    var parts = [subj.name];
    var chap = state.selected.chapterId ? getChapter(subj.id, state.selected.chapterId) : null;
    if(chap) parts.push(chap.title);
    var para = state.selected.paragraphId && chap ? getParagraph(subj.id, chap.id, state.selected.paragraphId) : null;
    if(para) parts.push(para.title);
    if(!chap){
      var found = findSubjectItem(subj, state.selected.itemId);
      if(found) parts.push(found.item.title);
    }

    parts.forEach(function(p, i){
      if(i>0){
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '›';
        breadcrumbEl.appendChild(sep);
      }
      var span = document.createElement('span');
      if(i===parts.length-1){
        var b = document.createElement('b');
        b.textContent = p;
        span.appendChild(b);
      } else {
        span.textContent = p;
      }
      breadcrumbEl.appendChild(span);
    });
  }

  function renderContentPanel(){
    contentEl.innerHTML = '';
    contentEl.classList.toggle('wide', state.view === 'planner' || state.view === 'grades' || state.view === 'home');

    if(state.view === 'planner'){
      renderPlannerPanel();
      return;

    if(state.view === 'grades'){
      renderGradesPanel();
      return;
    }
    if(state.view === 'home'){
      renderHomePanel();
      return;
    }

    var subj = state.selected.subjectId ? getSubject(state.selected.subjectId) : null;

    if(!subj){
      renderHomePanel();
      return;
    }

    // a chapter/paragraph was selected -> samenvatting-style view
    if(state.selected.chapterId){
      var chap = getChapter(subj.id, state.selected.chapterId);
      if(!chap){
        contentEl.innerHTML = '<div class="empty-state"><h2>' + escapeHtml(subj.name) + '</h2><p>Kies links iets, of voeg iets toe met "＋ Nieuw...".</p></div>';
        return;
      }
      var para = state.selected.paragraphId ? getParagraph(subj.id, chap.id, state.selected.paragraphId) : null;
      if(!para){
        contentEl.innerHTML = '<div class="empty-state"><h2>' + escapeHtml(chap.title) + '</h2><p>Kies links een paragraaf, of voeg er een toe met "＋ Paragraaf toevoegen".</p></div>';
        return;
      }

      var titleRow = document.createElement('div');
      titleRow.className = 'paragraph-title-row';
      var h1 = document.createElement('h1');
      h1.className = 'paragraph-title';
      h1.textContent = para.title;
      titleRow.appendChild(h1);
      contentEl.appendChild(titleRow);

      contentEl.appendChild(renderSectionsBlock(subj, chap, para));
      return;
    }

    // a book / note / portfolio item was selected
    if(state.selected.itemId){
      var found = findSubjectItem(subj, state.selected.itemId);
      if(found){
        if(found.kind === 'book'){ renderBookPanel(subj, found.item); return; }
        if(found.kind === 'note'){ renderNotePanel(subj, found.item); return; }
        if(found.kind === 'portfolio'){ renderPortfolioPanel(subj, found.item); return; }
      }
    }

    // nothing selected within this subject yet
    var hasAnything = (subj.chapters||[]).length || (subj.books||[]).length || (subj.notes||[]).length || (subj.portfolioItems||[]).length;
    contentEl.innerHTML = '<div class="empty-state"><h2>' + escapeHtml(subj.name) + '</h2><p>' +
      (hasAnything ? 'Kies links iets, of voeg iets nieuws toe met "＋ Nieuw...".' : 'Dit vak is nog leeg. Klik links op "＋ Nieuw..." om te beginnen — een hoofdstuk, boek, notitie of portfolio-onderdeel.') +
      '</p></div>';
  }

  function renderSectionCard(subj, chap, para, sec, opts){
    opts = opts || {};
    var card = document.createElement('div');
    card.className = 'section-card';

    var head = document.createElement('div');
    head.className = 'section-head';

    var isEditing = state.editingSection === sec.id;

    if(isEditing && !opts.fixedLabel){
      var labelInput = document.createElement('input');
      labelInput.className = 'section-label-input';
      labelInput.type = 'text';
      labelInput.value = sec.label;
      labelInput.addEventListener('input', function(){ sec.label = labelInput.value; });
      head.appendChild(labelInput);
    } else {
      var label = document.createElement('span');
      label.className = 'section-label';
      label.textContent = sec.label;
      head.appendChild(label);
    }

    var headActions = document.createElement('span');
    headActions.className = 'row-actions';
    headActions.style.display = 'flex';

    if(isEditing){
      var doneBtn = iconBtn('check', 'Klaar');
      doneBtn.addEventListener('click', function(){
        save();
        state.editingSection = null;
        renderContentPanel();
      });
      headActions.appendChild(doneBtn);

      if(!opts.hideDelete){
        var delSecBtn = iconBtn('trash', null, 'icon-btn danger');
        delSecBtn.title = 'Sectie verwijderen';
        delSecBtn.addEventListener('click', function(){
          if(confirm('Sectie "' + sec.label + '" verwijderen?')){
            para.sections = para.sections.filter(function(s){ return s.id!==sec.id; });
            save();
            state.editingSection = null;
            renderContentPanel();
          }
        });
        headActions.appendChild(delSecBtn);
      }
    } else {
      var editBtn = iconBtn('edit', 'Bewerken');
      editBtn.addEventListener('click', function(){
        state.editingSection = sec.id;
        renderContentPanel();
      });
      headActions.appendChild(editBtn);
    }
    head.appendChild(headActions);
    card.appendChild(head);

    var body = document.createElement('div');
    body.className = 'section-body';

    if(isEditing){
      var textarea = document.createElement('textarea');
      textarea.value = sec.content;
      textarea.placeholder = opts.placeholder || '- Typ hier je bullets, één per regel\n  - inspringen met 2 spaties voor een sub-bullet\n\nGewone tekst zonder streepje wordt een alinea.\nGebruik **dit** voor vetgedrukt.';
      textarea.addEventListener('input', function(){ sec.content = textarea.value; });
      body.appendChild(attachMediaButtons(textarea));
      body.appendChild(textarea);
      var hint = document.createElement('div');
      hint.className = 'edit-hint';
      hint.textContent = 'Tip: "- " voor een bullet (2 spaties inspringen voor sub-bullet), **vet** voor nadruk, $..$ voor een formule, en gebruik de knoppen hierboven voor afbeeldingen, bestanden, tabellen en dropdown-velden.';
      body.appendChild(hint);
    } else {
      body.innerHTML = renderContent(sec.content);
      enhanceRenderedContent(body, function(){ return sec.content; }, function(v){ sec.content = v; });
    }
    card.appendChild(body);
    return card;
  }

  function formatWeekHeading(startDateISO){
    var months = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
    var monday = dateFromISO(startDateISO);
    var sunday = addDays(monday, 6);
    if(monday.getMonth() === sunday.getMonth()){
      return monday.getDate() + ' - ' + sunday.getDate() + ' ' + months[monday.getMonth()];
    }
    return monday.getDate() + ' ' + months[monday.getMonth()] + ' - ' + sunday.getDate() + ' ' + months[sunday.getMonth()];
  }
  function getOrCreateWeek(startISO){
    var w = state.planner.weeks.find(function(x){ return x.startDate === startISO; });

    return w;

  function getCellData(week, subjId, dayKey){
    var raw = week.cells[subjId] && week.cells[subjId][dayKey];
    if(!raw) return { text:'', done:false, important:false };
    if(typeof raw === 'string') return { text: raw, done:false, important:false };
    return { text: raw.text || '', done: !!raw.done, important: !!raw.important };
  }
  function setCellData(week, subjId, dayKey, data){
    if(!week.cells[subjId]) week.cells[subjId] = {};
    week.cells[subjId][dayKey] = data;
  }

  function createDateDropdowns(currentISO, onChange){
    var wrap = document.createElement('span');
    wrap.className = 'date-dropdowns';
    var d = currentISO ? dateFromISO(currentISO) : null;

    var dayInput = document.createElement('input');
    dayInput.type = 'text';
    dayInput.inputMode = 'numeric';
    dayInput.maxLength = 2;
    dayInput.className = 'date-dd date-input-manual date-input-day';
    dayInput.title = 'Dag (typ en druk op Enter)';
    dayInput.placeholder = 'dd';
    dayInput.value = d ? d.getDate() : '';

    var monthSel = document.createElement('select');
    monthSel.className = 'date-dd date-dd-month';
    monthSel.title = 'Maand';
    var emptyOpt = document.createElement('option');
    emptyOpt.value = '';
    emptyOpt.textContent = '-';
    if(!d) emptyOpt.selected = true;
    monthSel.appendChild(emptyOpt);
    MONTHS_SHORT.forEach(function(m, idx){
      var oM = document.createElement('option');
      oM.value = idx; oM.textContent = m;
      if(d && idx === d.getMonth()) oM.selected = true;
      monthSel.appendChild(oM);
    });

    var yearInput = document.createElement('input');
    yearInput.type = 'text';
    yearInput.inputMode = 'numeric';
    yearInput.maxLength = 4;
    yearInput.className = 'date-dd date-input-manual date-input-year';
    yearInput.title = 'Jaar (typ en druk op Enter)';
    yearInput.placeholder = 'jjjj';
    yearInput.value = d ? d.getFullYear() : '';

    function tryCommit(){
      var day = parseInt(dayInput.value, 10);
      var month = monthSel.value === '' ? NaN : parseInt(monthSel.value, 10);
      var year = parseInt(yearInput.value, 10);
      if(!day || day < 1 || day > 31 || isNaN(month) || !year || year < 1900 || year > 2100){
        return; // incomplete or invalid -- wait for the rest before doing anything
      }
      var newDate = new Date(year, month, day);
      if(newDate.getMonth() !== month){ newDate = new Date(year, month+1, 0); } // clamp overflow (e.g. 31 feb)
      onChange(isoDate(newDate));
    }
    dayInput.addEventListener('blur', tryCommit);
    dayInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ tryCommit(); dayInput.blur(); } });
    yearInput.addEventListener('blur', tryCommit);
    yearInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ tryCommit(); yearInput.blur(); } });
    monthSel.addEventListener('change', tryCommit);

    wrap.appendChild(dayInput);
    wrap.appendChild(monthSel);
    wrap.appendChild(yearInput);
    return wrap;
  }

    var targetISO = isoDate(dateObj);
    return state.planner.weeks.find(function(w){

      var endISO = isoDate(addDays(dateFromISO(w.startDate), 6));
      return targetISO >= w.startDate && targetISO <= endISO;

  }

  // ---------- Cijfers ----------
  function getGradesFor(subjId){
    if(!state.grades[subjId]) state.grades[subjId] = { items: [] };
    return state.grades[subjId];
  }
  function weightedAverage(items){
    var totalW = items.reduce(function(s,i){ return s + (parseFloat(i.weging)||0); }, 0);
    if(totalW === 0) return null;
    var totalP = items.reduce(function(s,i){ return s + (parseFloat(i.cijfer)||0) * (parseFloat(i.weging)||0); }, 0);
    return totalP / totalW;
  }

    table.appendChild(tbody);

    calcHead.appendChild(calcLabel);
    calcCard.appendChild(calcHead);
    var calcBody = document.createElement('div');

    calcBody.innerHTML =
      '<div class="grade-calc-row"><label>Gewenst gemiddelde</label><input type="number" step="0.1" id="grade-target" class="grade-input" placeholder="bijv. 6.5"></div>' +
      '<div class="grade-calc-row"><label>Weging van de volgende toets</label><input type="number" step="1" min="1" id="grade-next-weight" class="grade-input" value="1"></div>' +
      '<button class="btn primary" id="grade-calc-btn" style="margin-top:8px;">Bereken</button>' +
      '<div class="grade-calc-result" id="grade-calc-result"></div>';
    calcCard.appendChild(calcBody);
    contentEl.appendChild(calcCard);

    function updateGradeSummary(){
      var avg = weightedAverage(g.items);
      var el = document.getElementById('grade-summary');
      if(!el) return;
      el.innerHTML = avg === null
        ? '<p class="empty">Nog geen cijfers ingevuld.</p>'
        : '<div class="grade-avg">Gewogen gemiddelde: <b>' + avg.toFixed(2).replace('.', ',') + '</b></div>';
    }
    updateGradeSummary();

    document.getElementById('grade-calc-btn').addEventListener('click', function(){
      var target = parseFloat(document.getElementById('grade-target').value);
      var newW = parseFloat(document.getElementById('grade-next-weight').value) || 1;
      var resultEl = document.getElementById('grade-calc-result');
      if(isNaN(target)){
        resultEl.innerHTML = '<p class="empty">Vul eerst een gewenst gemiddelde in.</p>';
        return;
      }
      var totalW = g.items.reduce(function(s,i){ return s + (parseFloat(i.weging)||0); }, 0);
      var totalP = g.items.reduce(function(s,i){ return s + (parseFloat(i.cijfer)||0) * (parseFloat(i.weging)||0); }, 0);
      var needed = (target * (totalW + newW) - totalP) / newW;
      var msg = 'Je moet minimaal een <b>' + needed.toFixed(2).replace('.', ',') + '</b> halen.';
      if(needed > 10) msg += ' <span class="grade-warning">Dat is helaas niet meer haalbaar met een normaal cijfer.</span>';
      if(needed < 1) msg += ' <span class="grade-warning">Zelfs een 1 is al ruim voldoende — je zit al boven je doel.</span>';
      resultEl.innerHTML = '<p>' + msg + '</p>';
    });
  }

  // ---------- Generic overlay (small popups: add-item chooser, etc.) ----------
  function openOverlay(opts){
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var panel = document.createElement('div');
    panel.className = 'overlay-panel';
    panel.style.width = opts.width || '400px';
    panel.style.maxWidth = '92vw';

    var head = document.createElement('div');
    head.className = 'overlay-head';
    var h3 = document.createElement('h3');
    h3.textContent = opts.title;
    head.appendChild(h3);
    var closeBtn = document.createElement('button');
    closeBtn.className = 'icon-btn';
    closeBtn.innerHTML = ICONS.close;
    closeBtn.title = 'Sluiten';
    closeBtn.addEventListener('click', close);
    head.appendChild(closeBtn);
    panel.appendChild(head);

    var body = document.createElement('div');
    body.className = 'overlay-body';
    body.appendChild(opts.bodyEl);
    panel.appendChild(body);

    backdrop.appendChild(panel);
    document.body.appendChild(backdrop);

    function close(){
      if(backdrop.parentNode) document.body.removeChild(backdrop);
      document.removeEventListener('keydown', escHandler);
    }
    function escHandler(e){ if(e.key === 'Escape') close(); }
    document.addEventListener('keydown', escHandler);
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) close(); });

    return { close: close, body: body };
  }

  function openModal(opts){
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var modal = document.createElement('div');
    modal.className = 'modal';

    var h3 = document.createElement('h3');

    if(opts.sub){
      var sub = document.createElement('p');
      sub.className = 'sub';
      sub.textContent = opts.sub;
      modal.appendChild(sub);
    }

    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = opts.placeholder || '';
    input.value = opts.initial || '';
    modal.appendChild(input);

    var chosenColor = opts.initialColor || COLORS[state.subjects.length % COLORS.length];
    if(opts.showColors){
      var swatches = document.createElement('div');
      swatches.className = 'swatches';
      COLORS.forEach(function(c){
        var sw = document.createElement('div');
        sw.className = 'swatch' + (c===chosenColor ? ' selected' : '');
        sw.style.background = c;
        sw.addEventListener('click', function(){
          swatches.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('selected'); });
          sw.classList.add('selected');
          chosenColor = c;
        });
        swatches.appendChild(sw);
      });
      modal.appendChild(swatches);
    }

    var actions = document.createElement('div');
    actions.className = 'modal-actions';
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn';
    cancelBtn.textContent = 'Annuleren';
    cancelBtn.addEventListener('click', close);
    var confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn primary';
    confirmBtn.textContent = 'Opslaan';
    confirmBtn.addEventListener('click', function(){
      opts.onConfirm(input.value, chosenColor);
      close();
    });
    actions.appendChild(cancelBtn);
    actions.appendChild(confirmBtn);
    modal.appendChild(actions);

    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
    input.focus();
    input.select();

    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ opts.onConfirm(input.value, chosenColor); close(); }
      if(e.key==='Escape'){ close(); }
    });
    backdrop.addEventListener('click', function(e){ if(e.target===backdrop) close(); });

    function close(){ document.body.removeChild(backdrop); }
  }

  // ---------- Toast ----------
  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  // ---------- Export / Import ----------
  function exportData(){
    var blob = new Blob([JSON.stringify({ subjects: state.subjects, planner: state.planner }, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    var date = new Date().toISOString().slice(0,10);
    a.download = 'studeerhub-backup-' + date + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup gedownload');
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.subjects)) throw new Error('Ongeldig bestand');
        var replace = confirm('Bestand geladen: ' + parsed.subjects.length + ' vak(ken) gevonden.\n\nKlik OK om dit toe te voegen aan je huidige vakken, of Annuleren om te stoppen.');
        if(!replace) return;
        parsed.subjects.forEach(function(s){
          normalizeSubject(s);
          // avoid id collisions
          s.id = uid('subj');
          (s.chapters||[]).forEach(function(c){
            c.id = uid('chap');
            function reidParas(list){
              (list||[]).forEach(function(p){
                p.id = uid('para');
                (p.sections||[]).forEach(function(sec){ sec.id = uid('sec'); });
                reidParas(p.children);
              });
            }
            reidParas(c.paragraphs);
          });
          (s.books||[]).forEach(function(b){
            b.id = uid('book');
            (b.sections||[]).forEach(function(sec){ sec.id = uid('sec'); });
          });
          (s.notes||[]).forEach(function(n){ n.id = uid('note'); (n.sections||[]).forEach(function(sec){ sec.id = uid('sec'); }); });
          (s.portfolioItems||[]).forEach(function(p){ p.id = uid('pf'); (p.sections||[]).forEach(function(sec){ sec.id = uid('sec'); }); });
        });
        state.subjects = state.subjects.concat(parsed.subjects);

        if(parsed.planner){
          var oldIdToLabel = {};
          (parsed.planner.subjects || []).forEach(function(s){ oldIdToLabel[s.id] = s.label; });
          (parsed.planner.subjects || []).forEach(function(s){
            var exists = state.planner.subjects.some(function(existing){ return existing.label.toLowerCase() === s.label.toLowerCase(); });
            if(!exists){ state.planner.subjects.push({ id: uid('psub'), label: s.label }); }
          });
          (parsed.planner.weeks || []).forEach(function(w){
            var newWeek = normalizeWeek({ id: uid('week'), startDate: w.startDate, note: w.note || w.label || '', cells: {} });
            Object.keys(w.cells || {}).forEach(function(oldId){
              var lbl = oldIdToLabel[oldId];
              if(!lbl) return;
              var match = state.planner.subjects.find(function(s){ return s.label.toLowerCase() === lbl.toLowerCase(); });
              if(match) newWeek.cells[match.id] = w.cells[oldId];
            });
            state.planner.weeks.push(newWeek);
          });
          if(!state.planner.rules && parsed.planner.rules){ state.planner.rules = parsed.planner.rules; }
        }

        save();
        renderAll();
        toast('Import gelukt');
      }catch(e){
        alert('Kon dit bestand niet importeren: ' + e.message);
      }
    };
    reader.readAsText(file);
  }

  // ---------- Instellingen: paneel openen/sluiten ----------
  var settingsBtn = document.getElementById('settings-btn');
  var settingsPopover = document.getElementById('settings-popover');
  settingsBtn.addEventListener('click', function(e){
    e.stopPropagation();
    settingsPopover.classList.toggle('hidden');
  });
  document.addEventListener('click', function(e){
    if(!settingsPopover.classList.contains('hidden')){
      if(!settingsPopover.contains(e.target) && e.target !== settingsBtn){
        settingsPopover.classList.add('hidden');
      }
    }
  });

  // ---------- Thema ----------
  var themeLightOpt = document.getElementById('theme-option-light');
  var themeDarkOpt = document.getElementById('theme-option-dark');
  function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }
  function applyThemeUI(){
    var t = currentTheme();
    themeLightOpt.classList.toggle('active', t === 'light');
    themeDarkOpt.classList.toggle('active', t === 'dark');
  }
  function setTheme(next){
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('studeerhub_theme', next); }catch(e){}
    applyThemeUI();
  }
  themeLightOpt.addEventListener('click', function(){ setTheme('light'); });
  themeDarkOpt.addEventListener('click', function(){ setTheme('dark'); });
  applyThemeUI();

  // ---------- Focus-modus ----------
  var focusOffOpt = document.getElementById('focus-option-off');
  var focusOnOpt = document.getElementById('focus-option-on');
  var appEl = document.getElementById('app');
  var focusActive = false;
  function applyFocusUI(){
    appEl.classList.toggle('focus-active', focusActive);
    settingsBtn.classList.toggle('active', focusActive);
    focusOffOpt.classList.toggle('active', !focusActive);
    focusOnOpt.classList.toggle('active', focusActive);
  }
  focusOffOpt.addEventListener('click', function(){ focusActive = false; applyFocusUI(); });
  focusOnOpt.addEventListener('click', function(){ focusActive = true; applyFocusUI(); });
  applyFocusUI();

  // ---------- Tekstgrootte / regelafstand ----------
  var TEXT_SETTINGS_KEY = 'studeerhub_text_settings';
  var DEFAULT_TEXT_SETTINGS = { fontSize: 16, lineHeight: 1.6 };
  var fontSizeRange = document.getElementById('font-size-range');
  var lineHeightRange = document.getElementById('line-height-range');

  function loadTextSettings(){
    try{
      var raw = localStorage.getItem(TEXT_SETTINGS_KEY);
      if(raw) return Object.assign({}, DEFAULT_TEXT_SETTINGS, JSON.parse(raw));
    }catch(e){}
    return Object.assign({}, DEFAULT_TEXT_SETTINGS);
  }
  function applyTextSettings(s){
    document.documentElement.style.setProperty('--content-font-size', s.fontSize + 'px');
    document.documentElement.style.setProperty('--content-line-height', s.lineHeight);
    fontSizeRange.value = s.fontSize;
    lineHeightRange.value = s.lineHeight;
  }
  function saveTextSettings(s){
    try{ localStorage.setItem(TEXT_SETTINGS_KEY, JSON.stringify(s)); }catch(e){}
  }
  var textSettings = loadTextSettings();
  applyTextSettings(textSettings);

  fontSizeRange.addEventListener('input', function(){
    textSettings.fontSize = parseInt(fontSizeRange.value, 10);
    applyTextSettings(textSettings);
    saveTextSettings(textSettings);
  });
  lineHeightRange.addEventListener('input', function(){
    textSettings.lineHeight = parseFloat(lineHeightRange.value);
    applyTextSettings(textSettings);
    saveTextSettings(textSettings);
  });
  document.getElementById('text-settings-reset').addEventListener('click', function(){
    textSettings = Object.assign({}, DEFAULT_TEXT_SETTINGS);
    applyTextSettings(textSettings);
    saveTextSettings(textSettings);
  });

  // ---------- Wire up events ----------
  document.getElementById('add-subject-btn').addEventListener('click', addSubject);
  document.getElementById('planner-nav-btn').addEventListener('click', goToPlanner);
  document.getElementById('home-nav-btn').addEventListener('click', goToHome);
  document.getElementById('grades-nav-btn').addEventListener('click', goToGrades);
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', function(){
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });
  var searchInput = document.getElementById('search');
  var searchDebounce;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      state.searchQuery = searchInput.value;
      renderTree();
    }, 120);
  });

  // ---------- Init ----------
  load();
  // expand the seeded subject by default
  if(state.subjects.length){
    state.expanded[state.subjects[0].id] = true;
  }
  renderAll();
  initFirebaseSync();

})();
</script>
</body>
</html>
